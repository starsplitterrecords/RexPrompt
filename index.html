<style>
:root{color-scheme:light;--bg:#fff;--fg:#111;--muted:#666;--surface:#eee;--surface-soft:#f7f7f7;--border:#ddd;--control-bg:#fff;--control-fg:#111;--accent:#0645ad}
html[data-theme="dark"]{color-scheme:dark;--bg:#11151a;--fg:#e8edf2;--muted:#9aa7b3;--surface:#1c232b;--surface-soft:#171d24;--border:#36414d;--control-bg:#202832;--control-fg:#eef3f7;--accent:#8ab4ff}
body{font-family:sans-serif;padding:20px;margin:0;max-width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);transition:background .15s ease,color .15s ease}.container{max-width:100%;width:100%;overflow-x:hidden}select,button{margin:0 10px 20px 0;background:var(--control-bg);color:var(--control-fg);border:1px solid var(--border);border-radius:4px}select{min-width:260px;max-width:100%;padding:8px}button{font-size:1.1rem;padding:14px 20px;cursor:pointer}button:hover{filter:brightness(1.08)}pre{background:var(--surface);padding:10px;white-space:pre-wrap;word-wrap:break-word;max-width:100%;box-sizing:border-box;border:1px solid var(--border)}.block{margin-bottom:15px}.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.status{color:var(--muted);font-size:.9rem;margin:-8px 0 14px}.export-block{padding-top:8px;border-top:1px solid var(--border);margin-top:4px}.export-help{color:var(--muted);font-size:.85rem;margin:-8px 0 14px}.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.header-row h3{margin-right:auto}.theme-toggle{font-size:.9rem;padding:9px 13px;margin-bottom:10px}

.production-copy{background:var(--surface-soft)}
.production-next{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.production-upload-slot{min-width:0}

.production-upload-slot .visual-token-panel{margin-top:8px}
.production-dock .status{margin:7px 0 0;font-size:.78rem;line-height:1.35}

.production-section h4{margin:0 0 12px;font-size:1.05rem}
.production-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.production-section-head h4{margin:0}
.production-section-head button{margin:0;font-size:.82rem;padding:8px 12px}
#productionPreview .visual-workspace{margin:0}
#promptDetails pre{margin-top:10px;max-height:65vh;overflow:auto}
#productionExports .export-block{border-top:0;margin-top:0}
#productionUtilities{margin-top:12px}
#productionUtilities button{font-size:.82rem;margin:0;padding:8px 10px}
@media(max-width:640px){
body{padding:10px}
.production-dock{padding:9px 10px}
.production-selector-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.production-field:last-child{grid-column:1/-1}
.production-field select{font-size:.85rem;padding:7px}
.production-actions{gap:6px;margin-top:8px}
.production-actions>button,.production-upload-slot .visual-actions button{min-height:42px;padding:8px 5px;font-size:.82rem}
.production-section{padding:10px;margin-top:12px}
}
</style>

<body>
<div class="container">
<div class="header-row"><h3 id="appTitle">RexPrompt Assembler</h3><div class="mode-switch" role="group" aria-label="RexPrompt mode"><button id="assemblerModeBtn" type="button" aria-pressed="true">Assembler</button><button id="referenceKeeperModeBtn" type="button" aria-pressed="false">Reference Keeper</button></div><button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button></div>

</div>

<script>
const SHOW_MANIFEST="data/shows.json",DATA_FILES=["blocking.json","characters.json","dialogue.json","direction.json","factions.json","lighting.json","mood.json","negatives.json","regions.json","settings.json"];
async function loadJson(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");return r.json()}
async function loadOptionalJson(path){const r=await fetch(path,{cache:"no-store"});if(r.status===404)return null;if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");return r.json()}
async function loadEncodedJson(path,encoding){if(!encoding)return loadJson(path);if(encoding!=="gzip-base64")throw new Error("Unsupported scene encoding: "+encoding);if(typeof DecompressionStream==="undefined")throw new Error("This browser cannot decompress RexPrompt scene data. Update the browser and try again.");const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");const b64=(await r.text()).replace(/\s+/g,"");const binary=atob(b64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(stream).text())}
function joinPath(base,file){return String(base||"data").replace(/\/$/,"")+"/"+file}
function getHandle(id,c){const e=c[id];return e?e.handle||e.name||id:id}
function formatEntry(e){if(typeof e==="string")return e;if(e.text)return e.text;if(e.name)return e.name;if(e.summary)return e.summary;return JSON.stringify(e)}
function findCharacterByHandle(h,c){if(!h)return null;return Object.values(c||{}).find(e=>e&&(e.handle===h||(Array.isArray(e.aliases)&&e.aliases.includes(h))))}
function formatCharacter(e,fallback){if(!e)return fallback;const p=[e.name||fallback],structured=!!(e.wardrobe||e.performance||e.relationship||e.promptContinuity);if(e.handle)p.push(e.handle);const v=e.visualAnchor||e.visual||e.appearance||e.visualDescription;if(v)p.push((structured?"Identity: ":"Visual: ")+v);if(structured){if(e.wardrobe)p.push("Wardrobe: "+e.wardrobe);if(e.performance)p.push("Performance: "+e.performance);if(e.relationship)p.push("Relationship: "+e.relationship);if(Array.isArray(e.promptContinuity)&&e.promptContinuity.length)p.push("Continuity: "+e.promptContinuity.join("; "))}else{if(e.visualStatus)p.push("Visual status: "+e.visualStatus);if(Array.isArray(e.continuityLocks)&&e.continuityLocks.length)p.push("Continuity: "+e.continuityLocks.join("; "))}return p.join(" — ")}
// Visual reference tags represent canonical artwork identities, not every dialogue speaker.
// Anonymous page-local roles without a canonical handle remain in story/panels/dialogue;
// they never become invented image-reference handles. Explicit overrides stay strict.
function visibleCharacterHandles(scene,characters){
  const key=scene?.id||"unknown page";
  const explicit=scene?.promptVisibleCharacters;
  if(explicit!==undefined&&!Array.isArray(explicit))throw new Error("promptVisibleCharacters must be an array on "+key);
  const list=explicit!==undefined?explicit:(scene?.charactersInline?.length?scene.charactersInline:(scene?.characters||[]));
  const handles=[],seen=new Set();
  for(const item of list){
    const token=typeof item==="string"?item:(item?.handle||item?.id||item?.name);
    if(typeof token!=="string"||!token.trim())throw new Error("Invalid visible character on "+key+": "+String(token));
    const entry=characters[token]||findCharacterByHandle(token,characters)||
      Object.values(characters).find(c=>c?.name===token);
    if(!entry){
      // Keep the existing behavior for genuinely unregistered incidental names.
      if(explicit===undefined&&typeof item==="object"&&item!==null&&!item.handle&&typeof item.name==="string"&&item.name.trim())continue;
      throw new Error("Unknown visible character on "+key+": "+token);
    }
    // Some Low Tide and Sunforge characters lack approved image handles.
    // Keep only their authored visual description, not their development dossier.
    const visual=[entry.visualAnchor,entry.visual,entry.appearance,entry.visualDescription]
      .find(v=>typeof v==="string"&&v.trim());
    if(!entry.handle&&!visual)throw new Error("Missing visual identity for "+token+" on "+key);
    const reference=entry.handle||(entry.name||token)+" — Visual: "+visual.trim();
    const identity=entry.handle||token;
    if(!seen.has(identity)){seen.add(identity);handles.push(reference)}
  }
  return handles;
}
function normalizeScenes(raw){if(Array.isArray(raw))return raw;return Object.entries(raw||{}).map(([id,scene])=>({id,...scene}))}
function normalizeOverlay(raw){if(Array.isArray(raw))return raw;if(Array.isArray(raw?.pages))return raw.pages;return normalizeScenes(raw)}
function sceneEpisode(scene){if(scene?.episode)return scene.episode;const m=String(scene?.id||"").match(/^RF_(S1E\d{2})_/);return m?m[1]:null}
function mergeById(scenes,incoming){const updates=new Map(incoming.filter(x=>x?.id).map(x=>[x.id,x])),seen=new Set();const merged=scenes.map(scene=>{const patch=updates.get(scene.id);if(!patch)return scene;seen.add(scene.id);return {...scene,...patch}});incoming.forEach(scene=>{if(scene?.id&&!seen.has(scene.id)&&!scenes.some(existing=>existing.id===scene.id))merged.push(scene)});return merged}
function applyOverlay(scenes,incoming,overlay){if(overlay.mergeById)return mergeById(scenes,incoming);const targets=overlay.replaceEpisodes?.length?overlay.replaceEpisodes:(overlay.replaceEpisode?[overlay.replaceEpisode]:[]);if(targets.length){const targetSet=new Set(targets),first=scenes.findIndex(s=>targetSet.has(sceneEpisode(s)));if(first>=0){const insertAt=scenes.slice(0,first).filter(s=>!targetSet.has(sceneEpisode(s))).length;const kept=scenes.filter(s=>!targetSet.has(sceneEpisode(s)));return kept.slice(0,insertAt).concat(incoming,kept.slice(insertAt))}}if(overlay.afterId){const pos=scenes.findIndex(s=>s.id===overlay.afterId);const insertAt=pos>=0?pos+1:scenes.length;return scenes.slice(0,insertAt).concat(incoming,scenes.slice(insertAt))}return scenes.concat(incoming)}
function applyDialogueOverlay(scenes,incoming){const byId=new Map(incoming.filter(x=>x?.id).map(x=>[x.id,x]));return scenes.map(scene=>{const patch=byId.get(scene.id);if(!patch)return scene;const dialogue=patch.dialogueInline||patch.sceneDialogue;if(!Array.isArray(dialogue))return scene;return {...scene,dialogueInline:dialogue,dialogueSource:patch.dialogueSource||"scene-dialogue overlay"}})}
function collectManual(out,targetStore){document.querySelectorAll("#manualInputs select").forEach(sel=>{const f=sel.dataset.file,k=sel.value;if(!k)return;if(f==="dialogue.json_subtext"){const e=targetStore["dialogue.json"]?.[k];if(e?.subtext)out.push("\n[dialogue.json_subtext:"+k+"]\n("+e.subtext+")");return}const e=targetStore[f]?.[k];if(e)out.push("\n["+f+":"+k+"]\n"+formatEntry(e))})}
async function loadShow(show){const base=show.basePath||"data",store={};const packageConfig=await loadOptionalJson(joinPath(base,show.packageConfigFile||"assembler.json"));const config={...(packageConfig||{}),...show};await Promise.all(DATA_FILES.map(async f=>store[f]=await loadJson(joinPath(base,f))));const files=Array.isArray(config.scenesFiles)?config.scenesFiles:[config.scenesFile||"scenes.json"];const groups=await Promise.all(files.map(f=>loadJson(joinPath(base,f))));let scenes=groups.flatMap(normalizeScenes);if(config.excludeSceneIds?.length){const excluded=new Set(config.excludeSceneIds);scenes=scenes.filter(scene=>!excluded.has(scene.id))}for(const overlay of config.sceneOverlays||[]){let incoming=normalizeOverlay(await loadEncodedJson(joinPath(base,overlay.file),overlay.encoding));if(overlay.includeIds?.length){const included=new Set(overlay.includeIds);incoming=incoming.filter(scene=>included.has(scene.id))}if(overlay.excludeIds?.length){const excluded=new Set(overlay.excludeIds);incoming=incoming.filter(scene=>!excluded.has(scene.id))}scenes=applyOverlay(scenes,incoming,overlay)}for(const overlay of config.dialogueOverlays||[]){const incoming=normalizeOverlay(await loadEncodedJson(joinPath(base,overlay.file),overlay.encoding));scenes=applyDialogueOverlay(scenes,incoming)}if(config.includeIdPattern){const include=new RegExp(config.includeIdPattern);scenes=scenes.filter(scene=>include.test(String(scene?.id||"")))}store.__show=config;store.__scenes=scenes;return store}
function seriesName(show){if(show.seriesName)return show.seriesName;const name=show.name||show.id;return name.split(" — ")[0]}
function seriesId(show){return show.seriesId||seriesName(show).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function explicitIssueLabel(show){if(show.issueLabel)return show.issueLabel;const name=show.name||"";const issue=name.match(/(?:Season\s+\d+\s*\/\s*)?(Issue\s+\d+(?:\s+—\s+.*)?)/i);if(issue)return issue[1];const chapter=name.match(/(Chapters?\s+[^—]+)/i);return chapter?chapter[1].trim():null}
function issueNumber(source){const text=typeof source==="string"?source:(source?.replaceEpisode||source?.file||"");const m=String(text).match(/(?:S\d+E|[_-]e)(\d{2})/i);return m?Number(m[1]):null}
function onlyIssue(items,n){return (items||[]).filter(item=>issueNumber(item)===n)}
function expandIssues(show){const explicit=explicitIssueLabel(show),files=show.scenesFiles?.length?show.scenesFiles:[show.scenesFile||"scenes.json"],numbers=new Set();files.forEach(file=>{const n=issueNumber(file);if(n)numbers.add(n)});(show.sceneOverlays||[]).forEach(item=>{const n=issueNumber(item);if(n)numbers.add(n)});if(explicit||numbers.size<=1)return [{...show,seriesId:seriesId(show),seriesName:seriesName(show),issueId:show.id,issueLabel:explicit||show.seasonLabel||"Issue 1"}];return [...numbers].sort((a,b)=>a-b).map(n=>{const issueFiles=files.filter(file=>issueNumber(file)===n);const genericFiles=files.filter(file=>issueNumber(file)===null);return {...show,id:show.id+"-issue-"+n,seriesId:seriesId(show),seriesName:seriesName(show),issueId:show.id+"-issue-"+n,issueLabel:"Issue "+n,scenesFiles:issueFiles.length?genericFiles.concat(issueFiles):genericFiles,scenesFile:undefined,sceneOverlays:onlyIssue(show.sceneOverlays,n),dialogueOverlays:onlyIssue(show.dialogueOverlays,n)}})}
const PAGE_SUPPRESSIBLE_SECTIONS=new Set(["summary","production","setting","settingContinuity","region","factions","characters","direction"]);
function pageAssembly(scene,show={}){
  const key=scene?.id||"unknown page";
  if(scene?.promptSuppress!==undefined&&!Array.isArray(scene.promptSuppress))throw new Error("promptSuppress must be an array on "+key);
  const raw=scene?.promptSuppress||[];
  const invalid=raw.filter(x=>!PAGE_SUPPRESSIBLE_SECTIONS.has(x));
  if(invalid.length)throw new Error("Invalid or protected prompt suppression on "+key+": "+invalid.join(", ")+". Panel plan, dialogue, and continuity are always preserved.");
  const suppress=new Set(raw);
  const characterMode=suppress.has("characters")?"none":(scene?.promptCharacterMode||(show.compactCharacters?"cast":"full"));
  const settingMode=scene?.promptSettingMode||"full";
  if(!["full","cast","none"].includes(characterMode))throw new Error("Invalid promptCharacterMode on "+key+": "+characterMode);
  if(!["full","label"].includes(settingMode))throw new Error("Invalid promptSettingMode on "+key+": "+settingMode);
  if(suppress.has("settingContinuity")&&!scene?.settingText&&scene?.setting)throw new Error("Suppressing settingContinuity without settingText would remove all location detail on "+key+"; use promptSettingMode: label.");
  if(suppress.has("setting")&&!(Array.isArray(scene?.panelPlan)&&scene.panelPlan.length&&scene.panelPlan.every(p=>p&&typeof p==="object"&&typeof p.location==="string"&&p.location.trim())))throw new Error("Cannot suppress setting without explicit location on every panel: "+key);
  return {suppress,characterMode,settingMode};
}
// Optional authored page-composition contract. The panel plan remains the story authority.
// Panel references are 1-based positions in panelPlan; layout never moves or rewrites beats.
const PAGE_LAYOUT_COMPOSITIONS=new Set(["splash","splash-with-insets","asymmetric","grid","vertical","montage","open","quiet","freeform"]);
const PAGE_LAYOUT_ROLES=new Set(["dominant","supporting","inset","detail","quiet"]);
const PAGE_LAYOUT_SCALES=new Set(["splash","large","medium","small","micro"]);
function validatePageLayout(scene){
  if(scene?.pageLayout===undefined)return null;
  const id=scene.id||"unknown page",layout=scene.pageLayout;
  const fail=message=>{throw new Error("Invalid pageLayout on "+id+": "+message)};
  const obj=value=>value!==null&&typeof value==="object"&&!Array.isArray(value);
  const text=(value,field)=>{if(typeof value!=="string"||!value.trim())fail(field+" must be non-empty text");return value.trim()};
  const keys=(value,allowed,field)=>{for(const key of Object.keys(value))if(!allowed.includes(key))fail("unknown "+field+" field "+key)};
  if(!obj(layout))fail("expected an object");
  keys(layout,["composition","visualPriority","readingFlow","primaryPanel","panels","negativeSpace","lettering"],"layout");
  const composition=text(layout.composition,"composition");
  if(!PAGE_LAYOUT_COMPOSITIONS.has(composition))fail("unknown composition "+composition);
  text(layout.visualPriority,"visualPriority");
  text(layout.readingFlow,"readingFlow");
  const count=scene.panelPlan?.length;
  if(!Array.isArray(scene.panelPlan)||!count)fail("requires a non-empty authored panelPlan");
  if(!Array.isArray(layout.panels)||layout.panels.length!==count)fail("panels must cover all "+count+" scripted panels once");
  const refs=new Map();
  for(const p of layout.panels){
    if(!obj(p))fail("each panel assignment must be an object");
    keys(p,["panel","role","scale","placement","insetOf"],"panel");
    if(!Number.isInteger(p.panel)||p.panel<1||p.panel>count)fail("invalid 1-based panel reference "+p.panel);
    if(refs.has(p.panel))fail("duplicate panel "+p.panel);
    if(!PAGE_LAYOUT_ROLES.has(p.role))fail("invalid role on panel "+p.panel);
    if(!PAGE_LAYOUT_SCALES.has(p.scale))fail("invalid scale on panel "+p.panel);
    text(p.placement,"panel "+p.panel+" placement");
    if(p.role==="inset"){
      if(!Number.isInteger(p.insetOf)||p.insetOf<1||p.insetOf>=p.panel)fail("inset panel "+p.panel+" must reference a preceding parent panel");
      if(p.scale==="splash")fail("inset panel "+p.panel+" cannot have splash scale");
    }else if(p.insetOf!==undefined)fail("insetOf is only valid for inset panels");
    refs.set(p.panel,p);
  }
  for(let n=1;n<=count;n++)if(!refs.has(n))fail("missing panel "+n);
  for(const p of layout.panels)if(p.insetOf!==undefined&&refs.get(p.insetOf).role==="inset")fail("nested insets are not supported (panel "+p.panel+")");
  if(layout.primaryPanel!==undefined){
    if(!Number.isInteger(layout.primaryPanel)||!refs.has(layout.primaryPanel))fail("primaryPanel must reference an authored panel");
    if(refs.get(layout.primaryPanel).role!=="dominant")fail("primaryPanel must have dominant role");
  }
  if(composition==="splash"&&count!==1)fail("multi-panel splashes must use splash-with-insets or another architecture");
  if(layout.negativeSpace!==undefined){
    if(!Array.isArray(layout.negativeSpace))fail("negativeSpace must be an array");
    for(const zone of layout.negativeSpace){
      if(!obj(zone))fail("negativeSpace entries must be objects");
      keys(zone,["where","purpose"],"negativeSpace");
      text(zone.where,"negativeSpace.where");
      text(zone.purpose,"negativeSpace.purpose");
    }
  }
  if(layout.lettering!==undefined){
    if(!obj(layout.lettering))fail("lettering must be an object");
    keys(layout.lettering,["strategy","reservedZone"],"lettering");
    text(layout.lettering.strategy,"lettering.strategy");
    if(layout.lettering.reservedZone!==undefined)text(layout.lettering.reservedZone,"lettering.reservedZone");
  }
  return layout;
}
function formatPageLayout(scene){
  const layout=validatePageLayout(scene);
  if(!layout)return "";
  const count=scene.panelPlan.length;
  const lines=["[PAGE COMPOSITION]",
    "Architecture: "+layout.composition.replaceAll("-"," ")+".",
    "Visual priority: "+layout.visualPriority.trim(),
    "Reading flow: "+layout.readingFlow.trim(),
    "Preserve authored story order: "+Array.from({length:count},(_,i)=>i+1).join(" -> ")+"."
  ];
  if(layout.primaryPanel!==undefined)lines.push("Primary focal panel: "+layout.primaryPanel+".");
  lines.push("Panel hierarchy:");
  const assignments=[...layout.panels].sort((a,b)=>a.panel-b.panel);
  for(const p of assignments)lines.push("Panel "+p.panel+": "+p.role+", "+p.scale+(p.insetOf!==undefined?", inset over panel "+p.insetOf:"")+". "+p.placement.trim());
  if(layout.negativeSpace?.length){
    lines.push("Negative space:");
    for(const zone of layout.negativeSpace)lines.push("- "+zone.where.trim()+"; reserve for "+zone.purpose.trim()+".");
  }
  if(layout.lettering){
    lines.push("Lettering approach: "+layout.lettering.strategy.trim());
    if(layout.lettering.reservedZone)lines.push("Lettering reserve: "+layout.lettering.reservedZone.trim());
  }

// Editorial-only warnings. They never suppress, rebalance, or rewrite a story beat.

  const totals=new Map();
  const words=value=>(String(value||"").trim().match(/\S+/g)||[]).length;
  const indexMap=panels.some(p=>p&&Array.isArray(p.dialogueIndices));

    }

  if(!["original","indexed"].includes(mode))throw new Error("Invalid promptPanelLetteringMode on "+(scene?.id||"unknown page")+": "+mode);
  if(mode==="original")return null;

// Keep all source/provenance in page JSON. The chef gets readable instructions,
// not the serialization protocol used to store them. Opt-in by audited page.
function prepareCleanPanelPlan(scene){
  const id=scene?.id||"unknown page",panels=scene.panelPlan||[],lines=scene.dialogueInline||[];
  if(!Array.isArray(panels)||!panels.length)throw new Error("Clean panel mode requires an authored panelPlan on "+id);
  if(scene.promptPanelLetteringMode==="indexed")throw new Error("Clean panel mode must not be combined with indexed panel lettering on "+id);

    if(p.shotType&&p.shotType!=="SEQUENTIAL")parts.push(String(p.shotType).replaceAll("_"," "));

      if(typeof p.location!=="string"||!p.location.trim())throw new Error("Invalid panel location on "+id+" panel "+index);

// A prose-only issue already has author-approved panel language. Number those

function prepareNumberedProsePanels(scene){
