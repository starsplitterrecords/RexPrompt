<!DOCTYPE html><html><head><meta charset="utf-8"><title>RexPrompt Assembler</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:sans-serif;padding:20px;margin:0;max-width:100%;box-sizing:border-box}.container{max-width:100%;width:100%;overflow-x:hidden}select,button{margin:0 10px 20px 0}select{min-width:260px;max-width:100%}button{font-size:1.1rem;padding:14px 20px}pre{background:#eee;padding:10px;white-space:pre-wrap;word-wrap:break-word;max-width:100%;box-sizing:border-box}.block{margin-bottom:15px}.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.status{color:#666;font-size:.9rem;margin:-8px 0 14px}</style></head><body><div class="container"><h3>RexPrompt Assembler</h3><div class="block"><label for="showSel">Show</label><br><select id="showSel"></select></div><div class="block"><label for="sceneSel">Scene (recipes)</label><br><select id="sceneSel"></select></div><div id="status" class="status"></div><div class="btn-row"><button id="buildBtn">Build</button><button id="copyBtn">Copy Assembled Text</button><button id="commitBtn">Commit Scene</button></div><pre id="out"></pre><div id="manualInputs"></div></div><script>
const SHOW_MANIFEST="data/shows.json",DATA_FILES=["blocking.json","characters.json","dialogue.json","direction.json","factions.json","lighting.json","mood.json","negatives.json","regions.json","settings.json"];
async function loadJson(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");return r.json()}
async function loadEncodedJson(path,encoding){if(!encoding)return loadJson(path);if(encoding!=="gzip-base64")throw new Error("Unsupported scene encoding: "+encoding);if(typeof DecompressionStream==="undefined")throw new Error("This browser cannot decompress RexPrompt scene data. Update the browser and try again.");const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");const b64=(await r.text()).replace(/\s+/g,"");const binary=atob(b64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(stream).text())}
function joinPath(base,file){return String(base||"data").replace(/\/$/,"")+"/"+file}function getHandle(id,c){const e=c[id];return e?e.handle||e.name||id:id}function formatEntry(e){if(typeof e==="string")return e;if(e.text)return e.text;if(e.name)return e.name;if(e.summary)return e.summary;return JSON.stringify(e)}function normalizeScenes(raw){if(Array.isArray(raw))return raw;return Object.entries(raw||{}).map(([id,scene])=>({id,...scene}))}
function sceneEpisode(scene){if(scene?.episode)return scene.episode;const m=String(scene?.id||"").match(/^RF_(S1E\d{2})_/);return m?m[1]:null}
function applyOverlay(scenes,incoming,overlay){const targets=overlay.replaceEpisodes?.length?overlay.replaceEpisodes:(overlay.replaceEpisode?[overlay.replaceEpisode]:[]);if(targets.length){const targetSet=new Set(targets),first=scenes.findIndex(s=>targetSet.has(sceneEpisode(s)));if(first>=0){const insertAt=scenes.slice(0,first).filter(s=>!targetSet.has(sceneEpisode(s))).length;const kept=scenes.filter(s=>!targetSet.has(sceneEpisode(s)));return kept.slice(0,insertAt).concat(incoming,kept.slice(insertAt))}}if(overlay.afterId){const pos=scenes.findIndex(s=>s.id===overlay.afterId);const insertAt=pos>=0?pos+1:scenes.length;return scenes.slice(0,insertAt).concat(incoming,scenes.slice(insertAt))}return scenes.concat(incoming)}
function collectManual(out,store){document.querySelectorAll("#manualInputs select").forEach(sel=>{const f=sel.dataset.file,k=sel.value;if(!k)return;if(f==="dialogue.json_subtext"){const e=store["dialogue.json"]?.[k];if(e?.subtext)out.push("\n[dialogue.json_subtext:"+k+"]\n("+e.subtext+")");return}const e=store[f]?.[k];if(e)out.push("\n["+f+":"+k+"]\n"+formatEntry(e))})}
async function loadShow(show){const base=show.basePath||"data",store={};await Promise.all(DATA_FILES.map(async f=>store[f]=await loadJson(joinPath(base,f))));const files=show.scenesFiles?.length?show.scenesFiles:[show.scenesFile||"scenes.json"];const groups=await Promise.all(files.map(f=>loadJson(joinPath(base,f))));let scenes=groups.flatMap(normalizeScenes);for(const overlay of show.sceneOverlays||[]){let incoming=normalizeScenes(await loadEncodedJson(joinPath(base,overlay.file),overlay.encoding));if(overlay.excludeIds?.length){const excluded=new Set(overlay.excludeIds);incoming=incoming.filter(scene=>!excluded.has(scene.id))}scenes=applyOverlay(scenes,incoming,overlay)}store.__show=show;store.__scenes=scenes;return store}
async function init(){const showSel=document.getElementById("showSel"),sceneSel=document.getElementById("sceneSel"),buildBtn=document.getElementById("buildBtn"),copyBtn=document.getElementById("copyBtn"),commitBtn=document.getElementById("commitBtn"),outEl=document.getElementById("out"),statusEl=document.getElementById("status");const shows=await loadJson(SHOW_MANIFEST);if(!Array.isArray(shows)||!shows.length)throw new Error("No shows are defined in "+SHOW_MANIFEST);shows.forEach(show=>{const o=document.createElement("option");o.value=show.id;o.textContent=show.name||show.id;showSel.appendChild(o)});let store={},scenes=[],sceneOrder=[];function currentScene(){const i=Number(sceneSel.value);return Number.isFinite(i)?scenes[i]:null}function sceneIdentity(s,i){return s?.id||String(i+1)}function sceneLabel(i){const s=scenes[i],id=sceneIdentity(s,i);if(!s?.summary)return id;const t=s.summary.trim(),m=90;if(t.length<=m)return id+" - "+t;const cut=t.lastIndexOf(" ",m);return id+" - "+t.slice(0,cut===-1?m:cut)}function rebuild(selected=null){sceneSel.innerHTML="";sceneOrder.forEach(i=>{const o=document.createElement("option");o.value=String(i);o.textContent=sceneLabel(i);sceneSel.appendChild(o)});if(selected!==null&&sceneOrder.includes(selected))sceneSel.value=String(selected)}
function build(){const s=currentScene();if(!s){outEl.textContent="No scene selected.";return}const i=Number(sceneSel.value),key=sceneIdentity(s,i),out=[],cameos=new Set();if(s.dialogueInline?.length)s.dialogueInline.forEach(d=>cameos.add(d.handle||d.speaker));else s.dialog?.forEach(k=>{const d=store["dialogue.json"]?.[k];if(d)cameos.add(getHandle(d.speakerId,store["characters.json"]||{}))});cameos.forEach(h=>out.push(h));const show=store.__show||{},unitLabel=show.unitLabel||"SCENE";out.push("\n=== "+unitLabel+": "+key+" ===");out.push((s.summary||"").trim());out.push(show.generationLine||"10-second vertical clip. 8K modern-futuristic prestige TV style. Fictional production.");if(s.settingText)out.push("\n[SETTING]\n"+s.settingText);else if(s.setting){const e=store["settings.json"]?.[s.setting];if(e)out.push("\n[SETTING]\n"+formatEntry(e))}if(s.regionText)out.push("\n[REGION]\n"+s.regionText);else if(s.region){const e=store["regions.json"]?.[s.region];if(e)out.push("\n[REGION]\n"+formatEntry(e))}if(s.factions?.length){out.push("\n[FACTIONS]");s.factions.forEach(k=>{const e=store["factions.json"]?.[k];if(e)out.push(formatEntry(e))})}if(s.charactersInline?.length){out.push("\n[CHARACTERS]");s.charactersInline.forEach(c=>out.push(c.name||c.handle))}else if(s.characters?.length){out.push("\n[CHARACTERS]");s.characters.forEach(k=>{const e=store["characters.json"]?.[k];if(e)out.push(formatEntry(e))})}if(s.panelPlan?.length){out.push("\n[PANEL PLAN]");s.panelPlan.forEach(x=>out.push(formatEntry(x)))}if(s.dialogueInline?.length){out.push("\n[DIALOGUE]");s.dialogueInline.forEach(d=>{out.push((d.handle||d.speaker)+' says "'+(d.text||'')+'"');if(d.subtext)out.push("  ("+d.subtext+")")})}else if(s.dialog?.length){out.push("\n[DIALOGUE]");s.dialog.forEach(k=>{const d=store["dialogue.json"]?.[k];if(!d)return;out.push(getHandle(d.speakerId,store["characters.json"]||{})+' says "'+(d.text||'')+'"');if(d.subtext)out.push("  ("+d.subtext+")")})}if(s.direction?.length||s.directionInline?.length){out.push("\n[DIRECTION]");if(s.direction?.length)s.direction.forEach(k=>{const e=store["direction.json"]?.[k];if(e)out.push(formatEntry(e))});if(s.directionInline?.length)s.directionInline.forEach(x=>out.push(formatEntry(x)))}collectManual(out,store);outEl.textContent=out.join("\n").trim()}
async function selectShow(id){const show=shows.find(s=>s.id===id)||shows[0];showSel.value=show.id;localStorage.setItem("rexprompt.selectedShow",show.id);statusEl.textContent="Loading "+(show.name||show.id)+"…";outEl.textContent="";sceneSel.disabled=buildBtn.disabled=commitBtn.disabled=true;try{store=await loadShow(show);scenes=store.__scenes||[];sceneOrder=scenes.map((_,i)=>i);rebuild();statusEl.textContent=(show.name||show.id)+" — "+scenes.length+" scenes";sceneSel.disabled=buildBtn.disabled=commitBtn.disabled=false;if(sceneOrder.length){sceneSel.value=String(sceneOrder[0]);build()}else outEl.textContent="This show contains no scenes."}catch(err){statusEl.textContent="Unable to load show.";outEl.textContent=err instanceof Error?err.message:String(err)}}buildBtn.onclick=build;sceneSel.onchange=build;showSel.onchange=()=>void selectShow(showSel.value);commitBtn.onclick=()=>{const i=Number(sceneSel.value),p=sceneOrder.indexOf(i);if(p===-1)return;sceneOrder=sceneOrder.slice(p+1).concat(sceneOrder.slice(0,p+1));rebuild();if(sceneOrder.length){sceneSel.value=String(sceneOrder[0]);build()}};copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(outEl.textContent||"")}catch{}};const saved=localStorage.getItem("rexprompt.selectedShow"),initial=shows.some(s=>s.id===saved)?saved:shows[0].id;await selectShow(initial)}init().catch(err=>document.getElementById("out").textContent=err instanceof Error?err.message:String(err));
</script></body></html>
