<!DOCTYPE html><html><head><meta charset="utf-8"><title>RexPrompt Assembler</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:sans-serif;padding:20px;margin:0;max-width:100%;box-sizing:border-box}.container{max-width:100%;width:100%;overflow-x:hidden}select,button{margin:0 10px 20px 0}select{min-width:260px;max-width:100%}button{font-size:1.1rem;padding:14px 20px}pre{background:#eee;padding:10px;white-space:pre-wrap;word-wrap:break-word;max-width:100%;box-sizing:border-box}.block{margin-bottom:15px}.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.status{color:#666;font-size:.9rem;margin:-8px 0 14px}</style></head><body><div class="container"><h3>RexPrompt Assembler</h3><div class="block"><label for="showSel">Series (show)</label><br><select id="showSel"></select></div><div class="block"><label for="issueSel">Issue</label><br><select id="issueSel"></select></div><div class="block"><label for="sceneSel">Scene / page (recipes)</label><br><select id="sceneSel"></select></div><div id="status" class="status"></div><div class="btn-row"><button id="buildBtn">Build</button><button id="copyBtn">Copy Assembled Text</button><button id="commitBtn">Commit Scene</button></div><pre id="out"></pre><div id="manualInputs"></div></div><script>
const SHOW_MANIFEST="data/shows.json",DATA_FILES=["blocking.json","characters.json","dialogue.json","direction.json","factions.json","lighting.json","mood.json","negatives.json","regions.json","settings.json"];
async function loadJson(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");return r.json()}
async function loadOptionalJson(path){const r=await fetch(path,{cache:"no-store"});if(r.status===404)return null;if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");return r.json()}
async function loadEncodedJson(path,encoding){if(!encoding)return loadJson(path);if(encoding!=="gzip-base64")throw new Error("Unsupported scene encoding: "+encoding);if(typeof DecompressionStream==="undefined")throw new Error("This browser cannot decompress RexPrompt scene data. Update the browser and try again.");const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");const b64=(await r.text()).replace(/\s+/g,"");const binary=atob(b64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(stream).text())}
function joinPath(base,file){return String(base||"data").replace(/\/$/,"")+"/"+file}function getHandle(id,c){const e=c[id];return e?e.handle||e.name||id:id}function formatEntry(e){if(typeof e==="string")return e;if(e.text)return e.text;if(e.name)return e.name;if(e.summary)return e.summary;return JSON.stringify(e)}function findCharacterByHandle(h,c){if(!h)return null;return Object.values(c||{}).find(e=>e&&(e.handle===h||(Array.isArray(e.aliases)&&e.aliases.includes(h))))}function formatCharacter(e,fallback){if(!e)return fallback;const p=[e.name||fallback];if(e.handle)p.push(e.handle);const v=e.visualAnchor||e.visual||e.appearance||e.visualDescription;if(v)p.push("Visual: "+v);if(e.visualStatus)p.push("Visual status: "+e.visualStatus);if(Array.isArray(e.continuityLocks)&&e.continuityLocks.length)p.push("Continuity: "+e.continuityLocks.join("; "));return p.join(" — ")}function normalizeScenes(raw){if(Array.isArray(raw))return raw;return Object.entries(raw||{}).map(([id,scene])=>({id,...scene}))}function normalizeOverlay(raw){if(Array.isArray(raw))return raw;if(Array.isArray(raw?.pages))return raw.pages;return normalizeScenes(raw)}
function sceneEpisode(scene){if(scene?.episode)return scene.episode;const m=String(scene?.id||"").match(/^RF_(S1E\d{2})_/);return m?m[1]:null}
function mergeById(scenes,incoming){const updates=new Map(incoming.filter(x=>x?.id).map(x=>[x.id,x])),seen=new Set();const merged=scenes.map(scene=>{const patch=updates.get(scene.id);if(!patch)return scene;seen.add(scene.id);return {...scene,...patch}});incoming.forEach(scene=>{if(scene?.id&&!seen.has(scene.id)&&!scenes.some(existing=>existing.id===scene.id))merged.push(scene)});return merged}
function applyOverlay(scenes,incoming,overlay){if(overlay.mergeById)return mergeById(scenes,incoming);const targets=overlay.replaceEpisodes?.length?overlay.replaceEpisodes:(overlay.replaceEpisode?[overlay.replaceEpisode]:[]);if(targets.length){const targetSet=new Set(targets),first=scenes.findIndex(s=>targetSet.has(sceneEpisode(s)));if(first>=0){const insertAt=scenes.slice(0,first).filter(s=>!targetSet.has(sceneEpisode(s))).length;const kept=scenes.filter(s=>!targetSet.has(sceneEpisode(s)));return kept.slice(0,insertAt).concat(incoming,kept.slice(insertAt))}}if(overlay.afterId){const pos=scenes.findIndex(s=>s.id===overlay.afterId);const insertAt=pos>=0?pos+1:scenes.length;return scenes.slice(0,insertAt).concat(incoming,scenes.slice(insertAt))}return scenes.concat(incoming)}
function applyDialogueOverlay(scenes,incoming){const byId=new Map(incoming.filter(x=>x?.id).map(x=>[x.id,x]));return scenes.map(scene=>{const patch=byId.get(scene.id);if(!patch)return scene;const dialogue=patch.dialogueInline||patch.sceneDialogue;if(!Array.isArray(dialogue))return scene;return {...scene,dialogueInline:dialogue,dialogueSource:patch.dialogueSource||"scene-dialogue overlay"}})}
function collectManual(out,store){document.querySelectorAll("#manualInputs select").forEach(sel=>{const f=sel.dataset.file,k=sel.value;if(!k)return;if(f==="dialogue.json_subtext"){const e=store["dialogue.json"]?.[k];if(e?.subtext)out.push("\n[dialogue.json_subtext:"+k+"]\n("+e.subtext+")");return}const e=store[f]?.[k];if(e)out.push("\n["+f+":"+k+"]\n"+formatEntry(e))})}
async function loadShow(show){const base=show.basePath||"data",store={};const packageConfig=await loadOptionalJson(joinPath(base,show.packageConfigFile||"assembler.json"));const config={...(packageConfig||{}),...show};await Promise.all(DATA_FILES.map(async f=>store[f]=await loadJson(joinPath(base,f))));const files=Array.isArray(config.scenesFiles)?config.scenesFiles:[config.scenesFile||"scenes.json"];const groups=await Promise.all(files.map(f=>loadJson(joinPath(base,f))));let scenes=groups.flatMap(normalizeScenes);if(config.excludeSceneIds?.length){const excluded=new Set(config.excludeSceneIds);scenes=scenes.filter(scene=>!excluded.has(scene.id))}for(const overlay of config.sceneOverlays||[]){let incoming=normalizeOverlay(await loadEncodedJson(joinPath(base,overlay.file),overlay.encoding));if(overlay.includeIds?.length){const included=new Set(overlay.includeIds);incoming=incoming.filter(scene=>included.has(scene.id))}if(overlay.excludeIds?.length){const excluded=new Set(overlay.excludeIds);incoming=incoming.filter(scene=>!excluded.has(scene.id))}scenes=applyOverlay(scenes,incoming,overlay)}for(const overlay of config.dialogueOverlays||[]){const incoming=normalizeOverlay(await loadEncodedJson(joinPath(base,overlay.file),overlay.encoding));scenes=applyDialogueOverlay(scenes,incoming)}if(config.includeIdPattern){const include=new RegExp(config.includeIdPattern);scenes=scenes.filter(scene=>include.test(String(scene?.id||"")))}store.__show=config;store.__scenes=scenes;return store}
function seriesName(show){if(show.seriesName)return show.seriesName;const name=show.name||show.id;return name.split(" — ")[0]}
function seriesId(show){return show.seriesId||seriesName(show).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function explicitIssueLabel(show){if(show.issueLabel)return show.issueLabel;const name=show.name||"";const issue=name.match(/(?:Season\s+\d+\s*\/\s*)?(Issue\s+\d+(?:\s+—\s+.*)?)/i);if(issue)return issue[1];const chapter=name.match(/(Chapters?\s+[^—]+)/i);return chapter?chapter[1].trim():null}
function issueNumber(source){const text=typeof source==="string"?source:(source?.replaceEpisode||source?.file||"");const m=String(text).match(/(?:S\d+E|[_-]e)(\d{2})/i);return m?Number(m[1]):null}
function onlyIssue(items,n){return (items||[]).filter(item=>issueNumber(item)===n)}
function expandIssues(show){const explicit=explicitIssueLabel(show),files=show.scenesFiles?.length?show.scenesFiles:[show.scenesFile||"scenes.json"],numbers=new Set();files.forEach(file=>{const n=issueNumber(file);if(n)numbers.add(n)});(show.sceneOverlays||[]).forEach(item=>{const n=issueNumber(item);if(n)numbers.add(n)});if(explicit||numbers.size<=1)return [{...show,seriesId:seriesId(show),seriesName:seriesName(show),issueId:show.id,issueLabel:explicit||show.seasonLabel||"Issue 1"}];return [...numbers].sort((a,b)=>a-b).map(n=>{const issueFiles=files.filter(file=>issueNumber(file)===n);const genericFiles=files.filter(file=>issueNumber(file)===null);return {...show,id:show.id+"-issue-"+n,seriesId:seriesId(show),seriesName:seriesName(show),issueId:show.id+"-issue-"+n,issueLabel:"Issue "+n,scenesFiles:issueFiles.length?genericFiles.concat(issueFiles):genericFiles,scenesFile:undefined,sceneOverlays:onlyIssue(show.sceneOverlays,n),dialogueOverlays:onlyIssue(show.dialogueOverlays,n)}})}
async function init(){const showSel=document.getElementById("showSel"),issueSel=document.getElementById("issueSel"),sceneSel=document.getElementById("sceneSel"),buildBtn=document.getElementById("buildBtn"),copyBtn=document.getElementById("copyBtn"),commitBtn=document.getElementById("commitBtn"),outEl=document.getElementById("out"),statusEl=document.getElementById("status");const shows=await loadJson(SHOW_MANIFEST);if(!Array.isArray(shows)||!shows.length)throw new Error("No shows are defined in "+SHOW_MANIFEST);const issues=shows.flatMap(expandIssues),series=[...new Map(issues.map(issue=>[issue.seriesId,{id:issue.seriesId,name:issue.seriesName}])).values()];series.forEach(item=>{const o=document.createElement("option");o.value=item.id;o.textContent=item.name;showSel.appendChild(o)});let store={},scenes=[],sceneOrder=[];function currentScene(){const i=Number(sceneSel.value);return Number.isFinite(i)?scenes[i]:null}function sceneIdentity(s,i){return s?.id||String(i+1)}function sceneLabel(i){const s=scenes[i],id=sceneIdentity(s,i);if(!s?.summary)return id;const t=s.summary.trim(),m=90;if(t.length<=m)return id+" - "+t;const cut=t.lastIndexOf(" ",m);return id+" - "+t.slice(0,cut===-1?m:cut)}function rebuild(selected=null){sceneSel.innerHTML="";sceneOrder.forEach(i=>{const o=document.createElement("option");o.value=String(i);o.textContent=sceneLabel(i);sceneSel.appendChild(o)});if(selected!==null&&sceneOrder.includes(selected))sceneSel.value=String(selected)}
function build(){const s=currentScene();if(!s){outEl.textContent="No scene selected.";return}const i=Number(sceneSel.value),key=sceneIdentity(s,i),out=[],cameos=new Set();if(s.dialogueInline?.length)s.dialogueInline.forEach(d=>{const h=d.handle||d.speaker;if(typeof h==="string"&&h.startsWith("@"))cameos.add(h)});else s.dialog?.forEach(k=>{const d=store["dialogue.json"]?.[k];if(d)cameos.add(getHandle(d.speakerId,store["characters.json"]||{}))});cameos.forEach(h=>out.push(h));const show=store.__show||{},unitLabel=show.unitLabel||"SCENE";out.push("\n=== "+unitLabel+": "+key+" ===");out.push((s.summary||"").trim());out.push(show.generationLine||"10-second vertical clip. 8K modern-futuristic prestige TV style. Fictional production.");if(s.settingText)out.push("\n[SETTING]\n"+s.settingText);else if(s.setting){const e=store["settings.json"]?.[s.setting];if(e)out.push("\n[SETTING]\n"+formatEntry(e))}if(s.regionText)out.push("\n[REGION]\n"+s.regionText);else if(s.region){const e=store["regions.json"]?.[s.region];if(e)out.push("\n[REGION]\n"+formatEntry(e))}if(s.factions?.length){out.push("\n[FACTIONS]");s.factions.forEach(k=>{const e=store["factions.json"]?.[k];if(e)out.push(formatEntry(e))})}if(s.charactersInline?.length){out.push("\n[CHARACTERS]");s.charactersInline.forEach(c=>{const e=findCharacterByHandle(c.handle,store["characters.json"]||{});out.push(formatCharacter(e,c.name||c.handle))})}else if(s.characters?.length){out.push("\n[CHARACTERS]");s.characters.forEach(k=>{const e=store["characters.json"]?.[k];if(e)out.push(formatCharacter(e,k))})}if(s.panelPlan?.length){out.push("\n[PANEL PLAN]");s.panelPlan.forEach(x=>out.push(formatEntry(x)))}if(s.dialogueInline?.length){out.push("\n[DIALOGUE]");s.dialogueInline.forEach(d=>{const sp=d.handle||d.speaker||'TEXT',label=/^(CAPTION|SYSTEM|SCREEN|DISPLAY|MESSAGE|GROUP CHAT|MONITOR|SIGN|SFX|MAP|TIDE BOARD|SECURITY|TECHNICIAN)$/.test(sp);out.push(label?sp+': "'+(d.text||'')+'"':sp+' says "'+(d.text||'')+'"');if(d.subtext)out.push("  ("+d.subtext+")")})}else if(s.dialog?.length){out.push("\n[DIALOGUE]");s.dialog.forEach(k=>{const d=store["dialogue.json"]?.[k];if(!d)return;out.push(getHandle(d.speakerId,store["characters.json"]||{})+' says "'+(d.text||'')+'"');if(d.subtext)out.push("  ("+d.subtext+")")})}if(s.continuityFrom)out.push("\n[CONTINUITY]\nContinue directly from "+s.continuityFrom+"; preserve established positions, props, damage, eyelines, and emotional state.");if(s.direction?.length||s.directionInline?.length){out.push("\n[DIRECTION]");if(s.direction?.length)s.direction.forEach(k=>{const e=store["direction.json"]?.[k];if(e)out.push(formatEntry(e))});if(s.directionInline?.length)s.directionInline.forEach(x=>out.push(formatEntry(x)))}collectManual(out,store);outEl.textContent=out.join("\n").trim()}
async function selectIssue(id){const issue=issues.find(item=>item.issueId===id)||issues.find(item=>item.seriesId===showSel.value);if(!issue)return;issueSel.value=issue.issueId;localStorage.setItem("rexprompt.selectedIssue",issue.issueId);statusEl.textContent="Loading "+issue.seriesName+" — "+issue.issueLabel+"…";outEl.textContent="";sceneSel.disabled=buildBtn.disabled=commitBtn.disabled=true;try{store=await loadShow(issue);scenes=store.__scenes||[];sceneOrder=scenes.map((_,i)=>i);rebuild();const unit=(store.__show?.unitLabel||"scene").toLowerCase();statusEl.textContent=issue.seriesName+" — "+issue.issueLabel+" — "+scenes.length+" "+unit+(scenes.length===1?"":"s");sceneSel.disabled=buildBtn.disabled=commitBtn.disabled=false;if(sceneOrder.length){sceneSel.value=String(sceneOrder[0]);build()}else outEl.textContent="This issue contains no scenes."}catch(err){statusEl.textContent="Unable to load issue.";outEl.textContent=err instanceof Error?err.message:String(err)}}
async function selectSeries(id,preferredIssue=null){const available=issues.filter(item=>item.seriesId===id);if(!available.length)return;showSel.value=id;localStorage.setItem("rexprompt.selectedSeries",id);issueSel.innerHTML="";available.forEach(item=>{const o=document.createElement("option");o.value=item.issueId;o.textContent=item.issueLabel;issueSel.appendChild(o)});const selected=available.some(item=>item.issueId===preferredIssue)?preferredIssue:available[0].issueId;await selectIssue(selected)}
buildBtn.onclick=build;sceneSel.onchange=build;issueSel.onchange=()=>void selectIssue(issueSel.value);showSel.onchange=()=>void selectSeries(showSel.value);commitBtn.onclick=()=>{const i=Number(sceneSel.value),p=sceneOrder.indexOf(i);if(p===-1)return;sceneOrder=sceneOrder.slice(p+1).concat(sceneOrder.slice(0,p+1));rebuild();if(sceneOrder.length){sceneSel.value=String(sceneOrder[0]);build()}};copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(outEl.textContent||"")}catch{}};const savedSeries=localStorage.getItem("rexprompt.selectedSeries"),legacyShow=localStorage.getItem("rexprompt.selectedShow"),savedIssue=localStorage.getItem("rexprompt.selectedIssue"),legacyIssue=issues.find(item=>item.id===legacyShow),initial=series.some(item=>item.id===savedSeries)?savedSeries:(legacyIssue?.seriesId||series[0].id);await selectSeries(initial,savedIssue||legacyIssue?.issueId)} init().catch(err=>document.getElementById("out").textContent=err instanceof Error?err.message:String(err));
</script></body></html>
