<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RexPrompt Assembler</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;padding:20px;margin:0;max-width:100%;box-sizing:border-box}.container{max-width:100%;width:100%;overflow-x:hidden}select,button{margin:0 10px 20px 0}select{min-width:260px;max-width:100%}button{font-size:1.1rem;padding:14px 20px}pre{background:#eee;padding:10px;white-space:pre-wrap;word-wrap:break-word;max-width:100%;box-sizing:border-box}.block{margin-bottom:15px}.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.status{color:#666;font-size:.9rem;margin:-8px 0 14px}
</style>
</head>
<body><div class="container">
<h3>RexPrompt Assembler</h3>
<div class="block"><label for="showSel">Show</label><br><select id="showSel"></select></div>
<div class="block"><label for="sceneSel">Scene (recipes)</label><br><select id="sceneSel"></select></div>
<div id="status" class="status"></div>
<div class="btn-row"><button id="buildBtn">Build</button><button id="copyBtn">Copy Assembled Text</button><button id="commitBtn">Commit Scene</button></div>
<pre id="out"></pre><div id="manualInputs"></div>
</div>
<script>
const SHOW_MANIFEST="data/shows.json";
const DATA_FILES=["blocking.json","characters.json","dialogue.json","direction.json","factions.json","lighting.json","mood.json","negatives.json","regions.json","settings.json"];
async function loadJson(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("load fail: "+path+" ("+r.status+")");return r.json()}
function joinPath(base,file){return String(base||"data").replace(/\/$/,"")+"/"+file}
function getHandle(charId,charactersJson){const e=charactersJson[charId];return e?e.handle||e.name||charId:charId}
function formatEntry(e){if(typeof e==="string")return e;if(e.text)return e.text;if(e.name)return e.name;if(e.summary)return e.summary;return JSON.stringify(e)}
function collectManual(out,store){document.querySelectorAll("#manualInputs select").forEach(sel=>{const f=sel.dataset.file,k=sel.value;if(!k)return;if(f==="dialogue.json_subtext"){const e=store["dialogue.json"]?.[k];if(e?.subtext)out.push("\n[dialogue.json_subtext:"+k+"]\n("+e.subtext+")");return}const e=store[f]?.[k];if(e)out.push("\n["+f+":"+k+"]\n"+formatEntry(e))})}
function normalizeScenes(raw){return Array.isArray(raw)?raw:Object.values(raw||{})}
async function loadShow(show){const basePath=show.basePath||"data",store={};await Promise.all(DATA_FILES.map(async f=>{store[f]=await loadJson(joinPath(basePath,f))}));const files=show.scenesFiles?.length?show.scenesFiles:[show.scenesFile||"scenes.json"];const groups=await Promise.all(files.map(f=>loadJson(joinPath(basePath,f))));store.__scenes=groups.flatMap(normalizeScenes);return store}
async function init(){
 const showSel=document.getElementById("showSel"),sceneSel=document.getElementById("sceneSel"),buildBtn=document.getElementById("buildBtn"),copyBtn=document.getElementById("copyBtn"),commitBtn=document.getElementById("commitBtn"),outEl=document.getElementById("out"),statusEl=document.getElementById("status");
 const shows=await loadJson(SHOW_MANIFEST);if(!Array.isArray(shows)||!shows.length)throw new Error("No shows are defined in "+SHOW_MANIFEST);shows.forEach(show=>{const o=document.createElement("option");o.value=show.id;o.textContent=show.name||show.id;showSel.appendChild(o)});
 let store={},scenes=[],sceneOrder=[];
 function currentScene(){const i=Number(sceneSel.value);return Number.isFinite(i)?scenes[i]:null}
 function sceneIdentity(scene,index){return scene?.id||String(index+1)}
 function sceneLabel(index){const scene=scenes[index],id=sceneIdentity(scene,index);if(!scene?.summary)return id;const s=scene.summary.trim(),max=90;if(s.length<=max)return id+" - "+s;const cut=s.lastIndexOf(" ",max);return id+" - "+s.slice(0,cut===-1?max:cut)}
 function rebuildSceneOptions(selectedIndex=null){sceneSel.innerHTML="";sceneOrder.forEach(index=>{const o=document.createElement("option");o.value=String(index);o.textContent=sceneLabel(index);sceneSel.appendChild(o)});if(selectedIndex!==null&&sceneOrder.includes(selectedIndex))sceneSel.value=String(selectedIndex)}
 function build(){const scene=currentScene();if(!scene){outEl.textContent="No scene selected.";return}const sceneIndex=Number(sceneSel.value),sceneKey=sceneIdentity(scene,sceneIndex),out=[],cameoSet=new Set();
   if(scene.dialogueInline?.length)scene.dialogueInline.forEach(d=>cameoSet.add(d.handle||d.speaker));
   else if(scene.dialog)scene.dialog.forEach(k=>{const d=store["dialogue.json"]?.[k];if(d)cameoSet.add(getHandle(d.speakerId,store["characters.json"]||{}))});
   cameoSet.forEach(h=>out.push(h));out.push("\n=== SCENE: "+sceneKey+" ===");out.push((scene.summary||"").trim());out.push("10-second vertical clip. 8K modern-futuristic prestige TV style. Fictional production.");
   if(scene.settingText)out.push("\n[SETTING]\n"+scene.settingText);else if(scene.setting){const e=store["settings.json"]?.[scene.setting];if(e)out.push("\n[SETTING]\n"+formatEntry(e))}
   if(scene.regionText)out.push("\n[REGION]\n"+scene.regionText);else if(scene.region){const e=store["regions.json"]?.[scene.region];if(e)out.push("\n[REGION]\n"+formatEntry(e))}
   if(scene.factions?.length){out.push("\n[FACTIONS]");scene.factions.forEach(k=>{const e=store["factions.json"]?.[k];if(e)out.push(formatEntry(e))})}
   if(scene.charactersInline?.length){out.push("\n[CHARACTERS]");scene.charactersInline.forEach(c=>out.push(c.name||c.handle))}else if(scene.characters?.length){out.push("\n[CHARACTERS]");scene.characters.forEach(k=>{const e=store["characters.json"]?.[k];if(e)out.push(formatEntry(e))})}
   if(scene.dialogueInline?.length){out.push("\n[DIALOGUE]");scene.dialogueInline.forEach(d=>{out.push((d.handle||d.speaker)+' says "'+(d.text||'')+'"');if(d.subtext)out.push("  ("+d.subtext+")")})}else if(scene.dialog?.length){out.push("\n[DIALOGUE]");scene.dialog.forEach(k=>{const d=store["dialogue.json"]?.[k];if(!d)return;out.push(getHandle(d.speakerId,store["characters.json"]||{})+' says "'+(d.text||'')+'"');if(d.subtext)out.push("  ("+d.subtext+")")})}
   if(scene.directionInline?.length){out.push("\n[DIRECTION]");scene.directionInline.forEach(x=>out.push(formatEntry(x)))}else if(scene.direction?.length){out.push("\n[DIRECTION]");scene.direction.forEach(k=>{const e=store["direction.json"]?.[k];if(e)out.push(formatEntry(e))})}
   collectManual(out,store);outEl.textContent=out.join("\n").trim()}
 async function selectShow(showId){const show=shows.find(s=>s.id===showId)||shows[0];showSel.value=show.id;localStorage.setItem("rexprompt.selectedShow",show.id);statusEl.textContent="Loading "+(show.name||show.id)+"…";outEl.textContent="";sceneSel.disabled=buildBtn.disabled=commitBtn.disabled=true;try{store=await loadShow(show);scenes=store.__scenes||[];sceneOrder=scenes.map((_,i)=>i);rebuildSceneOptions();statusEl.textContent=(show.name||show.id)+" — "+scenes.length+" scenes";sceneSel.disabled=buildBtn.disabled=commitBtn.disabled=false;if(sceneOrder.length){sceneSel.value=String(sceneOrder[0]);build()}else outEl.textContent="This show contains no scenes."}catch(err){statusEl.textContent="Unable to load show.";outEl.textContent=err instanceof Error?err.message:String(err)}}
 buildBtn.onclick=build;sceneSel.onchange=build;showSel.onchange=()=>void selectShow(showSel.value);commitBtn.onclick=()=>{const index=Number(sceneSel.value),position=sceneOrder.indexOf(index);if(position===-1)return;const before=sceneOrder.slice(0,position+1),after=sceneOrder.slice(position+1);sceneOrder=after.concat(before);rebuildSceneOptions();if(sceneOrder.length){sceneSel.value=String(sceneOrder[0]);build()}};copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(outEl.textContent||"")}catch{}};
 const savedShow=localStorage.getItem("rexprompt.selectedShow"),initialShow=shows.some(s=>s.id===savedShow)?savedShow:shows[0].id;await selectShow(initialShow)}
init().catch(err=>{document.getElementById("out").textContent=err instanceof Error?err.message:String(err)});
</script></body></html>
