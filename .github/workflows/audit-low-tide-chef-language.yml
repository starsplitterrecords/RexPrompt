name: Audit Low Tide chef language
on:
  push:
    paths:
      - '.github/workflows/audit-low-tide-chef-language.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Low Tide page production fields
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,json,re,collections
          from pathlib import Path
          base=Path('data/shows/low-tide-signal')
          pages=json.loads((base/'pages_ch01_ch03_compiled.json').read_text())
          for f in ['pages_c04_between_runs_enhanced.json.gzb64','pages_c05_return_tide_enhanced.json.gzb64','pages_c06_after_the_water_enhanced.json.gzb64','pages_c07_last_low_tide_enhanced.json.gzb64']:
            raw=''.join((base/'encoded'/f).read_text().split())
            x=json.loads(gzip.decompress(base64.b64decode(raw)))
            pages.extend(x.get('pages',x) if isinstance(x,dict) else x)
          kc=collections.Counter(k for p in pages for k in p.keys())
          print('KEY_FREQUENCY')
          for k,n in kc.most_common(): print(k,n)
          candidates=['panels','panelPlan','pageDesign','visualContinuity','visualDirection','productionNotes','directionInline','summary','layout','composition','camera','action','beat','setting','characters','dialogueInline']
          for k in candidates:
            samples=[(p['id'],p.get(k)) for p in pages if p.get(k)]
            print('\nFIELD',k,'COUNT',len(samples))
            for pid,v in samples[:12]: print(pid,'|',json.dumps(v,ensure_ascii=False)[:1200])
          index=Path('index.html').read_text()
          print('\nASSEMBLER FIELD REFERENCES')
          for k in sorted(kc):
            if k in index: print(k)
          PY
