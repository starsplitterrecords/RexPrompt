name: Audit Low Tide chef language
on:
  push:
    paths:
      - '.github/workflows/audit-low-tide-chef-language.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print C1-C3 page beats
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pages=json.loads(Path('data/shows/low-tide-signal/pages_ch01_ch03_compiled.json').read_text())
          for p in pages:
            ds=[]
            for d in p.get('dialogueInline',[]) or []:
              ds.append(f"{d.get('speaker','')}: {d.get('text','')}")
            print(p['id'],'||',p.get('setting',''),'||',p.get('summary',''),'||',' / '.join(ds))
          PY
