name: Apply Backyard Rockets late-season enhancement

on:
  pull_request:
    paths:
      - 'tools/enhance_backyard_rockets_late_season.py'
      - '.github/workflows/apply-backyard-rockets-late-season.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build enhanced Issues 4-8
        run: python tools/enhance_backyard_rockets_late_season.py
      - name: Remove one-shot builder
        run: rm tools/enhance_backyard_rockets_late_season.py .github/workflows/apply-backyard-rockets-late-season.yml
      - name: Commit generated production package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enhance Backyard Rockets Issues 4-8"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
