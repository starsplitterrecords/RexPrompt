name: Normalize Vikings visual recipes

on:
  push:
    branches:
      - normalize/vikings-visual-recipes
    paths:
      - tools/normalize_vikings_visual_recipes.py
      - .github/workflows/normalize-vikings-visual-recipes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: normalize/vikings-visual-recipes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize active Vikings recipes
        run: python tools/normalize_vikings_visual_recipes.py
      - name: Commit normalized payloads
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/vikings-2026-s1/encoded
          git commit -m "Normalize Vikings panel staging and locations"
          git push origin HEAD:normalize/vikings-visual-recipes
