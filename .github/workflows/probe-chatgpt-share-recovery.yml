name: Probe ChatGPT share recovery

on:
  push:
    paths:
      - production/recovery/share-source.json
      - .github/workflows/probe-chatgpt-share-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public share image references
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import sys
          import urllib.request

          cfg = json.load(open('production/recovery/share-source.json', encoding='utf-8'))
          url = cfg['url']
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (StarSplitterVisions recovery probe)'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  final = r.geturl()
                  status = getattr(r, 'status', None)
          except Exception as exc:
              print('FETCH_ERROR', type(exc).__name__, str(exc))
              sys.exit(1)

          text = data.decode('utf-8', 'replace')
          decoded = html.unescape(text).replace('\\u0026', '&').replace('\\/', '/')
          print('STATUS', status)
          print('FINAL', final)
          print('BYTES', len(data))

          ids = []
          seen = set()
          for pattern in (r'file_[0-9a-f]{32}', r'file-[A-Za-z0-9_-]{12,}'):
              for match in re.finditer(pattern, decoded):
                  value = match.group(0)
                  if value not in seen:
                      seen.add(value)
                      ids.append((value, match.start()))

          print('UNIQUE_FILE_IDS', len(ids))
          for value, pos in ids[:160]:
              left = max(0, pos - 240)
              right = min(len(decoded), pos + len(value) + 420)
              snippet = decoded[left:right].replace('\r', ' ').replace('\n', ' ')
              print('FILE_CONTEXT', value, snippet[:900])

          for marker in ('asset_pointer', 'image_asset_pointer', 'sediment://', 'file-service://', 'download_url', 'sandbox:/', 'container_asset_pointer', 'image_url'):
              hits = [m.start() for m in re.finditer(re.escape(marker), decoded, flags=re.I)]
              print('MARKER', marker, 'COUNT', len(hits))
              for pos in hits[:20]:
                  snippet = decoded[max(0,pos-200):min(len(decoded),pos+700)].replace('\r',' ').replace('\n',' ')
                  print('MARKER_CONTEXT', marker, snippet[:900])
          PY
