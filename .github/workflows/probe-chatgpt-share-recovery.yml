name: Recover Azure Reach originals

on:
  push:
    paths:
      - production/recovery/share-source.json
      - .github/workflows/probe-chatgpt-share-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve shared originals and commit Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import datetime
          import http.cookiejar
          import json
          import os
          import pathlib
          import subprocess
          import urllib.parse
          import urllib.request

          ROOT = pathlib.Path.cwd()
          REPO = os.environ['GITHUB_REPOSITORY']
          HEAD = os.environ['GITHUB_SHA']
          TOKEN = os.environ['GH_TOKEN']
          API = 'https://api.github.com/repos/' + REPO
          SHARE_ID = '6a9bed0e-1c3c-83ea-8316-0a24093527d9'
          SHARE_URL = 'https://chatgpt.com/share/' + SHARE_ID
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'

          # Final passing/repaired image for each exact RexPrompt recipe.
          PAGES = {
              'AZR_S1E02_P01': ('file_00000000109081f59863fba18841d414', 2633354),
              'AZR_S1E02_P02': ('file_0000000070bc822f9f3b6d530bb69dd4', 2599579),
              'AZR_S1E02_P03': ('file_000000002fb4822fa3401fe06e4eb40b', 2854284),
              'AZR_S1E02_P04': ('file_00000000796c822f84c30a9e59110c8d', 2937450),
              'AZR_S1E02_P05': ('file_000000008f90822fbbd958f80b0125ec', 2756787),
              'AZR_S1E02_P06': ('file_00000000ea98822f816076cc19fd2b73', 2570681),
              'AZR_S1E02_P07': ('file_0000000016e8822fb495a5c69125e728', 2818944),
              'AZR_S1E02_P08': ('file_000000008a70822f9cc837ae319b11c6', 2654543),
              'AZR_S1E02_P09': ('file_00000000ee38822f81cb815fae051594', 2597968),
              'AZR_S1E02_P10': ('file_00000000f90c822fb238662faf1c533e', 2410655),
              'AZR_S1E02_P11': ('file_000000001ac4822f874db6f4f1b5bb1e', 2629536),
          }

          def request_json(opener, url, method='GET', payload=None, extra_headers=None):
              headers = {'User-Agent': UA, 'Accept': 'application/json'}
              if extra_headers:
                  headers.update(extra_headers)
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with opener.open(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          # Establish the public shared-conversation session. The resolver requires these cookies.
          jar = http.cookiejar.CookieJar()
          public = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          with public.open(urllib.request.Request(SHARE_URL, headers={'User-Agent': UA}), timeout=30) as r:
              r.read()
          if not any(c.name == 'oai-did' for c in jar):
              raise RuntimeError('Shared-conversation session cookie was not established')

          manifest_path = ROOT / 'production/drafts/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          drafts = manifest['drafts']
          out_dir = ROOT / 'production/drafts/azure-reach/azure-reach-s1-e02'
          out_dir.mkdir(parents=True, exist_ok=True)
          recovered = {}

          for recipe_id, (file_id, expected_size) in PAGES.items():
              query = urllib.parse.urlencode({'shared_conversation_id': SHARE_ID, 'inline': 'false'})
              resolver = f'https://chatgpt.com/backend-api/files/download/{file_id}?{query}'
              payload = request_json(
                  public,
                  resolver,
                  extra_headers={'Referer': SHARE_URL, 'Origin': 'https://chatgpt.com'},
              )
              download_url = payload.get('download_url')
              if not isinstance(download_url, str) or not download_url.startswith('https://'):
                  raise RuntimeError(f'{recipe_id}: resolver did not return a download URL')
              with public.open(urllib.request.Request(download_url, headers={'User-Agent': UA}), timeout=60) as r:
                  data = r.read(8 * 1024 * 1024)
                  mime = (r.headers.get('Content-Type') or '').split(';', 1)[0].strip().lower()
              if len(data) != expected_size:
                  raise RuntimeError(f'{recipe_id}: expected {expected_size} bytes, got {len(data)}')
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise RuntimeError(f'{recipe_id}: recovered asset is not a PNG')
              if mime and mime != 'image/png':
                  raise RuntimeError(f'{recipe_id}: unexpected MIME {mime}')

              filename = recipe_id.lower() + '.png'
              rel = pathlib.Path('production/drafts/azure-reach/azure-reach-s1-e02') / filename
              absolute = ROOT / rel
              absolute.write_bytes(data)

              key = f'azure-reach::azure-reach-s1-e02::{recipe_id}'
              previous = drafts.get(key)
              if isinstance(previous, dict):
                  old_image = previous.get('image')
                  if isinstance(old_image, str) and old_image != rel.as_posix():
                      old_path = ROOT / old_image
                      if old_path.is_file() and old_path.is_relative_to(ROOT / 'production/drafts'):
                          old_path.unlink()
              drafts[key] = {
                  'seriesId': 'azure-reach',
                  'issueId': 'azure-reach-s1-e02',
                  'recipeId': recipe_id,
                  'status': 'approved-production-draft',
                  'image': rel.as_posix(),
                  'mimeType': 'image/png',
                  'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
                  'approvalMethod': 'recovery-substantial-pass',
                  'evaluationSummary': 'Recovered exact original PNG from the approved Azure Reach Issue 2 shared production conversation and mapped to the current RexPrompt recipe.',
              }
              recovered[recipe_id] = (rel, data)
              print('RECOVERED', recipe_id, file_id, len(data))

          manifest['drafts'] = dict(sorted(drafts.items()))
          manifest_bytes = (json.dumps(manifest, indent=2, ensure_ascii=False) + '\n').encode('utf-8')
          manifest_path.write_bytes(manifest_bytes)

          # Validate the exact local tree before creating any GitHub objects.
          subprocess.run(['python3', 'tools/validate_visual_state.py'], check=True)

          gh = urllib.request.build_opener()
          auth = {
              'Authorization': 'Bearer ' + TOKEN,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def gh_json(path, method='GET', payload=None):
              return request_json(gh, API + path, method=method, payload=payload, extra_headers=auth)

          head_commit = gh_json('/git/commits/' + HEAD)
          base_tree = head_commit['tree']['sha']
          elements = []

          # Create exact binary image blobs directly with the Git Data API.
          for recipe_id, (rel, data) in recovered.items():
              blob = gh_json('/git/blobs', method='POST', payload={
                  'content': base64.b64encode(data).decode('ascii'),
                  'encoding': 'base64',
              })
              elements.append({'path': rel.as_posix(), 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              old_jpg = rel.with_suffix('.jpg')
              if (ROOT / old_jpg).exists():
                  # Should not normally remain after local replacement, but delete if present in the base tree.
                  (ROOT / old_jpg).unlink()
              # Explicitly remove historical JPEG proxy paths for recovered P06-P11.
              if recipe_id in {'AZR_S1E02_P06','AZR_S1E02_P07','AZR_S1E02_P08','AZR_S1E02_P09','AZR_S1E02_P10','AZR_S1E02_P11'}:
                  elements.append({'path': old_jpg.as_posix(), 'mode': '100644', 'type': 'blob', 'sha': None})

          manifest_blob = gh_json('/git/blobs', method='POST', payload={
              'content': manifest_bytes.decode('utf-8'),
              'encoding': 'utf-8',
          })
          elements.append({'path': 'production/drafts/manifest.json', 'mode': '100644', 'type': 'blob', 'sha': manifest_blob['sha']})

          tree = gh_json('/git/trees', method='POST', payload={'base_tree': base_tree, 'tree': elements})
          commit = gh_json('/git/commits', method='POST', payload={
              'message': 'Recover Azure Reach Issue 2 P01-P11 original drafts',
              'tree': tree['sha'],
              'parents': [HEAD],
          })
          gh_json('/git/refs/heads/main', method='PATCH', payload={'sha': commit['sha'], 'force': False})
          print('COMMIT', commit['sha'])
          print('RECOVERED_COUNT', len(recovered))
          PY
