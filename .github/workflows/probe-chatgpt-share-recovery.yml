name: Probe ChatGPT share recovery

on:
  push:
    paths:
      - production/recovery/share-source.json
      - .github/workflows/probe-chatgpt-share-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public-share image resolver with session cookies
        shell: bash
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          share_id = '6a9bed0e-1c3c-83ea-8316-0a24093527d9'
          file_id = 'file_000000001ac4822f874db6f4f1b5bb1e'
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          share_url = f'https://chatgpt.com/share/{share_id}'
          req = urllib.request.Request(share_url, headers={'User-Agent': ua, 'Accept': 'text/html,application/xhtml+xml'})
          with opener.open(req, timeout=30) as r:
              page = r.read().decode('utf-8', 'replace')
              print('SHARE_STATUS', getattr(r, 'status', None), 'BYTES', len(page))
          print('COOKIE_NAMES', sorted({c.name for c in jar}))
          for marker in ('access_token', 'share_token', 'shared_conversation_id', 'csrf', 'authorization'):
              print('PAGE_MARKER', marker, len(re.findall(marker, page, flags=re.I)))

          base = f'https://chatgpt.com/backend-api/files/download/{file_id}'
          candidates = [
              base + '?' + urllib.parse.urlencode({'shared_conversation_id': share_id, 'inline': 'false'}),
              base + '?' + urllib.parse.urlencode({'conversation_id': share_id, 'inline': 'false'}),
          ]
          headers = {
              'User-Agent': ua,
              'Referer': share_url,
              'Origin': 'https://chatgpt.com',
              'Accept': 'application/json,text/plain,*/*',
          }
          success = False
          for i, url in enumerate(candidates, 1):
              print('TRY', i, urllib.parse.urlsplit(url).query)
              req = urllib.request.Request(url, headers=headers)
              try:
                  with opener.open(req, timeout=30) as r:
                      body = r.read(1024 * 1024)
                      print('STATUS', getattr(r, 'status', None), 'TYPE', r.headers.get('Content-Type'), 'BYTES', len(body))
                      payload = json.loads(body.decode('utf-8', 'replace'))
                      print('JSON_KEYS', sorted(payload.keys()) if isinstance(payload, dict) else type(payload).__name__)
                      download = payload.get('download_url') if isinstance(payload, dict) else None
                      if isinstance(download, str) and download.startswith('http'):
                          print('HAS_DOWNLOAD_URL', True)
                          with opener.open(urllib.request.Request(download, headers={'User-Agent': ua}), timeout=45) as dr:
                              data = dr.read(5 * 1024 * 1024)
                              print('DOWNLOAD_STATUS', getattr(dr, 'status', None), 'TYPE', dr.headers.get('Content-Type'), 'BYTES', len(data), 'MAGIC', data[:12].hex())
                          success = len(data) > 100000
                          if success:
                              break
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR', e.code, e.read(1000).decode('utf-8', 'replace')[:500].replace('\n',' '))
              except Exception as e:
                  print('ERROR', type(e).__name__, str(e))
          if not success:
              sys.exit(2)
          PY
