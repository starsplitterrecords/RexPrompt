name: Probe ChatGPT share recovery

on:
  push:
    paths:
      - production/recovery/share-source.json
      - .github/workflows/probe-chatgpt-share-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public share page
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import sys
          import urllib.request

          cfg = json.load(open('production/recovery/share-source.json', encoding='utf-8'))
          url = cfg['url']
          req = urllib.request.Request(
              url,
              headers={'User-Agent': 'Mozilla/5.0 (StarSplitterVisions recovery probe)'}
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  final = r.geturl()
                  status = getattr(r, 'status', None)
          except Exception as exc:
              print('FETCH_ERROR', type(exc).__name__, str(exc))
              sys.exit(1)

          print('STATUS', status)
          print('FINAL', final)
          print('BYTES', len(data))

          text = data.decode('utf-8', 'replace')
          lowered = text.lower()
          print('HAS_OAIUSERCONTENT', 'oaiusercontent' in lowered)
          print('HAS_FILE_ID', 'file_' in text)
          print('HAS_NEXT_DATA', '__next_data__' in lowered)
          print('HAS_IMAGE_TOKEN', 'image' in lowered)

          decoded = html.unescape(text).replace('\\u0026', '&').replace('\\/', '/')
          candidates = set()
          for token in re.findall(r'https?://[^"\'<>\\s]+', decoded):
              low = token.lower()
              if any(marker in low for marker in (
                  'oaiusercontent',
                  'oaistatic',
                  '/backend-api/',
                  '/files/',
                  '.png',
                  '.jpg',
                  '.jpeg',
                  '.webp',
              )):
                  candidates.add(token[:1000])

          print('CANDIDATE_URLS', len(candidates))
          for candidate in sorted(candidates)[:120]:
              print('URL', candidate)
          PY
