name: Attach Sunforge shared direction

on:
  push:
    branches:
      - rewrite-sunforge-current-four-20260913

permissions:
  contents: write

jobs:
  attach:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-sunforge-current-four-20260913
          fetch-depth: 0
      - name: Attach shared direction and validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          base = root / 'data/shows/sunforge-outlaw-s1'
          chars = json.loads((base/'characters.json').read_text())
          settings = json.loads((base/'settings.json').read_text())
          regions = json.loads((base/'regions.json').read_text())
          directions = json.loads((base/'direction.json').read_text())
          assert 'sunforge-story' in directions
          total = 0
          for issue in range(1,5):
              path = base / f'pages_e0{issue}.json'
              pages = json.loads(path.read_text())
              for pg in pages:
                  pg['direction'] = ['sunforge-story']
                  assert pg['setting'] in settings
                  assert pg['region'] in regions
                  for cid in pg.get('characters', []):
                      assert cid in chars
                  total += 1
              path.write_text(json.dumps(pages, indent=2, ensure_ascii=False) + '\n')
          assert total == 25
          (root / '.github/workflows/sunforge-direction-attach.yml').unlink()
          PY
      - name: Commit shared direction attachment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/shows/sunforge-outlaw-s1/pages_e01.json data/shows/sunforge-outlaw-s1/pages_e02.json data/shows/sunforge-outlaw-s1/pages_e03.json data/shows/sunforge-outlaw-s1/pages_e04.json
          git add -u
          git diff --cached --quiet || git commit -m 'Attach Sunforge shared story direction'
          git push origin HEAD:rewrite-sunforge-current-four-20260913
