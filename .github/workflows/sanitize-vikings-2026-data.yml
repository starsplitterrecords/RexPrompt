name: Sanitize Vikings 2026 data

on:
  push:
    branches:
      - sanitize-vikings-2026-data

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize-vikings-2026-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sanitize active Vikings data
        run: python tools/sanitize_vikings_2026_once.py
      - name: Validate Vikings production package
        run: python tools/validate_vikings_2026.py
      - name: Commit sanitized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows.json data/shows/vikings-2026-s1/characters.json data/shows/vikings-2026-s1/encoded
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sanitize Vikings production data"
            git push origin HEAD:sanitize-vikings-2026-data
          fi
