name: Low Tide tide-language audit

on:
  push:
    branches:
      - low-tide-natural-tide-language
    paths-ignore:
      - data/shows/low-tide-signal/tide_language_audit.md

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Audit active Low Tide pages
        run: |
          python - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          root=Path("data/shows/low-tide-signal")
          specs=[
            ("C01-C03",root/"pages_ch01_ch03_compiled.json",None),
            ("C04",root/"encoded/pages_c04_between_runs_enhanced.json.gzb64","gz"),
            ("C05",root/"encoded/pages_c05_return_tide_enhanced.json.gzb64","gz"),
            ("C06",root/"encoded/pages_c06_after_the_water_enhanced.json.gzb64","gz"),
            ("C07",root/"encoded/pages_c07_last_low_tide_enhanced.json.gzb64","gz"),
          ]
          def load(p,e):
            if e=="gz":
              return json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode())
            return json.loads(p.read_text())
          def pages(o):
            if isinstance(o,list): return o
            for k in ("pages","scenes","items"):
              if isinstance(o,dict) and isinstance(o.get(k),list): return o[k]
            raise TypeError(type(o))
          rows=[]
          for label,p,e in specs:
            for page in pages(load(p,e)):
              pid=page.get("id","?")
              def walk(v,path):
                if isinstance(v,str) and re.search(r"window",v,re.I):
                  rows.append((label,pid,path,v.replace("\n"," ")))
                elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f"{path}[{i}]")
                elif isinstance(v,dict):
                  for k,x in v.items(): walk(x,f"{path}.{k}" if path else k)
              walk(page,"")
          out=["# Low Tide tide-language audit","","| Package | Page | Field | Text |","|---|---|---|---|"]
          for row in rows:
            label,pid,path,txt=row
            out.append(f"| {label} | {pid} | {path} | {txt.replace('|','\\|')} |")
          out += ["",f"Total window occurrences in active pages: **{len(rows)}**",""]
          (root/"tide_language_audit.md").write_text("\n".join(out),encoding="utf-8")
          PY
      - name: Commit audit
        run: |
          git config user.name "starsplitterrecords"
          git config user.email "actions@users.noreply.github.com"
          git add data/shows/low-tide-signal/tide_language_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Low Tide tide-window language"
          git push origin HEAD:${{ github.ref_name }}
