name: Audit Vikings Issue 6 assembly
on:
  push:
    branches: [productionize/vikings-issue6]
    paths:
      - tools/audit_vikings_i06_assembly.py
      - .github/workflows/audit-vikings-i06-assembly.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productionize/vikings-issue6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_vikings_i06_assembly.py
      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/vikings-2026-s1/issue_06_assembled_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit assembled Vikings Issue 6 recipes"
          git push origin HEAD:productionize/vikings-issue6

# pass 4: final rerun after artist-readability cleanup
