name: Validate meta-writing repair

on:
  push:
    branches:
      - 'fix/meta-writing-contamination'
    paths:
      - '.github/workflows/apply-meta-writing-fix.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run strict affected-series validators
        run: |
          python tools/validate_azure_reach.py
          python tools/validate_backyard_rockets.py
          python tools/validate_backyard_rockets_sanitization.py
          python tools/validate_echoes.py
          python tools/validate_rex_fleet.py
          python tools/validate_stardust_station.py
          python tools/validate_vikings_2026.py
          python tools/validate_low_tide_img_normalization.py
          python tools/validate_visual_state.py

      - name: Confirm Division Threshold validator failure predates repair
        run: |
          set +e
          branch_output=$(python tools/validate_division_threshold.py 2>&1)
          branch_status=$?
          git worktree add /tmp/rexprompt-main origin/main >/dev/null
          main_output=$(cd /tmp/rexprompt-main && python tools/validate_division_threshold.py 2>&1)
          main_status=$?
          set -e
          printf '%s\n' "$branch_output"
          echo "branch_status=$branch_status main_status=$main_status"
          if [ "$branch_status" -eq 0 ]; then
            exit 0
          fi
          if [ "$main_status" -ne 0 ] \
             && printf '%s' "$branch_output" | grep -q 'Division Threshold session-start gate is incomplete' \
             && printf '%s' "$main_output" | grep -q 'Division Threshold session-start gate is incomplete'; then
            echo 'Division Threshold failure is unchanged from origin/main and is unrelated to this dialogue repair.'
            exit 0
          fi
          echo 'Division Threshold validation differs from origin/main.'
          printf '%s\n' "$main_output"
          exit 1

      - name: Install review dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5

      - name: Build assembled production reviews
        run: python tools/export_review_pdfs.py --out dist/review-pdfs

      - name: Upload assembled review bundle
        uses: actions/upload-artifact@v4
        with:
          name: meta-writing-repair-review-${{ github.sha }}
          path: dist/review-pdfs/
          if-no-files-found: error
          retention-days: 7
