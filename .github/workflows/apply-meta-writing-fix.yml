name: Final writerly-language page-note cleanup

on:
  push:
    branches:
      - 'fix/meta-writing-contamination'
    paths:
      - '.github/workflows/apply-meta-writing-fix.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean final page notes
        run: python tools/fix_writerly_language_final_notes.py
      - name: Validate Backyard Rockets
        run: |
          python tools/validate_backyard_rockets.py
          python tools/validate_backyard_rockets_sanitization.py
      - name: Install review dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5
      - name: Build assembled production reviews
        run: python tools/export_review_pdfs.py --out dist/review-pdfs
      - name: Upload assembled review bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-writerly-language-review-${{ github.sha }}
          path: dist/review-pdfs/
          if-no-files-found: error
          retention-days: 7
      - name: Commit repaired story data
        run: |
          if git diff --quiet -- data; then exit 1; fi
          git config user.name 'starsplitterrecords'
          git config user.email '77013062+starsplitterrecords@users.noreply.github.com'
          git add data
          git commit -m 'Remove final writerly production notes'
          git push
