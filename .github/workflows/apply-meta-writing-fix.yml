name: Apply one-shot meta-writing repair

on:
  push:
    branches:
      - 'fix/meta-writing-contamination'
    paths:
      - '.github/workflows/apply-meta-writing-fix.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore original plain JSON formatting
        run: python tools/restore_plain_meta_diff.py

      - name: Commit minimized plain JSON diffs
        run: |
          if git diff --quiet -- data; then
            echo 'No formatting changes produced.'
            exit 1
          fi
          git config user.name 'starsplitterrecords'
          git config user.email '77013062+starsplitterrecords@users.noreply.github.com'
          git add data
          git commit -m 'Minimize plain JSON dialogue repair diff'
          git push
