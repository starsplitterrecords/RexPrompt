name: Temporary Azure Reach Chef Boundary Cleanup V2

on:
  push:
    paths:
      - '.github/workflows/tmp-azure-chef-boundary-v2.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/azure-reach-chef-boundary-20260910
      - name: Convert writer continuity into page-specific visual continuity
        shell: python
        run: |
          import base64, gzip, json, pathlib, re
          root=pathlib.Path('data/shows/azure-reach-s1')

          # Shared assembler directions stay image-production-only.
          dpath=root/'direction.json'; d=json.loads(dpath.read_text())
          d['AZR_PRODUCTION_CORE']={'text':'AZURE REACH PRODUCTION CORE — Bright, glossy, well-funded contemporary marine park with luminous public spaces, polished glass-and-stone architecture, clean professional backstage areas and credible working habitats. Animals remain calm and behaviorally credible. Released Azure Reach Issue 1 is strict visual canon for established faces, apparent ages, body proportions, department color coding, facility design and overall rendering language; do not redesign established people or make backstage areas grimy, improvised or industrially degraded.'}
          d['AZR_E02_CONTINUITY']={'text':'ISSUE 2 VISUAL CONTINUITY — Dolphin scenes use the established luminous public gallery and clean care-backstage language, approved trainer objects and controlled keeper return points where scripted. Guests remain behind public barriers; no guest handling, throwing, backstage access or altered animal behavior. Dolphins remain calm and behaviorally credible.'}
          for k in ('AZR_E03_VISUAL_CONTINUITY','AZR_E04_VISUAL_CONTINUITY','AZR_E05_VISUAL_CONTINUITY','AZR_E06_VISUAL_CONTINUITY'):
              d.pop(k,None)
          dpath.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')

          # Only image/physical continuity survives. Story interpretation remains upstream in writing/planning.
          visual={
            'AZR_S1E03_P02':'Tidepool interaction is voluntary, supported and staff-supervised; animal-care rotation and quiet reset remain visibly protected.',
            'AZR_S1E03_P03':'Public education remains active during the premium program; stage the VIP as a reasonable, attentive guest.',
            'AZR_S1E03_P06':'Premium holding does not block accessibility, staff movement or general guest circulation.',
            'AZR_S1E03_P07':'No guest gains backstage access.',
            'AZR_S1E03_P09':'Care timing, accessibility and public circulation remain intact while the premium program reads as intentionally high-end.',
            'AZR_S1E03_P10':'The microscope salon is polished, scientifically credible and entirely public-side; organisms and displays remain naturalistic.',
            'AZR_S1E03_P11':'No flash, animal handling or animal repositioning for photographs; solve the image through human position and public-side lighting.',
            'AZR_S1E03_P12':'The photo setup remains public-side and does not alter animal position, habitat lighting cycle or staff access.',
            'AZR_S1E03_P13':'No premium framing implies additional animal contact.',
            'AZR_S1E03_P14':'General public access to the habitat remains open; routing and visual hierarchy stay readable.',
            'AZR_S1E03_P15':'General habitat access is not reduced; distinguish premium and public programs through staffing and interpretation rather than blocked sightlines.',
            'AZR_S1E03_P16':'Premium and public guests share the visual environment while routes and program boundaries remain clear.',
            'AZR_S1E03_P18':'The public child remains outside the reserved program but can see shared interpretation; VIP guests remain naturalistic, not caricatured.',
            'AZR_S1E03_P19':'Animal-care boundaries, premium/public boundaries and guest routes must all read clearly in one coherent physical geography.',
            'AZR_S1E03_P20':'Animal contact, public habitat access and backstage boundaries remain unchanged.',

            'AZR_S1E04_P01':'Feeding Stream Live observes a normal scheduled staff feeding by approved cameras; animals are not cued, delayed, overfed or repositioned for content.',
            'AZR_S1E04_P02':'Use only approved public-side camera views and credible expert interpretation; animal behavior remains unmanufactured.',
            'AZR_S1E04_P04':'Animal participation remains voluntary and ordinary; refusal is not staged as physical comedy.',
            'AZR_S1E04_P05':'Live comments remain clearly presented as audience comments rather than diagnostic or care information.',
            'AZR_S1E04_P06':'Feeding remains the normal approved staff routine: no extra food, guest hand-feeding or camera-driven cues.',
            'AZR_S1E04_P07':'Sponsor graphics do not obscure important animal behavior or alter the care routine.',
            'AZR_S1E04_P08':'The care session ends when Dora ends it; cameras may continue observing the habitat without prolonging feeding.',
            'AZR_S1E04_P09':'Post-feed animals behave normally; no continuous performance is implied.',
            'AZR_S1E04_P10':'Show the visible labor of moderation, animal care and guest service around the stream.',
            'AZR_S1E04_P13':'Any staff view comes through an approved public-safe camera and existing glass; no restricted systems, private screens or private information are visible.',
            'AZR_S1E04_P14':'Staff expertise is shown only from approved public-side positions; no backstage camera access or private operational screens.',
            'AZR_S1E04_P16':'No countdown, forced cue or manufactured animal climax appears; public wording describes an observation window.',
            'AZR_S1E04_P21':'The stream presentation shows accurate window language, expert interpretation and moderated audience questions without manufactured urgency.',

            'AZR_S1E05_P04':'Accessibility and staff movement remain physically clear; campaign routing does not reduce program access.',
            'AZR_S1E05_P09':'Participation remains usable without a smartphone; physical and digital options coexist without invasive guest tracking.',
            'AZR_S1E05_P10':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P11':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P12':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P13':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P14':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P15':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P16':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P17':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P18':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P19':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P20':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P21':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',
            'AZR_S1E05_P22':'Preserve Conservation Week signage, optional participation materials, traffic state, counters and carried props from the preceding page.',

            'AZR_S1E06_P02':'The service spine, accessible public route and animal-care access remain visibly clear and unobstructed.',
            'AZR_S1E06_P06':'Sponsor recognition remains visible while physical obstruction is removed; projection stays elegant and does not disrupt habitat lighting.',
            'AZR_S1E06_P07':'All gala guest routes remain accessible; premium treatment comes through hosting and programming rather than blocked architecture.',
            'AZR_S1E06_P08':'Hospitality remains accessible and sufficient; food-service staging is competent and spatially credible.',
            'AZR_S1E06_P09':'Gala programming does not change animal-care timing or add animal contact; interpretation remains public-side.',
            'AZR_S1E06_P10':'The service spine remains protected and unobstructed for the rest of the gala sequence.',
            'AZR_S1E06_P14':'Interpretation remains public-side; restricted operations are shown only through safe views and approved diagrams, never opened for gala access.',
            'AZR_S1E06_P15':'No retrieval-myth staging, extra premium animal contact, countdown-driven feeding or inflated conservation display is reintroduced.',
            'AZR_S1E06_P16':'Keep the gala bright, aquatic and prestigious while ordinary park operations remain visible beneath the event.',
            'AZR_S1E06_P17':'No additional animal cue, feed or contact is created for prestige; Julian remains calm and matter-of-fact.',
            'AZR_S1E06_P18':'Use approved technical alternates without interrupting animal care, guest routing or the gala schedule.',
            'AZR_S1E06_P20':'Ordinary animal care continues visibly through the gala sequence.',
            'AZR_S1E06_P22':'Preserve the established staff-overlook ending composition and bright aquatic visual identity.'
          }

          removed=0; inserted=0; changed_files=0
          for p in sorted((root/'encoded').glob('*.json.gzb64')):
              data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode()); dirty=False
              pages=data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  pid=str(page.get('id',''))
                  if not re.match(r'^AZR_S1E0[2-6]_P\d{2}$',pid): continue
                  inline=page.get('directionInline') or []
                  clean=[]
                  for item in inline:
                      text=item.get('text','') if isinstance(item,dict) else str(item)
                      if text.startswith('PAGE CONTINUITY —'):
                          removed+=1; dirty=True; continue
                      clean.append(item)
                  if pid in visual:
                      clean.append({'text':'VISUAL CONTINUITY — '+visual[pid]}); inserted+=1; dirty=True
                  page['directionInline']=clean
              if dirty:
                  p.write_text(base64.b64encode(gzip.compress((json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n').encode(),mtime=0)).decode()+'\n')
                  changed_files+=1

          # Scope the permanent guard to unreleased Issues 2-6 only. Released Issue 1 remains untouched.
          vpath=pathlib.Path('tools/validate_azure_reach.py'); v=vpath.read_text()
          needle='        for item in local_direction:\n            assert isinstance(item, dict), f"{page_id}: malformed directionInline entry"\n            assert isinstance(item.get("text"), str) and item["text"].strip(), f"{page_id}: blank directionInline text"\n'
          guard=needle+'            if page_id.startswith(("AZR_S1E02_", "AZR_S1E03_", "AZR_S1E04_", "AZR_S1E05_", "AZR_S1E06_")):\n                assert not item["text"].startswith("PAGE CONTINUITY —"), f"{page_id}: writer continuity leaked into chef recipe"\n'
          if 'writer continuity leaked into chef recipe' not in v: v=v.replace(needle,guard)
          vpath.write_text(v)

          # Deep checks: no writer continuity in E2-E6; released E1 is not rewritten.
          remaining=[]; visual_count=0
          writer_terms=('institutional learning','beatrice\'s growth','finale\'s lesson','causal season-finale','carry forward issue','do not reset','proof-of-system page','operational restraint')
          for p in sorted((root/'encoded').glob('*.json.gzb64')):
              data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode())
              pages=data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  pid=str(page.get('id',''))
                  if not re.match(r'^AZR_S1E0[2-6]_P\d{2}$',pid): continue
                  for item in page.get('directionInline') or []:
                      text=item.get('text','') if isinstance(item,dict) else str(item)
                      if text.startswith('PAGE CONTINUITY —'): remaining.append(pid)
                      if text.startswith('VISUAL CONTINUITY —'): visual_count+=1
                      low=text.lower()
                      assert not any(term in low for term in writer_terms), (pid,text)
          assert not remaining, remaining
          assert removed==88, removed
          assert visual_count==len(visual), (visual_count,len(visual))
          print('Removed writer PAGE CONTINUITY blocks:',removed)
          print('Inserted page-specific VISUAL CONTINUITY blocks:',visual_count)
          print('Changed encoded files:',changed_files)
      - name: Validate Azure Reach
        run: python tools/validate_azure_reach.py
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name starsplitterrecords
          git config user.email 77013062+starsplitterrecords@users.noreply.github.com
          git rm -f .github/workflows/tmp-azure-chef-boundary.yml .github/workflows/tmp-azure-chef-boundary-v2.yml
          git add data/shows/azure-reach-s1/direction.json data/shows/azure-reach-s1/encoded tools/validate_azure_reach.py
          git commit -m 'Separate Azure Reach visual continuity from writing notes'
          git push origin HEAD:fix/azure-reach-chef-boundary-20260910
