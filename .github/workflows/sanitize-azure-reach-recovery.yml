name: Temporary Azure Reach recovery sanitizer

on:
  push:
    branches:
      - recover/azure-reach-issue-02
    paths:
      - 'tools/sanitize_azure_reach_recovery.py'
      - '.github/workflows/sanitize-azure-reach-recovery.yml'

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover/azure-reach-issue-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sanitize_azure_reach_recovery.py
      - name: Commit sanitized payloads
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shows/azure-reach-s1/encoded/pages_e02_p01_p06.json.gzb64 data/shows/azure-reach-s1/encoded/pages_e02_p07_p12.json.gzb64
          git commit -m 'Sanitize Azure Reach Issue 2 recovery payloads [skip ci]'
          git push origin HEAD:recover/azure-reach-issue-02
