name: Extract Stardust Page 11

on:
  push:
    branches:
      - agent/extract-stardust-page11

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print source-locked page 11 recipe
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path
          root = Path('.')
          show = root / 'data' / 'shows' / 'stardust-station'
          path = show / 'encoded' / 'pages_e01_p07_p12.json.gzb64'
          encoded = ''.join(path.read_text(encoding='utf-8').split()).rstrip('=')
          encoded += '=' * ((4 - len(encoded) % 4) % 4)
          pages = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8'))
          page = next(p for p in pages if p.get('id') == 'SDS_S1E01_P11')
          print('PAGE11_JSON_BEGIN')
          print(json.dumps(page, ensure_ascii=False, indent=2))
          print('PAGE11_JSON_END')
