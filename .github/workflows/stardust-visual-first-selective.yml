name: Stardust visual-first selective repair

on:
  push:
    branches:
      - fix/stardust-visual-first-final2-20260911
    paths:
      - .github/workflows/stardust-visual-first-selective.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stardust-visual-first-final2-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply selective visual-first repair
        run: python tools/tmp_stardust_visual_first_selective.py
      - name: Validate Stardust
        run: python tools/validate_stardust_station.py
      - name: Commit production-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Stardust recipes selectively visual-first"
          git push
