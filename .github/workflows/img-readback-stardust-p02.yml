name: IMG Readback Stardust P02

on:
  push:
    paths:
      - '.github/workflows/img-readback-stardust-p02.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact SDS_S1E02_P02 recipe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p readback
          python3 - <<'PY'
          import base64, gzip, json, pathlib
          src = pathlib.Path('data/shows/stardust-station/encoded/pages_e02_p01_p06.json.gzb64')
          pages = json.loads(gzip.decompress(base64.b64decode(src.read_text().strip())))
          p2 = next(p for p in pages if p.get('id') == 'SDS_S1E02_P02')
          pathlib.Path('readback/SDS_S1E02_P02.json').write_text(json.dumps(p2, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Upload exact recipe
        uses: actions/upload-artifact@v4
        with:
          name: stardust-p02-recipe-readback
          path: readback/
          if-no-files-found: error
          retention-days: 1
