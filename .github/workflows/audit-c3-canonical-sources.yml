name: Audit canonical source image completeness
on:
  pull_request:
    paths:
      - 'production/drafts/**'
      - 'production/references/**'
      - 'tools/audit_c3_canonical_source_images.cjs'
      - '.github/workflows/audit-c3-canonical-sources.yml'
  push:
    branches: [main]
    paths:
      - 'production/drafts/**'
      - 'production/references/**'
      - 'tools/audit_c3_canonical_source_images.cjs'
      - '.github/workflows/audit-c3-canonical-sources.yml'
  workflow_dispatch:
jobs:
  source-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/audit_c3_canonical_source_images.cjs
      - run: node tools/audit_c3_canonical_source_images.cjs --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-source-image-completeness
          path: canonical-source-image-completeness.json
          if-no-files-found: warn
