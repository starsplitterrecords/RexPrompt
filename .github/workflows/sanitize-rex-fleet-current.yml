name: Sanitize current Rex Fleet

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event.pull_request.head.ref == 'sanitize-rex-fleet-rebased' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize-rex-fleet-rebased
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sanitize current Rex Fleet
        run: python tools/sanitize_rex_fleet_current.py
      - name: Validate existing Rex Fleet invariants
        run: python tools/validate_rex_fleet.py
      - name: Commit sanitized current package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/shows.json data/shows/rex-fleet-s1 index.html
          if git diff --cached --quiet; then
            echo 'No sanitation changes.'
            exit 0
          fi
          git commit -m "Sanitize current Rex Fleet production package"
          git push origin HEAD:sanitize-rex-fleet-rebased
