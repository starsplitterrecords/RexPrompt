name: Azure Dialogue Editorial Audit
on:
  pull_request:
    paths:
      - 'tools/audit_azure_dialogue_c.cjs'
      - '.github/workflows/azure-dialogue-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report authored Azure dialogue and panel mapping
        run: node tools/audit_azure_dialogue_c.cjs
