name: IMG Readback Stardust P03

on:
  push:
    paths:
      - '.github/workflows/img-readback-stardust-p03.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact P03 recipe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p readback
          python3 - <<'PY'
          import base64, gzip, json, pathlib
          src = pathlib.Path('data/shows/stardust-station/encoded/pages_e02_p01_p06.json.gzb64')
          pages = json.loads(gzip.decompress(base64.b64decode(src.read_text().strip())))
          p = next(x for x in pages if x.get('id') == 'SDS_S1E02_P03')
          pathlib.Path('readback/SDS_S1E02_P03.json').write_text(json.dumps(p, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Upload exact recipe
        uses: actions/upload-artifact@v4
        with:
          name: stardust-p03-recipe-readback
          path: readback/SDS_S1E02_P03.json
          if-no-files-found: error
          retention-days: 1
