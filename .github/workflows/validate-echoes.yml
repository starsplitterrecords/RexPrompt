name: Validate Echoes

on:
  push:
    branches:
      - main
    paths:
      - 'data/shows.json'
      - 'data/shows/echoes-forgotten-war-s1/**'
      - 'production/references/echoes-forgotten-war/**'
      - 'tools/validate_echoes.py'
      - 'tools/sanitize_echoes.py'
      - 'tools/sanitize_echoes_residue.py'
      - '.github/workflows/validate-echoes.yml'
  pull_request:
    paths:
      - 'data/shows.json'
      - 'data/shows/echoes-forgotten-war-s1/**'
      - 'production/references/echoes-forgotten-war/**'
      - 'tools/validate_echoes.py'
      - 'tools/sanitize_echoes.py'
      - 'tools/sanitize_echoes_residue.py'
      - '.github/workflows/validate-echoes.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Echoes production data
        run: python tools/validate_echoes.py
