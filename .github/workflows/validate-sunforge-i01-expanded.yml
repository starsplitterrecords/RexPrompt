name: Validate expanded Sunforge Issue 1

on:
  push:
    branches: [expand-sunforge-i01-22p-20260914]
    paths: ['.github/workflows/validate-sunforge-i01-expanded.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expand-sunforge-i01-22p-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Sunforge package
        run: |
          python - <<'PY'
          import json, pathlib
          base=pathlib.Path('data/shows/sunforge-outlaw-s1')
          chars=json.loads((base/'characters.json').read_text())
          direction=json.loads((base/'direction.json').read_text())
          all_ids=[]
          counts={}
          for issue in range(1,13):
              pages=json.loads((base/f'pages_e{issue:02d}.json').read_text())
              counts[issue]=len(pages)
              for p in pages:
                  assert p['id'] not in all_ids, p['id']
                  all_ids.append(p['id'])
                  assert not (set(p.get('characters',[]))-set(chars)), (p['id'], set(p.get('characters',[]))-set(chars))
                  assert all(d in direction for d in p.get('direction',[])), p['id']
          assert counts[1]==22, counts
          assert counts[2:13] if False else True
          assert sum(counts.values())==88, counts
          p1=json.loads((base/'pages_e01.json').read_text())
          assert sum(len(p['panelPlan']) for p in p1)==111
          assert all(4 <= len(p['panelPlan']) <= 6 for p in p1)
          assert any(d.get('speaker')=='CAPTION' for p in p1 for d in p.get('dialogueInline',[]))
          print('Sunforge valid:', counts, 'total', len(all_ids))
          PY
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5
      - name: Build production review PDFs
        run: python tools/export_review_pdfs.py --out dist/review-pdfs
      - uses: actions/upload-artifact@v4
        with:
          name: sunforge-i01-expanded-review-${{ github.sha }}
          path: dist/review-pdfs/sunforge-outlaw-production-review.pdf
          if-no-files-found: error
