name: Azure Reach semantic sanitization

on:
  push:
    paths:
      - '.github/workflows/azure-reach-sanitize-diagnostic.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sanitize Azure Reach production data
        run: python tools/sanitize_azure_reach.py
      - name: Commit sanitized production data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/shows/azure-reach-s1/direction.json data/shows/azure-reach-s1/encoded
          if git diff --cached --quiet; then
            echo 'No sanitization changes required.'
          else
            git commit -m 'Sanitize Azure Reach RexPrompt production data'
            git push
          fi
