          for p in pages47:
            if p.get('panelPlan'):
              p['panelPlan']=[replacements.get(x,x) for x in p['panelPlan']]

          all_pages=pages123+pages47
          # Writer-room rationale does not belong in the image recipe.
          for p in all_pages:
            p.pop('directionInline',None)
            plan=p.get('panelPlan') or []
            assert plan, f"{p['id']} missing panelPlan"
            if len(plan)==1:
              p['summary']='Full-page composition: '+plan[0]
            else:
              p['summary']=f"{len(plan)}-panel page. Opening image: {plan[0]} Final image: {plan[-1]}"

          save(base/'pages_ch01_ch03_compiled.json',pages123)
          for path,obj in encoded_objs:
            encode_file(path,obj)

          # Global generation language: visual/production contract only.
          generation=(
            'Finished full-color portrait prestige indie comic page for Low Tide Signal. '
            'Grounded near-future Atlantic coastal science fiction with naturalistic adult acting, wet concrete, black tidal water, salt-stained abandoned structures, rain, fog, and a muted teal/cyan/gray palette with sodium-amber practical light. '
            'Harbor Phase contains occupied apartments, commuters, families, shops, transit, workplaces, bars, playgrounds, and active public space. '
            'Reach scenes use headlamps, contractor lights, phone and device screens, vehicle lights, and temporary runner LEDs. '
            'Preserve recurring character faces, body types, clothing, gear, location geography, water level, weather, and exact scripted lettering. '
            'No lanterns, supernatural effects, memory effects, or generic cyberpunk neon. Fictional production.'
          )
          manifest=load('data/shows.json')
          low=[s for s in manifest if s.get('seriesId')=='low-tide-signal']
          assert len(low)==7
          for s in low: s['generationLine']=generation
          save('data/shows.json',manifest)

          # Character development logic remains in source, but assembler-visible fields become drawable acting/appearance only.
          chars=load(base/'characters.json')
          visual_perf={
            'C_lts_matt_donnelly':'Squared practical posture; hands frequently on pack straps, tide monitor, tools, bags, or route markers. When challenged, his jaw tightens and his eyes stay forward; later scenes use smaller gestures and less center-of-frame posing.',
            'C_lts_ryan_kelleher':'Economical movement; eyes frequently on water, footing, weather, or structure while others look at one another. Speaks with minimal gesture; hands often occupied with rope, railings, boots, or marine equipment.',
            'C_lts_chris_barlow':'Loose conversational posture with recorder, tablet, cables, or battery gear often in hand. Quick grin and raised eyebrows during jokes; fear appears as sudden stillness, lowered device, or a glance away.',
            'C_lts_justin_rourke':'Largest physical silhouette; restless stance, broad gestures, frequent climbing, perching, leaning, or reaching into space. Often turns his chest toward onlookers; post-disaster scenes keep both feet grounded and gestures smaller.',
            'C_lts_nicole_hanley':'Relaxed equal inside group spacing; practical gestures, dry half-smile, physically joins climbs and exploration. Handles map or compact gear only when present in the page action; keep her within group clusters instead of isolated explanatory poses.',
            'C_lts_kevin_marsh':'Watchful posture; gaze shifts between sensor, sky, water, route and other faces. Small precise hand gestures while speaking; shoulders tighten around uncertain readings, with steadier eye contact when he gives a firm warning.'}
          visual_cont={
            'C_lts_matt_donnelly':['early-30s apparent age','solid frame','practical work jacket','worn boots','contractor bag','tide monitor clipped to strap'],
            'C_lts_ryan_kelleher':['early-30s apparent age','weathered marine jacket','waterproof layered gear','old practical boots','salt-stained working-water appearance'],
            'C_lts_chris_barlow':['late-20s/early-30s apparent age','layered hoodie or tech jacket','cracked tablet or recorder','battery packs and excessive cables','digitally overprepared silhouette'],
            'C_lts_justin_rourke':['late-20s/early-30s apparent age','largest/heaviest frame in core group','rescue vest or heavy outer layer','rope/climbing gear','scuffed boots'],
            'C_lts_nicole_hanley':['late-20s/early-30s apparent age','practical waterproof layers','compact gear','gloves','folded map only when scene-relevant','non-theatrical practical silhouette'],
            'C_lts_kevin_marsh':['late-20s/early-30s apparent age','layered rain gear','tablet or tide device','small weather sensor','watchful posture']}
          for cid,e in chars.items():
            if e.get('performance'): e['developmentPerformance']=e['performance']
            if e.get('relationship'): e['developmentRelationship']=e['relationship']
            e['performance']=visual_perf[cid]
            e.pop('relationship',None)
            e['promptContinuity']=visual_cont[cid]
          save(base/'characters.json',chars)

          # Settings and regions emitted by the chef contain only visible place information.
          settings=load(base/'settings.json')
          setting_text_overrides={
            'S_lts_harbor_phase_inland':'Harbor Phase — Inland City — Busy adapted coastal city with commuters, families, shops, cafes, occupied apartments, raised transit, flood-control gates, playgrounds and public-service screens. Gray-blue rain, civic glass, warm human interiors, wet paving and practical public lighting.',
            'S_lts_mall_map':'Fashion Harbor Center — Map and Connections — Offline directory maps and faded route displays connect the mall to transit and residential districts; cracked screens, water damage, wet walls and figures huddled over the map.',
            'S_lts_deep_reach':'Deep Reach — Unfinished schools, parks, housing, plazas, civic buildings, transit loops, clinics and community spaces under flat coastal light; ordinary municipal architecture, faded wayfinding, empty streets, tide marks and windblown debris.'}
          for sid,text in setting_text_overrides.items():
            if sid in settings: settings[sid]['text']=text
          save(base/'settings.json',settings)

          regions=load(base/'regions.json')
          regions['R_lts_inland']['text']='Inland Harbor Phase — Adapted coastal city of occupied apartments, raised transit, flood-control gates, shops, bars, workplaces, playgrounds, public screens and covered walkways. Soft gray-blue rain, civic glass, wet paving, warm interior windows and practical public lighting.'
          regions['R_lts_threshold']['text']='Threshold / Floodwall — Old ferry lot, staging area, flood steps and tide boards against the massive floodwall. Wet asphalt, cold mist, open car trunks, vehicle headlights, contractor-white work lights and dark concrete.'
          regions['R_lts_flats']['text']='The Flats — Exposed seabed of black tidal mud, old pavement, channels, broken pilings, shell debris, shallow teal pools and dense fog. Boots sink and splash; distant sodium reflections shimmer across wet surfaces.'
          regions['R_lts_reach']['text']='The Reach — Salt-stained abandoned offshore districts exposed at low tide: wet concrete, rusted railings, flooded lower levels, broken walkways, black water, deep cyan fog and faded institutional-green surfaces. Headlamps and work lights fall off quickly in fog.'
          save(base/'regions.json',regions)

          # Mechanical chef-boundary checks before committing.
          expected={1:24,2:26,3:28,4:26,5:24,6:24,7:26}
          by={}
          for p in all_pages: by.setdefault(int(p['chapter']),[]).append(p)
          assert {k:len(v) for k,v in sorted(by.items())}==expected
          assert len({p['id'] for p in all_pages})==178
          assert all(p.get('panelPlan') for p in all_pages)
          assert all('directionInline' not in p for p in all_pages)
          meta=re.compile(r'\b(thesis|story function|narrative|dramatic beat|authority arc|social defect|corrective woman|audience surrogate|validator|moralistic|indict|self-exoneration|not proof|not a research problem|hidden-history revelation|because the adaptation works|should carry|should feel|let the choice|closes inquiry|opens? a mystery)\b',re.I)
          bad=[]
          for p in all_pages:
            for field in [p.get('summary',''),*(p.get('panelPlan') or [])]:
              if meta.search(field): bad.append((p['id'],field))
          for e in chars.values():
            for field in [e.get('performance',''),*(e.get('promptContinuity') or [])]:
              if meta.search(field): bad.append(('CHAR',field))
          for s in low:
            if meta.search(s.get('generationLine','')): bad.append((s['id'],s['generationLine']))
          for e in settings.values():
            if meta.search(e.get('text','')): bad.append(('SETTING',e.get('text','')))
          for e in regions.values():
            if meta.search(e.get('text','')): bad.append(('REGION',e.get('text','')))
          assert not bad, bad[:20]
          print('LOW TIDE VISUAL-FIRST NORMALIZATION OK')
          print('PAGES',len(all_pages),'WITH PANEL PLANS',sum(bool(p.get('panelPlan')) for p in all_pages))
          print('DIRECTION INLINE',sum(bool(p.get('directionInline')) for p in all_pages))
          print('CHAPTER COUNTS',{k:len(v) for k,v in sorted(by.items())})
          PY
      - name: Commit production rewrite and remove temporary runners
        shell: bash
        run: |
          rm -f .github/workflows/audit-low-tide-chef-language.yml
          rm -f .github/workflows/apply-low-tide-visual-first.yml
          git config user.name "starsplitterrecords"
          git config user.email "77013062+starsplitterrecords@users.noreply.github.com"
          git add -A data/shows.json data/shows/low-tide-signal .github
          git commit -m "Make Low Tide recipes visual-first for image generation"
          git push origin HEAD:main
