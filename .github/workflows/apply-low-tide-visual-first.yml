name: Apply Low Tide visual-first chef normalization
on:
  push:
    paths:
      - '.github/workflows/apply-low-tide-visual-first.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite Low Tide chef-facing recipes as visual instructions
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path

          root=Path('.')
          base=Path('data/shows/low-tide-signal')
          enc=base/'encoded'
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def save(p,obj): Path(p).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          def decode_file(path):
            raw=''.join(path.read_text().split())
            obj=json.loads(gzip.decompress(base64.b64decode(raw)))
            pages=obj.get('pages',obj) if isinstance(obj,dict) else obj
            return obj,pages
          def encode_file(path,obj):
            payload=json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode('utf-8')
            path.write_text(base64.b64encode(gzip.compress(payload,mtime=0)).decode('ascii')+'\n')

          # Chapters 1-3 previously had story summaries but no drawable panel construction.
          # These plans are deliberately concrete: framing, bodies, props, geography, light, and visible action.
          P={
          'LTS_C01_P01':['Full-page wide city view in gray-blue rain: raised transit crosses above flood-control gates; occupied apartment windows, food stalls, umbrellas, automated freight and wet sidewalks fill Harbor Phase.'],
          'LTS_C01_P02':['Wide interior of raised transit with Matt seated by a rain-streaked window; commuters read, talk and hold bags around him.','Through the window, water covers a lower downtown street while barriers and drainage lanes redirect it below the train.','Close on the calm route display beside Matt as the four-minute adjustment appears; nobody nearby looks up.'],
          'LTS_C01_P03':['Wide municipal control room with staffed desks, drainage maps and blue-gray monitor light reflected in rain-dark windows.','Matt sits at his console while a drone-feed inset tracks a blocked drain; his hands rest beside the keyboard.','Monitor close-up: the drone clears debris and the status changes to HUMAN CONFIRMATION REQUESTED.','Matt clicks confirmation, then sits back in the quiet room with empty space around his workstation.'],
          'LTS_C01_P04':['Matt exits beneath a covered civic walkway into a dense evening crowd of commuters, parents, children and food-stall customers.','Medium panel: a public screen beside him displays the continuity-payment notice while two friends greet each other in the background.','Wide street-level view follows Matt past warm storefronts, umbrellas and wet planted paving toward home.'],
          'LTS_C01_P05':['Three-panel horizontal montage: Chris at a cluttered desk reviews a client patch on one monitor while his cracked recorder and loose cables crowd the foreground.','Ryan braces a marine assembly on a workbench, ignores the replacement prompt on a nearby display and turns the worn part in oily hands.','Kevin at a risk workstation leans toward an anomalous tide graph, saves the chart and looks from the screen toward rain outside.'],
          'LTS_C01_P06':['Justin hangs from the final hold of a difficult indoor climbing wall while a digital board posts his 96th-percentile result.','Justin drops to the mat, checks the score with a flat expression and reaches for his water bottle.','Across town, Nicole packs waterproof layers and gloves on a bed beside ordinary clothes and a half-finished mug.','Close on Nicole folding a worn harbor map at the printed SECTOR 14 label and sliding it into a compact bag.'],
          'LTS_C01_P07':['Wide warm bar booth crowded with Matt, Chris, Justin, Nicole and Kevin; plates, pints and overlapping gestures fill the table while other patrons pack the room behind them.','Medium group panel during the rescue-cert joke: Justin gestures broadly, Chris leans into the punch line and Kevin answers without looking up from his drink.','Chris shifts back in the booth as the conversation turns to people leaving; Matt faces him across the table.','Hold the full group in frame after Chris says “Not like that,” with bar traffic continuing normally around their brief pause.'],
          'LTS_C01_P08':['Three-shot of Chris, Justin and Matt at the same booth; Chris counts the old moves on his fingers while Justin watches with an amused squint.','Matt leans forward on “Some of us like it here,” one hand around his glass; Chris meets his eyes.','Chris answers “I like it here,” shoulders slightly raised, while Justin turns between them.','End on Justin’s grin after “Strong argument,” with Chris rubbing his forehead before the final line.'],
          'LTS_C01_P09':['Close on several phones lighting the table with runner-channel posts about the outer shelf and Reach window.','Wide booth panel: all six are now present, leaning toward the screens from different angles while the bar continues behind them.','Nicole pulls the folded harbor map partly from her bag and points to SECTOR 14 as Kevin studies the tide-window message.','Chris looks around the circle after “So we’re going”; Justin is already upright and reaching for his coat.'],
          'LTS_C01_P10':['Six narrow preparation panels: Matt tightens straps on a contractor bag beside his work jacket.','Ryan checks a tide table beside old marine boots and waterproof layers.','Chris plugs too many devices into one charger while his recorder remains nearly dead.','Justin coils rope beside climbing hardware and a rescue vest.','Nicole packs dry socks, gloves and the folded harbor map into compact waterproof gear.','Kevin downloads forecast charts to his tide device and clips a small weather sensor to his bag.'],
          'LTS_C01_P11':['Full-page ferry-lot establishing view at night: open car trunks, cheap rain gear, headlamps, contractor work lights, wet asphalt, the massive floodwall and a glowing tide board surround small clusters of runners.'],
          'LTS_C01_P12':['Matt stands at an open trunk holding Chris’s dead scanner while Chris searches a cable nest inside his bag.','Close two-shot for the charging joke; Matt holds the blank scanner screen toward Chris.','Over Matt’s shoulder, Ryan is visible alone at the flood steps beyond the parked cars, hood up and body turned toward the dark flats.','Matt and Chris both look toward Ryan as the scanner hangs forgotten between them.'],
          'LTS_C01_P13':['Ryan stands in profile at the floodwall edge watching shallow water drain from black mud below.','Justin arrives carrying rope over one shoulder and delivers the casino rumor to Matt and Nicole.','Nicole gives him a dry flat look; Chris appears beside her with an immediate grin.','Group panel catches “Visionary” while Ryan remains in the background facing the water.'],
          'LTS_C01_P14':['Ryan checks his watch and faces the group beside the flood steps.','Low panel on boots and waders as Ryan visually inspects everyone’s footwear.','Chris lifts one ordinary boot when asked about waders; Ryan stares down at it.','Matt turns toward Chris at the word “trench,” already tightening his pack.','Chris’s face fills the final panel on “What trench?” while Justin laughs behind him.'],
          'LTS_C01_P15':['Ryan crouches over a damp route map on a car hood, finger tracing the shifted north crossing.','Kevin holds his tide device beside the map; its public model shows the older shelf line.','Ryan points beyond the floodwall toward a darker cut in the exposed seabed.','A low warning siren sounds; runners across the lot close trunks, switch on headlamps and start toward the steps.'],
          'LTS_C01_P16':['Close on hands cinching shoulder straps and clipping small lights.','Low panel on six pairs of boots descending wet concrete flood steps.','Phone screens in gloved hands drop to NO SIGNAL as black mud fills the lower half of the frame.','Wide final panel: the six step off concrete onto exposed seabed, Ryan first and Harbor Phase lights high behind them.'],
          'LTS_C01_P17':['Low close-up of a boot sinking into black mud with a wet SCHLK.','Another boot crushes shells and snagged fishing line at the edge of a shallow pool.','Wide panel: the group stretches into single file through cold fog, shoulders hunched under packs.','Chris yanks one foot free and complains while Ryan keeps moving without turning.','Ryan glances back just enough to deliver the correction as Chris splashes after him.'],
          'LTS_C01_P18':['Wide walking panel across open flats; Ryan leads, Matt near the front, the others staggered behind under separate headlamps.','Close on Matt’s tide monitor reading 03:41 REMAINING while his thumb wakes it again.','Chris looks sideways at the glowing monitor and needles him; Matt answers without slowing.','Justin drifts toward another runner pair off-route, talking with his hands until Nicole steers back toward the group line.','Kevin and Ryan share the final dry exchange while Justin is visible farther ahead in fog.'],
          'LTS_C01_P19':['Low panel where black mud thins and a cracked white road stripe emerges beneath shallow water.','Wide view: old pavement continues ahead in two long lanes, disappearing under fog toward unseen offshore structures.','Nicole crouches briefly and points along the painted line while Chris stands over her making the detective joke.','Matt looks down the road after her final line; the six figures occupy only a small strip of the broad abandoned pavement.'],
          'LTS_C01_P20':['Narrow vertical panel: a hard dark line rises behind fog beyond the road.','Second panel reveals a second edge and crossbeam, still too obscured to read as a building.','Wide panel: a massive geometric silhouette briefly resolves above the group, dwarfing their headlamps.','Fog closes across the structure again as Chris stops walking and delivers the two short lines.'],
          'LTS_C01_P21':['Wide ground-level view of concrete foundation stubs, broken transit supports and service pavement emerging from mud.','Close on a battered official sign reading SECTOR 14 / TRANSIT LOOP C / SERVICE ACCESS, streaked with salt and tide marks.','Kevin stands beneath the sign looking past it toward more foundations disappearing into fog.','Nicole steps onto the old road beside him; the group and repeating infrastructure recede behind her final line.'],
          'LTS_C01_P22':['Justin jogs back from a short scouting detour, breathing hard and grinning too wide under his headlamp.','He points into the fog behind him while the others stop and turn.','Wide panel opens the flats around them with more parallel pavement and distant vertical masses now visible.','Chris and Ryan occupy the foreground in profile for the final exchange while Justin keeps staring offshore.'],
          'LTS_C01_P23':['Tall panel reveals the lower half of one tower emerging through thinning fog.','Second panel adds a farther tower and an elevated connector crossing between structures.','Wide panel pulls back to expose several blocks of unfinished offshore mass beyond the road network.','The six stop together, tiny at bottom of frame, heads tilted upward under weak practical lights.'],
          'LTS_C01_P24':['Full-page panoramic splash: the Reach fills the horizon with unfinished towers, elevated transit, broad decks and drowned lower levels reflected in black tidal water; the six figures stand tiny on exposed road with Harbor Phase a distant glow behind them.'],

          'LTS_C02_P01':['Wide continuation from the reveal: the six stand at the Reach edge beneath huge parking and transit structures.','Ryan crouches to inspect a narrow channel cutting across their route while the others look upward.','Justin turns his head toward the structures on the right as Ryan points left along higher ground.','They move left in single file with black water visible through gaps on the right.'],
          'LTS_C02_P02':['Wide panel resolves the outer Reach into ordinary parking decks, ramps, plazas and painted traffic lanes stained by salt.','Nicole stands beneath a familiar parking-level sign, looking up at repetitive concrete bays.','Kevin checks his device while walking; the group is visibly spread farther apart than on the plan.','Matt gestures them forward through the plaza instead of stopping.'],
          'LTS_C02_P03':['Close on a wet wall layered with spray arrows, reflective tape, timing claims and the text SAFE RAMP / TIDE HOLD 2H / NO SOUTH ENTRY / FUCK SOUTH ENTRY.','Justin points at the profanity while Chris photographs the wall and Ryan walks past it.','Nicole traces several conflicting arrows with one gloved finger; Kevin holds his device beside the painted two-hour claim.','Matt waves everyone away from the wall and toward the physical ramp visible beyond.'],
          'LTS_C02_P04':['Wide Near Reach view: flooded decks, dead plaza furniture, a sagging upper walkway and small distant work lights behind fog.','The group pauses beneath concrete columns as faint laughter carries from above.','Ryan studies two possible routes, then points toward a higher ramp with intact railings.','They move toward the ramp while black water covers the lower route.'],
          'LTS_C02_P05':['Low angle on wet shoes climbing a slick concrete ramp beside a corroded handrail.','Kevin’s foot slides; his body pitches sideways toward the rail.','Matt catches the shoulder strap of Kevin’s pack without stopping the line.','Kevin regains his footing as Chris turns backward to deliver the joke, still climbing.'],
          'LTS_C02_P06':['Chris wipes condensation from a large damaged directory panel reading FASHION HARBOR CENTER / LEVELS 1–6.','The group gathers around the directory while Justin looks past it over an interior railing.','Large vertical reveal down the mall atrium: black water fills lower levels; dry upper balconies and dead storefronts circle the void.','Nicole and Chris lean over the rail while Ryan stays a step back checking structure and exit routes.'],
          'LTS_C02_P07':['The group enters a dim fourth-level corridor with lifted tiles, salt-stained storefronts and shallow puddles reflecting headlamps.','Kevin recoils from the smell while Ryan points at a buckled patch of flooring.','Boot-level panel keeps everyone stepping around the lifted tiles.','A crooked FUTURE OPENING EVENT banner hangs above the corridor as Chris passes beneath it.'],
          'LTS_C02_P08':['Full-width atrium panel: escalators descend into black water and reflections from upper-level work lights ripple below.','Nicole stops at the railing beside a faded MOVE WITHOUT LIMITS advertisement.','Matt turns toward her while she keeps her eyes on the ad and flooded lower floor.','Close on Nicole’s gloved hand resting on the rail before she says “Nothing.”'],
          'LTS_C02_P09':['Wide upper-level view of scattered runner occupation: one person heats noodles, two change wet socks, others argue over a paper route map, another sleeps against a shutter.','A small battered speaker plays beside battery packs and clipped LEDs; headlamps cross the ceiling.','The six thread between these groups, stepping over bags and damp clothing.','Chris looks around with open amusement while Ryan checks the dark lower atrium beyond the rail.'],
          'LTS_C02_P10':['Group cluster near the atrium railing: Ryan raises a gloved hand and states the hold time.','Matt checks his monitor while Kevin holds up his device with a different number.','Ryan repeats “Twenty” and points to a visible meeting spot beside the directory.','Justin is already several paces down the corridor when Ryan calls his name; he turns mid-step.'],
          'LTS_C02_P11':['Chris pulls a faded Harbor Phase Mariners jacket from a dead sportswear rack and holds it against himself.','Kevin stares at the jacket while Nicole presses her lips together before the roast.','Chris puts the oversized jacket on over wet layers and spreads his arms.','Group reaction panel catches Nicole’s boat-owner line and Chris’s pleased reply.'],
          'LTS_C02_P12':['Justin returns carrying a loose COMING SOON / HARBOR PHASE AQUARIUM DISTRICT display panel nearly as wide as his torso.','Chris and Nicole turn toward him in immediate disbelief.','Ryan points back toward the display frame without moving from his spot.','Justin carries the panel back across the corridor while Matt watches him go.'],
          'LTS_C02_P13':['Four friends lean at the atrium railing with flooded storefronts and intact upper-level wayfinding behind them.','Chris gestures across the still-legible mall circulation below while Matt answers.','Nicole looks down at a cheap repeating floor pattern along the balcony edge.','Close on the scuffed pattern beside Nicole’s boot as she mentions her first apartment.'],
          'LTS_C02_P14':['Detail panel: abandoned food-court tables sit above a lower level submerged to the chair backs.','Detail panel: a kiosk shutter is half open beside tide-stained menu boards.','Detail panel: transit-access arrows point toward a corridor blocked by black water.','Detail panel: a half-submerged children’s play structure reflects in the atrium.','Chris raises his phone showing NO SIGNAL; Ryan glances at him over one shoulder.'],
          'LTS_C02_P15':['Nicole and Kevin crouch beside a large offline directory map mounted low on the wall.','Kevin points at a corridor line that runs beyond the mall boundary into a transit symbol.','Nicole traces the connection from retail levels toward residential blocks while Chris stands behind them.','Justin’s voice arrives from off-panel; the group turns toward the corridor he entered.'],
          'LTS_C02_P16':['Justin stands before a dusty leasing display with clean renderings labeled HARBOR PHASE EAST / RESIDENCES OPENING SOON.','Close on the polished apartment rendering beside actual black floodwater visible through broken glass behind it.','Ryan walks past the display while answering Justin.','Matt checks his monitor and gestures everyone toward the exit corridor.'],
          'LTS_C02_P17':['Two unrelated runners point in opposite directions beside a junction sign, each giving conflicting south-bridge advice.','Kevin closes his eyes briefly while Matt looks to Ryan.','Ryan studies water stains, the east corridor floor and the sagging south access before pointing east.','Matt repeats “East side” and turns the group into the chosen corridor.'],
          'LTS_C02_P18':['Wide atrium occupation continues under practical lights and low conversation.','A violent metallic GRRRRNNNNNNNK ripples through the structure; heads across the entire balcony turn at once.','Small debris drops into black water below with a distant TINK.','Ryan is already standing with pack on and one hand raised on “Time.”'],
          'LTS_C02_P19':['The group kneels around open bags, stuffing dry socks, maps and devices back inside.','Chris keeps the faded Mariners jacket on while Kevin points at it.','An unfamiliar runner approaches Matt asking about the east route; Matt glances toward Ryan before answering.','Matt points the runner toward the upper service ramp as the others shoulder packs.'],
          'LTS_C02_P20':['The six move through the exit corridor toward exterior fog.','Kevin’s headlamp catches a ribbon of water crossing tile that was dry on entry.','Ryan crouches for one quick look, then stands and increases pace.','Justin walks backward for a step to ask whether they are coming back; nobody meets his eyes immediately.'],
          'LTS_C02_P21':['Exterior wide: Fashion Harbor Center sits dark and massive while scattered temporary LEDs and headlamps glow along its upper levels.','The six cross a wet plaza in the foreground; Chris looks back at the lit windows.','Ryan keeps his gaze on the route ahead as he answers.','Fog begins to swallow the mall behind them.'],
          'LTS_C02_P22':['A broken elevated transit spine emerges through fog ahead, with missing glass panels and black water far below.','Runner graffiti reading THE GLASS RAIL sits on a support column at the approach.','Justin steps toward the ramp while Kevin checks the shrinking window on his device.','Nicole points along the rail line disappearing deeper between offshore structures.'],
          'LTS_C02_P23':['Matt and Ryan stand beneath the Glass Rail approach while the others wait behind them.','Matt points toward the first visible station platform through fog.','Ryan holds up one finger and fixes his gaze on Justin.','Justin lowers his shoulders and repeats “First station” before joining the line.'],
          'LTS_C02_P24':['Long vertical panel down the broken elevated walkway with the six moving single file along wet decking.','Black tidal water curls around support columns far below through missing glass sections.','Matt looks back through a gap at several other runners still lingering near the mall.','Ryan keeps forward spacing tight and continues toward the station.'],
          'LTS_C02_P25':['Wide side view of the single-file group crossing high above water; Ryan leads and Matt follows several paces back.','Chris’s faded Mariners jacket snaps in wind while he grips the rail with one hand.','Justin walks unusually close to the centerline, eyes on his footing.','Matt looks past the others toward Ryan’s back at the front of the line.'],
          'LTS_C02_P26':['Full-page wide: the group crosses the Glass Rail toward fog and the first station; Fashion Harbor Center glows weakly behind them while returning tide threads through streets and plazas below.'],

          'LTS_C03_P01':['Wide apartment interior before dawn: Matt’s packed Reach bag, worn boots and work jacket are lined up beside the door while the rest of the room remains ordinarily lived in.','Close on Matt’s phone lighting the dark room with the group-chat message YOU GOING TONIGHT?','Matt stands in the doorway between the prepared bag and his kitchen, phone in hand.'],
          'LTS_C03_P02':['Six-panel preparation montage: Ryan watches water from a working pier with tide notes in hand.','Kevin saves forecast charts to his device beside the small weather sensor.','Chris compares two pairs of clearly wrong socks beside his overloaded charger.','Justin clips vertical climbing hardware to a rope bag.','Nicole packs extra socks and one folded map beneath waterproof layers.','Matt repairs a frayed pack strap with tape and a small tool.'],
          'LTS_C03_P03':['Wide repeat crossing on the flats with the group moving faster and closer than before through familiar fog.','Chris points to a shallow muddy cut where he previously slipped while Kevin steps across it cleanly.','Ryan gestures everyone away from the right shelf without breaking stride.','The group crosses the corrected line while their headlamps form a familiar staggered pattern.'],
          'LTS_C03_P04':['Close on several phones dropping to NO SIGNAL earlier in the crossing.','One by one, hands lower the phones without stopping; screens disappear into jacket pockets.','Wide panel: the group passes a recognizable broken piling and painted road stripe without pausing.','They continue toward the Reach with heads up and devices dark.'],
          'LTS_C03_P05':['Five-part inland montage: Justin drops from a difficult climbing wall and immediately checks the next tide window on his phone.','Chris lets a paid-work notification sit unanswered beside open Reach footage.','Kevin layers two forecast charts and marks their divergence.','Nicole leaves a brunch message unanswered while repacking wet gear on a kitchen table.','Ryan stands at the working waterfront watching surface movement beyond moored equipment.'],
          'LTS_C03_P06':['Close on overlapping route graffiti: THE LIP / EAST CUT / BATTERY STAIRS / SOFT FLOOR — DO NOT TRUST.','Chris reads the names aloud while Ryan checks the actual ground beneath the arrows.','Kevin points from the soft-floor warning to a buckled slab; Justin scans the wall for the climb name.','Matt points them away from SOUTH TEETH and down a safer marked corridor.'],
          'LTS_C03_P07':['At a concrete route junction, an unfamiliar runner approaches Matt and points toward a HARBOR MARKET arrow.','Matt answers immediately, gesturing toward the upper deck and west corner.','Behind Matt, Ryan gives a small confirming nod while watching the route.','Chris walks backward for one step to deliver “Local government” as Matt waves him off.'],
          'LTS_C03_P08':['Wide exterior: Harbor Market rises above flooded lower service levels with temporary lights along upper decks.','The six stop at the approach while Kevin looks up at the number of silhouettes on the roof.','Justin counts bodies with an exaggerated gesture; Kevin answers with his device still in hand.','Ryan points to the turn route and checks everyone before they start up.'],
          'LTS_C03_P09':['Steep service-stair panel with runners climbing between damp concrete walls and faded market wayfinding.','Landing detail: someone tapes a boot while another changes soaked socks beside open food packets.','Nicole squeezes past a runner holding a loose strap while Chris comments from one step below.','The core group continues upward through improvised repair clutter and clipped work lights.'],
          'LTS_C03_P10':['Full-page roof establishing view: roughly thirty runners occupy Harbor Market under headlamps, battery bars and clipped LEDs; folding chairs, thermoses, wet bags and improvised repairs surround them, with black water below and drowned skyline beyond.'],
          'LTS_C03_P11':['The six step onto the crowded roof and are immediately absorbed into overlapping small groups.','Chris spreads his arms at the improvised social scene while Justin spots climbers on a ventilation housing.','Justin takes one step toward them; Ryan hooks two fingers into his pack strap from behind.','Justin turns back toward Ryan while Matt and Nicole laugh nearby.'],
          'LTS_C03_P12':['Nicole stands beside a faded wall-mounted network diagram under a clipped LED bar.','Close on the diagram linking market, rail, mall, aquarium district, residences and a pedestrian loop.','Kevin leans over her shoulder and points at one connection.','Nicole keeps one gloved finger on the weathered line while answering him.'],
          'LTS_C03_P13':['A newcomer holds a phone high over the roof crowd, livestream interface frozen on NO SIGNAL.','Another runner leans in with a knowing grin while the newcomer lowers the phone.','Chris watches several conversations continuing with everyone’s devices pocketed.','Matt turns toward Chris after the line about nobody half-leaving.'],
          'LTS_C03_P14':['Four-person table cluster around a battery kettle and damp bags; Chris speaks while the others actually hold eye contact.','Close on silent phones face-down or tucked away near cups and gloves.','Matt answers from across the crate-table while Nicole and Kevin listen.','Chris shrugs into the “Cold helps” line as nearby roof conversation continues.'],
          'LTS_C03_P15':['A younger runner approaches Matt near the roof edge and asks for the mall route.','Matt points east across visible upper structures and lists the service-ramp and bridge constraints.','Ryan stands one pace behind, silent, looking toward the same route.','The younger runner leaves; Chris leans toward Matt with a grin for “becoming useful.”'],
          'LTS_C03_P16':['Kevin notices several runners clustered near a visibly cracked west roof corner and raises one hand.','His quiet warning barely reaches the nearest pair over roof noise.','Matt steps forward, points sharply away from the corner and calls louder.','The runners move immediately; Kevin watches them clear the damaged slab.'],
          'LTS_C03_P17':['Chris retells the Fashion Harbor trip to a small circle, gesturing broadly in the faded Mariners jacket.','Justin adds scale with both arms while Nicole stands inside the circle, unimpressed.','Nicole taps the plastic cup in her hand on “It was plastic.”','In the background, an unrelated runner repeats “Saddest food court on Earth” to someone else; Chris hears it.'],
          'LTS_C03_P18':['Justin climbs onto a low ventilation housing as several nearby runners turn to watch.','Ryan stands directly below and points down while Matt approaches from the side.','Justin pauses on top with arms out before Matt repeats the command.','He drops back to the roof; several onlookers still grin and clap as he lands.'],
          'LTS_C03_P19':['Wide roof tableau divided across the frame: Matt points out a route to two runners; Chris laughs beside a small group; Nicole speaks with another runner over a map.','Kevin crouches at a seam checking cracked concrete with his light.','Justin occupies the center of a loose laughing cluster near the ventilation housing.','At the far roof edge, Ryan stands alone facing dark water and the returning tide.'],
          'LTS_C03_P20':['A story runner holds both arms wide while describing an impossible municipal sign from an outer sector.','Several listeners react with disbelief and amusement; Chris is already smiling at the phrasing.','Nicole stands shoulder-to-shoulder with Chris and points at him during her warning.','Chris lowers his recorder slightly before admitting “Probably.”'],
          'LTS_C03_P21':['Close on black water below the market as its surface direction changes around a support column.','Ryan at the roof edge hears the new wash and checks the route without consulting a phone.','He turns and calls “Time” across the social crowd; nearby faces fall.','Matt raises his monitor showing more time while Ryan points toward the exit stairs.'],
          'LTS_C03_P22':['Justin faces Ryan and Matt near packed bags, hands out on “Easy isn’t really the point.”','Kevin shoulders his pack immediately and raises one finger for his vote.','Matt closes his bag, stands and calls “Pack up. We’re moving.”','Several unrelated runners within earshot also begin closing bags and moving toward the stairs.'],
          'LTS_C03_P23':['The core group descends the market exit stairs while the roof above remains dotted with people and practical lights.','Chris looks back upward through the rail at conversations continuing behind them.','Ryan keeps descending while answering him; Kevin watches dark water through the stairwell openings.','Exterior panel: their small line leaves the lit market as water spreads across lower decks.'],
          'LTS_C03_P24':['Matt and Ryan walk side by side along a wet elevated market walkway, the others several steps ahead.','Matt turns toward Ryan and gestures back at the roof while speaking.','Ryan keeps his gaze on the route until “You almost didn’t,” then looks directly at Matt.','Matt stops for half a step while Ryan continues forward.'],
          'LTS_C03_P25':['Two-shot in profile as Matt catches up to Ryan on the walkway; black water and temporary roof lights sit behind them.','Ryan points down through the rail at channels beginning to fill between concrete structures.','Matt looks from the visible dry deck beneath his boots to the returning water below.','Ryan faces him for “It’s tide being temporarily absent,” then resumes walking.'],
          'LTS_C03_P26':['Wide group panel: all six stand briefly silent on the walkway after Ryan’s warning.','Justin lowers his eyes from the skyline; Chris’s hands stay in his pockets; Nicole watches the water.','Ryan turns his body toward the return route.','On “Move,” the line starts again with Ryan first.'],
          'LTS_C03_P27':['Long descending view from the elevated walkway toward the flats; the six headlamps form a staggered line into fog.','Close on a phone screen still reading NO SIGNAL before it disappears into a pocket.','Wide reverse angle: Harbor Phase glows faintly across the dark exposed seabed, much farther away than the group.','The six continue downhill toward the darker path home.'],
          'LTS_C03_P28':['Full-page wide: the group leaves Harbor Market behind and walks into fog across the return route; practical lights recede behind them while distant Harbor Phase sits ahead beyond black mud and water.']
          }

          pages123=load(base/'pages_ch01_ch03_compiled.json')
          assert set(P)=={p['id'] for p in pages123}, (len(P),len(pages123))
          for p in pages123:
            p['panelPlan']=P[p['id']]

          encoded_files=[
            enc/'pages_c04_between_runs_enhanced.json.gzb64',
            enc/'pages_c05_return_tide_enhanced.json.gzb64',
            enc/'pages_c06_after_the_water_enhanced.json.gzb64',
            enc/'pages_c07_last_low_tide_enhanced.json.gzb64']
          encoded_objs=[]; pages47=[]
          for path in encoded_files:
            obj,ps=decode_file(path); encoded_objs.append((path,obj)); pages47.extend(ps)

          # Existing C4-C7 plans are useful, but these lines still describe writing intent instead of an image.
          replacements={
          'A pause when nobody can remember the last non-Reach story.':'Conversation stalls; the friends look at one another over half-finished drinks until someone breaks the silence.',
          'Battery kettle and thermos, not a polished vendor stand.':'Close on a folding table crowded with a battery kettle, dented thermos, paper cups, milk crate and taped extension lead.',
          'Show the arch as difficult but climbable, not suicidal.':'Wide view of the broken concrete arch: wet handholds, sloped footing and a short exposed drop above the lower deck.',
          'Kevin shows the small weather sensor.':'Close-up: Kevin holds the small weather sensor between gloved fingers, display facing Matt and Nicole.',
          'Kevin gives a stronger answer but still not a command.':'Kevin lowers the sensor, meets Matt’s eyes and speaks with his shoulders still slightly drawn in.',
          'His face shows he knows exactly what trade he is making.':'Close on Matt at his work screen: jaw tight, eyes forward, tide alert glowing at the edge of frame.',
          'Ryan stays quiet rather than escalate.':'Ryan keeps his gaze on the water and continues walking while Matt looks back at him.',
