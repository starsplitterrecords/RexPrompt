name: Clean Sunforge dialogue

on:
  push:
    branches:
      - dialogue-sunforge-current-four-20260913

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dialogue-sunforge-current-four-20260913
          fetch-depth: 0
      - name: Correct contraction artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('data/shows/sunforge-outlaw-s1')

          replacements = [
            ("You've the wrong man", "You've got the wrong man"),
            ("you'ren't", "you aren't"),
            ("there'sn't", "there isn't"),
            ("I'ven't", "I haven't"),
            ("You'ven't", "You haven't"),
            ("He'sn't", "He isn't"),
            ("he'sn't", "he isn't"),
            ("She'sn't", "She isn't"),
            ("she'sn't", "she isn't"),
            ("It'sn't", "It isn't"),
            ("it'sn't", "it isn't"),
            ("That'sn't", "That isn't"),
            ("that'sn't", "that isn't"),
            ("We'ren't", "We aren't"),
            ("we'ren't", "we aren't"),
            ("They'ren't", "They aren't"),
            ("they'ren't", "they aren't"),
            ("It's the only one I've.", "It's the only one I have."),
            ("how short they're.", "how short they are."),
            ("who he's.", "who he is."),
            ("who I'm?", "who I am?"),
            ("because you've a question", "because you have a question"),
            ("Please do not start counting.", "Please don't start counting."),
            ("It was not a compliment.", "It wasn't a compliment."),
            ("For once, do not explain it any further.", "For once, don't explain it any further."),
            ("Do not do that.", "Don't do that."),
            ("I brought two people who would not stay behind.", "I brought two people who wouldn't stay behind."),
            ("Constantly. I just do not make it a hobby.", "Constantly. I just don't make it a hobby."),
            ("You don't want to know what is in the letter?", "You don't want to know what's in the letter?"),
            ("I don't need to. Isabelle is not a test.", "I don't need to. Isabelle isn't a test."),
            ("Then what is wrong with it?", "Then what's wrong with it?"),
            ("Then another minute will not ruin me.", "Then another minute won't ruin me."),
            ("That was not how it started.", "That wasn't how it started."),
            ("You just will not like", "You just won't like")
          ]

          for issue in range(1,5):
              p = base/f'pages_e0{issue}.json'
              pages = json.loads(p.read_text())
              for page in pages:
                  for line in page.get('dialogueInline',[]):
                      t = line['text']
                      for a,b in replacements:
                          t = t.replace(a,b)
                      line['text'] = t
              p.write_text(json.dumps(pages, indent=2, ensure_ascii=False) + '\n')

          bad_fragments = ["'sn't", "'ren't", "'ven't", "That'sn't", "It'sn't", "who he's.", "who I'm?", "short they're.", "one I've.", "You've the wrong man"]
          all_text = []
          for issue in range(1,5):
              pages = json.loads((base/f'pages_e0{issue}.json').read_text())
              for page in pages:
                  for line in page.get('dialogueInline',[]):
                      all_text.append(line['text'])
                      for bad in bad_fragments:
                          assert bad not in line['text'], (page['id'], line['text'], bad)

          assert "I've got enough problems I already understand. I don't much care about ones I don't." in all_text
          assert "Bah. Leave it alone. I didn't mean anything by that." in all_text
          assert "There isn't a 'we'." in all_text
          assert "Because Veyra asked me to find out who he is." in all_text
          assert "Did any of this tell you who I am?" in all_text

          Path('.github/workflows/sunforge-dialogue-cleanup.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/shows/sunforge-outlaw-s1/pages_e01.json data/shows/sunforge-outlaw-s1/pages_e02.json data/shows/sunforge-outlaw-s1/pages_e03.json data/shows/sunforge-outlaw-s1/pages_e04.json
          git add -A .github/workflows || true
          git diff --cached --quiet || git commit -m 'Clean Sunforge dialogue contraction artifacts'
          git push origin HEAD:dialogue-sunforge-current-four-20260913
