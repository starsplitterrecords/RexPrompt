name: Prepare page-generation data v2

on:
  push:
    branches:
      - fix/page-generation-readiness-v2
    paths:
      - '.github/workflows/prepare-page-generation-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current-main repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize tested preparation compiler
        run: |
          git fetch origin fix/page-generation-readiness sanitize-rex-fleet-clean
          git show origin/fix/page-generation-readiness:tools/prepare_page_generation.py > tools/prepare_page_generation.py

      - name: Import clean Rex Fleet production package
        run: |
          git checkout origin/sanitize-rex-fleet-clean -- \
            data/shows/rex-fleet-s1/characters.json \
            data/shows/rex-fleet-s1/dialogue.json \
            data/shows/rex-fleet-s1/direction.json \
            data/shows/rex-fleet-s1/encoded/scenes_e03.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e04.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e05.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e06.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e07.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e08.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e09.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e10.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e11.json.gzb64 \
            data/shows/rex-fleet-s1/encoded/scenes_e12.json.gzb64 \
            data/shows/rex-fleet-s1/scenes_e01.json \
            data/shows/rex-fleet-s1/scenes_prequel.json \
            data/shows/rex-fleet-s1/settings.json

      - name: Isolate unrecoverable Vikings source span
        run: |
          mv data/shows/vikings-2026-s1/encoded/pages_e03_p19_p24.json.gzb64 /tmp/pages_e03_p19_p24.json.gzb64

      - name: Compile and normalize chef-facing production data
        run: python tools/prepare_page_generation.py

      - name: Remove unrecoverable Vikings span from active assembly
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/shows.json')
          shows=json.loads(p.read_text())
          show=next(x for x in shows if x.get('id')=='vikings-2026-s1-e03')
          show['name']='Vikings 2026 — Season 1 / Issue 3 — The Iron Worm — Pages 1–18'
          show['sceneOverlays']=[x for x in show.get('sceneOverlays',[]) if x.get('file')!='encoded/pages_e03_p19_p24.json.gzb64']
          p.write_text(json.dumps(shows,ensure_ascii=False,indent=2)+'\n')
          PY
          mv /tmp/pages_e03_p19_p24.json.gzb64 data/shows/vikings-2026-s1/encoded/pages_e03_p19_p24.json.gzb64

      - name: Verify current structural checks
        run: python tools/validate_azure_reach_sanitization.py

      - name: Commit prepared production data
        run: |
          rm tools/prepare_page_generation.py
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html \
            data/shows.json \
            data/shows/division-threshold-s1/pages_e01_compiled.json \
            data/shows/low-tide-signal/pages_ch01_ch03_compiled.json \
            data/shows/vikings-2026-s1/encoded \
            data/shows/rex-fleet-s1/characters.json \
            data/shows/rex-fleet-s1/dialogue.json \
            data/shows/rex-fleet-s1/direction.json \
            data/shows/rex-fleet-s1/encoded \
            data/shows/rex-fleet-s1/scenes_e01.json \
            data/shows/rex-fleet-s1/scenes_prequel.json \
            data/shows/rex-fleet-s1/settings.json
          git commit -m 'Prepare chef-facing page production data on current main'
          git push origin HEAD:fix/page-generation-readiness-v2
