name: Temporary Azure Reach P22 Debug

on:
  push:
    paths:
      - '.github/workflows/tmp-azure-debug-p22.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/azure-reach-chef-boundary-20260910
      - name: Print Issue 6 P22 non-dialogue recipe sources
        shell: python
        run: |
          import base64,gzip,json,pathlib
          root=pathlib.Path('data/shows/azure-reach-s1')
          settings=json.loads((root/'settings.json').read_text())
          directions=json.loads((root/'direction.json').read_text())
          for p in (root/'encoded').glob('*.json.gzb64'):
              data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode())
              pages=data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  if page.get('id')!='AZR_S1E06_P22': continue
                  print(json.dumps({k:v for k,v in page.items() if k not in ('dialogueInline','sceneDialogue','dialog')},indent=2,ensure_ascii=False))
                  print('SETTING:',settings.get(page.get('setting')))
                  for k in page.get('direction') or []: print('DIRECTION',k,directions.get(k))
