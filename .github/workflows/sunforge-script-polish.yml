          settings = json.loads((base/'settings.json').read_text())
          regions = json.loads((base/'regions.json').read_text())
          directions = json.loads((base/'direction.json').read_text())
          all_pages=[]
          for path in page_files:
              ps=json.loads(path.read_text())
              expected=7 if path.name=='pages_e01.json' else 6
              if len(ps)!=expected:
                  raise SystemExit(f'{path.name}: expected {expected}, got {len(ps)}')
              all_pages.extend(ps)
          ids=[p['id'] for p in all_pages]
          if len(ids)!=73 or len(set(ids))!=73:
              raise SystemExit(f'page id/count failure {len(ids)} / {len(set(ids))}')
          for p in all_pages:
              if p.get('setting') not in settings: raise SystemExit(f"{p['id']} bad setting {p.get('setting')}")
              if p.get('region') not in regions: raise SystemExit(f"{p['id']} bad region {p.get('region')}")
              for c in p.get('characters',[]):
                  if c not in chars: raise SystemExit(f"{p['id']} bad character {c}")
              for d in p.get('direction',[]):
                  if d not in directions: raise SystemExit(f"{p['id']} bad direction {d}")
          print(f'Validated {len(all_pages)} pages; polished {len(found)} pages.')
          PY
