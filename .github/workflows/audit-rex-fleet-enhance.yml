name: Apply Rex Fleet dramatic divergence

on:
  push:
    branches:
      - enhance/rex-fleet-dramatic-divergence

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/rex-fleet-dramatic-divergence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted season enhance
        run: python tools/apply_rex_fleet_dramatic_divergence.py
      - name: Validate Rex Fleet
        run: python tools/validate_rex_fleet.py
      - name: Reread season and assembled changed pages
        run: python tools/audit_rex_fleet_dramatic_engines.py
      - name: Commit enhanced production payloads
        run: |
          if git diff --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/rex-fleet-s1/encoded/pages_i04.json.gzb64 \
                  data/shows/rex-fleet-s1/encoded/pages_i06.json.gzb64 \
                  data/shows/rex-fleet-s1/encoded/pages_i10.json.gzb64 \
                  data/shows/rex-fleet-s1/encoded/pages_i12.json.gzb64
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Enhance Rex Fleet dramatic divergence"
          git push origin HEAD:enhance/rex-fleet-dramatic-divergence
