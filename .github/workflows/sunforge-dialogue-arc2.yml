name: Sunforge dialogue rewrite issues 5-8
on:
  push:
    branches: [sunforge-dialogue-pass-20260914]
    paths: ['.github/workflows/sunforge-dialogue-arc2.yml']
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunforge-dialogue-pass-20260914
      - name: Rewrite dialogue
        run: |
          python - <<'PY'
          import json, pathlib
          raw = r'''{
            "SUN_S1E05_P01": [["Veyra","Bellweather."],["Kael","What about it?"],["Samuel","I was there before the relay. I told a cousin Elias Bell might come home."],["Kael","And you described me."],["Samuel","Yes."],["Jessa","Anyone there likely to pull a gun?"],["Samuel","It's a wake."],["Jessa","That wasn't my question."],["Samuel","No guns that I know of. Family. Grief. Old arguments."],["Eva","Which can be worse."],["Kael","How far?"],["Jessa","You want to walk into it?"],["Kael","They've been waiting on my face. I'd rather end that part."]],
            "SUN_S1E05_P02": [["Mara Bell","Elias?"],["Kael","No, ma'am. Kael Mack."],["Owen Bell","He said you'd say that."],["Eva","He says that a lot."],["Jessa","Eva."],["Mara Bell","You look exactly like him."],["Kael","I'm sorry."],["Owen Bell","That's it?"],["Kael","I don't know what else would be kind."]],
            "SUN_S1E05_P03": [["Owen Bell","You heard her promise. Tell Mara what she said."],["Kael","I didn't hear anything."],["Owen Bell","You expect us to believe you forgot your own mother?"],["Kael","No. I expect you to believe I'm not your brother."],["Mara Bell","If you would just say she promised—"],["Kael","Would he believe you then?"],["Mara Bell","He'd have to."],["Owen Bell","Don't answer for me."],["Eva","He could settle it."],["Kael","He could. I can't."],["Owen Bell","Then why are you here?"],["Kael","Because someone told you I was coming."]],
            "SUN_S1E05_P04": [["Eva","You could lie once."],["Kael","Once for who?"],["Eva","For them. Five minutes."],["Kael","And when Owen asks what else his brother remembers?"],["Eva","Say you don't remember."],["Jessa","Now you're building a second lie to hold up the first."],["Eva","I'm trying to stop a family from tearing itself apart over two houses."],["Jessa","No. You're trying to get an ending before we leave."],["Eva","That's not fair."],["Kael","It's not completely unfair."],["Eva","I liked you better when you were refusing to participate."],["Kael","I'm still doing that."]],
            "SUN_S1E05_P05": [["Mara Bell","You said, 'the blue room stays open.'"],["Samuel","I didn't."],["Mara Bell","You looked right at me."],["Samuel","I believe you. I still didn't."],["Veyra","Who else was there?"],["Mara Bell","No one close enough."],["Eva","Could she have told you earlier and forgotten?"],["Samuel","Not that phrase."],["Jessa","Could someone have told her after you left?"],["Mara Bell","No one knew I was waiting for Elias except family."],["Veyra","Then start with family."],["Kael","Start after we get the tables in."],["Eva","You're doing that thing again."],["Kael","It's raining."]],
            "SUN_S1E05_P06": [["Eva","You could've fixed it in one sentence."],["Kael","No. I could've ended the argument."],["Eva","Isn't that fixing it?"],["Kael","Not if they build tomorrow on something I made up."],["Eva","You always think about tomorrow after we're gone."],["Kael","Somebody has to. We keep leaving."],["Jessa","Careful. That almost sounded like attachment."],["Kael","Drive."],["Jessa","There he is."]],
            "SUN_S1E06_P01": [["Eva","My guess: Samuel stopped at every watering hole between here and Cinder Basin."],["Jessa","My guess: people don't need Samuel to gossip."],["Eva","I have a third."],["Kael","I know."],["Eva","You don't even know what it is."],["Kael","You've had one since breakfast."],["Jessa","Park first. Theories after."],["Eva","Oh."],["Kael","That's not encouraging."]],
            "SUN_S1E06_P02": [["Tomas","Kael Mack."],["Kael","You look better standing."],["Tomas","Feels better too."],["Eva","You call him Kael."],["Tomas","That's his name."],["Jessa","Tell the wall."],["Tomas","The wall likes Varnok."],["Kael","The wall can have him."],["Tomas","Marcus left three days after you did."],["Kael","Good."],["Tomas","People say Varnok ran him off."],["Kael","People ran him off."],["Tomas","People like a face on a story."],["Kael","I noticed."]],
            "SUN_S1E06_P03": [["Samuel","I gave Harker the name. Dark coat. Black hair. The day I thought Kael would come through."],["Tomas","By supper, Varnok had a dead brother."],["Samuel","He didn't."],["Tomas","By breakfast, he had two."],["Eva","What about the horse?"],["Tomas","Della."],["Veyra","Who is Della?"],["Tomas","Woman who improves any story she hears."],["Jessa","You should hire her."],["Veyra","No."],["Samuel","Don't joke. I started it."],["Tomas","You lit a match. Town supplied the furniture."]],
            "SUN_S1E06_P04": [["Eva","They gave you shoulders."],["Kael","I've always wanted some."],["Eva","And broader shoulders."],["Jessa","Careful. He'll start posing."],["Tomas","It isn't meant to be you exactly."],["Kael","That part is successful."],["Tomas","It's the day Marcus lost the porch."],["Kael","Then paint the porch."],["Tomas","People don't remember porches."],["Kael","They remember what they need the story to do."],["Tomas","Sometimes."]],
            "SUN_S1E06_P05": [["Local","Just sign it."],["Kael","As who?"],["Local","Varnok."],["Kael","Then no."],["Local","Marcus comes back, we show him Varnok backs us."],["Kael","And if somebody else paints a Varnok who says he doesn't?"],["Eva","That's annoyingly possible."],["Jessa","Sign your own names."],["Local","He'll laugh."],["Kael","Maybe. But he'll know who he's dealing with."]],
            "SUN_S1E06_P06": [["Tomas","Kael."],["Kael","Yeah?"],["Tomas","Thank you."],["Kael","You're welcome."],["Eva","That's all?"],["Kael","Were you hoping for music?"],["Jessa","She was."],["Veyra","They know your name and kept Varnok."],["Kael","Tomas didn't."],["Tomas","Some of us don't need him anymore."],["Eva","Does it bother you?"],["Kael","The mural?"],["Eva","All of it."],["Kael","Yes."],["Jessa","Huh."],["Kael","Don't."],["Jessa","I didn't say anything."],["Eva","You made a face."]],
            "SUN_S1E07_P01": [["Eva","Nobody's looking at him."],["Jessa","They're looking. They just don't care."],["Kael","I could get used to this."],["Nessa","I said I'm leaving tomorrow."],["Ada Rowan","You said that before they chose you."],["Nessa","They chose me because they thought I'd stop saying it."],["Jessa","That sounds familiar."],["Eva","You know her?"],["Jessa","No. I know the sentence."]],
            "SUN_S1E07_P02": [["Ada Rowan","Mira trusted her with every name we have."],["Nessa","She trusted me to help. She did not appoint me from the grave."],["Eva","Could you do it for a year?"],["Nessa","Everyone loves a year when it isn't theirs."],["Jessa","What part actually needs one person?"],["Ada Rowan","Someone has to remember what was promised."],["Jessa","Then teach two people."],["Ada Rowan","It isn't that simple."],["Nessa","No. But it might be less simple than making me stay."]],
            "SUN_S1E07_P03": [["Eva","Three books."],["Jessa","And one pair of socks."],["Eva","You've inspected the whole bag."],["Jessa","Someone had to."],["Eva","Did somebody do that for you?"],["Jessa","No. That's how I learned about the socks."],["Eva","You left with three books?"],["Jessa","Worse. Tools."],["Eva","Why'd you go?"],["Jessa","Because I wanted to."],["Eva","That's not the whole answer."],["Jessa","It was enough to get me on the road."]],
            "SUN_S1E07_P04": [["Ada Rowan","We're trying to be fair."],["Nessa","You're taking a vote on whether I get to leave."],["Ada Rowan","On who carries the work."],["Kael","Does the person carrying it get a vote?"],["Ada Rowan","You are not family."],["Kael","No, ma'am."],["Ada Rowan","Then stay out of it."],["Kael","Gladly. I only asked because Nessa wasn't inside your circle."],["Jessa","She still isn't."],["Nessa","I love you. I'm leaving anyway."]],
            "SUN_S1E07_P05": [["Nessa","You make the road sound miserable."],["Jessa","Some days it is."],["Eva","You should put that on a recruiting poster."],["Jessa","I'm not recruiting her."],["Nessa","Why did you stay out there?"],["Jessa","Because when I woke up wanting to leave, I could."],["Eva","That's it?"],["Jessa","That's a lot."],["Nessa","It sounds lonely."],["Jessa","Sometimes."],["Eva","You are terrible at encouragement."],["Jessa","She asked for information."]],
            "SUN_S1E07_P06": [["Eva","Two whole days."],["Kael","I counted."],["Eva","Nobody called you anything."],["Kael","Several people called me Kael."],["Eva","You know what I mean."],["Jessa","There was a Sunforge in the yard."],["Eva","Exactly."],["Jessa","There was a goat on it most of yesterday."],["Eva","The goat is not relevant."],["Kael","You don't know that."],["Eva","Don't you start."],["Kael","I had a nice supper."],["Jessa","Put that in the notebook."],["Eva","I hate both of you."]],
            "SUN_S1E08_P01": [["Jessa","No more going ahead."],["Veyra","Agreed."],["Jessa","No notes left for towns. No helpful strangers. No 'accidental' conversations."],["Samuel","You have my word."],["Kael","Stay where she can see you and you'll save us all time."],["Veyra","You say that like I'm the dangerous one."],["Kael","I said it like Jessa has rules."],["Eva","There's a rider on the south ridge."],["Jessa","How far?"],["Eva","A mile?"],["Veyra","Less."],["Kael","Coming toward us?"],["Eva","No."],["Kael","Then let them have their ridge."]],
            "SUN_S1E08_P02": [["Eva","We should be closer."],["Veyra","We should."],["Eva","By how much?"],["Veyra","Enough that I wouldn't be asking."],["Eva","Mirage?"],["Veyra","Maybe."],["Eva","You hate maybe."],["Veyra","I hate pretending maybe is no."]],
            "SUN_S1E08_P03": [["Jessa","This was the ridge."],["Eva","I know."],["Samuel","Could've moved."],["Veyra","Without leaving tracks?"],["Samuel","Could be another rider."],["Kael","Could be two people who own similar hats."],["Eva","You don't believe that."],["Kael","I don't believe anything yet."],["Jessa","Good. Let's keep it that way."]],
            "SUN_S1E08_P04": [["Eva","One more ridge."],["Kael","No."],["Eva","We finally have something that doesn't make sense."],["Kael","We've had plenty of those."],["Eva","Not like this."],["Kael","It's still a stranger who hasn't asked us for anything."],["Samuel","He's right."],["Eva","You were more useful when you were lying to us."],["Samuel","I wasn't."],["Jessa","Eva."],["Eva","What?"],["Jessa","Don't turn around."],["Kael","You know that never works."]],
            "SUN_S1E08_P05": [["Samuel","Red Wash."],["Veyra","Yes."],["Eva","You've seen this before."],["Veyra","Once."],["Eva","And forgot to mention it?"],["Veyra","I didn't forget."],["Jessa","When?"],["Veyra","Months ago. Before Samuel. Before I knew Kael's route."],["Eva","You rode toward it?"],["Veyra","Until my horse was lathered and the rider was farther away."],["Kael","Then maybe it isn't following me."],["Veyra","I didn't say it was following you."],["Kael","No. You just looked at me."]],
            "SUN_S1E08_P06": [["Eva","Gone."],["Kael","Good."],["Jessa","No."],["Eva","What?"],["Jessa","Road behind us."],["Samuel","That's closer."],["Veyra","Much."],["Eva","You have an explanation?"],["Veyra","No."],["Eva","None?"],["Veyra","Do you want a bad one?"],["Kael","I want coffee."],["Eva","Now?"],["Kael","Especially now."]]
          }'''
          repl=json.loads(raw)
          base=pathlib.Path('data/shows/sunforge-outlaw-s1')
          for issue in range(5,9):
              path=base/f'pages_e{issue:02d}.json'
              pages=json.loads(path.read_text(encoding='utf-8'))
              for page in pages:
                  if page['id'] in repl:
                      page['dialogueInline']=[{'speaker':s,'text':t} for s,t in repl[page['id']]]
              path.write_text(json.dumps(pages,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit rewrite and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sunforge-dialogue-arc2.yml
          git add data/shows/sunforge-outlaw-s1/pages_e05.json data/shows/sunforge-outlaw-s1/pages_e06.json data/shows/sunforge-outlaw-s1/pages_e07.json data/shows/sunforge-outlaw-s1/pages_e08.json
          git commit -m 'Rewrite Sunforge dialogue issues 5-8'
          git push origin HEAD:sunforge-dialogue-pass-20260914
