name: IMG artifact bridge P9 P10

on:
  push:
    branches:
      - img-artifact-bridge-p9-p10
    paths:
      - '.github/workflows/img-artifact-bridge-p9-p10.yml'

permissions:
  contents: read

jobs:
  export-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RexPrompt
        uses: actions/checkout@v4
      - name: Verify targets exist
        run: |
          test -f production/drafts/azure-reach/azure-reach-s1-e02/azr_s1e02_p09.png
          test -f production/drafts/azure-reach/azure-reach-s1-e02/azr_s1e02_p10.png
      - name: Upload target images
        uses: actions/upload-artifact@v4
        with:
          name: img-bridge-azr-s1e02-p9-p10
          path: |
            production/drafts/azure-reach/azure-reach-s1-e02/azr_s1e02_p09.png
            production/drafts/azure-reach/azure-reach-s1-e02/azr_s1e02_p10.png
          if-no-files-found: error
          retention-days: 1
