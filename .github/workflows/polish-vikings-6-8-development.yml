name: Polish Vikings 6-8 development

on:
  push:
    branches:
      - develop/vikings-issues-6-8-page-scripts
    paths:
      - tools/polish_vikings_6_8_development.py
      - .github/workflows/polish-vikings-6-8-development.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/vikings-issues-6-8-page-scripts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Polish development scripts
        run: python tools/polish_vikings_6_8_development.py
      - name: Commit script polish
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/vikings-2026-s1/issue_06_trial_of_toil_script.md data/shows/vikings-2026-s1/issue_07_war_council_script.md data/shows/vikings-2026-s1/issue_08_trial_by_combat_script.md
          git commit -m "Polish Vikings 6-8 dialogue voice"
          git push origin HEAD:develop/vikings-issues-6-8-page-scripts
