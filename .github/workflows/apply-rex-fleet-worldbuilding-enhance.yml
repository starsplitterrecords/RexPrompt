name: Apply Rex Fleet worldbuilding Enhance

on:
  push:
    paths:
      - 'tools/enhance_rex_fleet_worldbuilding_20260906.py'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out enhancement branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Rex Fleet Enhance
        run: python tools/enhance_rex_fleet_worldbuilding_20260906.py

      - name: Validate Rex Fleet
        run: python tools/validate_rex_fleet.py

      - name: Commit enhanced production data
        run: |
          git config user.name "starsplitterrecords"
          git config user.email "77013062+starsplitterrecords@users.noreply.github.com"
          git add data/shows/rex-fleet-s1
          if git diff --cached --quiet; then
            echo "No Rex Fleet data changes"
            exit 0
          fi
          git commit -m "Enhance Rex Fleet worldbuilding and corridor physics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
