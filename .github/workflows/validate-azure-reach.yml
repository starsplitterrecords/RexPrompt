name: Validate Azure Reach

on:
  pull_request:
    paths:
      - 'index.html'
      - 'data/shows.json'
      - 'data/shows/azure-reach/**'
      - 'tools/validate_azure_reach.py'
      - '.github/workflows/validate-azure-reach.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Azure Reach page production data
        run: python tools/validate_azure_reach.py
