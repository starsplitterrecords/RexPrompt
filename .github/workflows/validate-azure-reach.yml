name: Validate Azure Reach

on:
  pull_request:
    paths:
      - 'data/shows.json'
      - 'data/shows/azure-reach-s1/**'
      - 'tools/validate_azure_reach.py'
      - 'tools/sanitize_azure_reach_recovery.py'
      - '.github/workflows/validate-azure-reach.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove recovery-only causal scaffolding
        run: python tools/sanitize_azure_reach_recovery.py
      - name: Commit sanitized payloads
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shows/azure-reach-s1/encoded/pages_e02_p01_p06.json.gzb64 data/shows/azure-reach-s1/encoded/pages_e02_p07_p12.json.gzb64
          git commit -m 'Sanitize Azure Reach Issue 2 recovery payloads [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
      - name: Validate Azure Reach mechanical integrity
        run: python tools/validate_azure_reach.py
