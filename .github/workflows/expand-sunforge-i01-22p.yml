name: Expand Sunforge Issue 1 to 22 pages

on:
  push:
    branches: [expand-sunforge-i01-22p-20260914]
    paths: ['.github/workflows/expand-sunforge-i01-22p.yml']

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expand-sunforge-i01-22p-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write expanded issue and narrator guidance
        env:
          ISSUE_B64: >-
            
        run: |
          python - <<'PY'
          import base64, gzip, json, os, pathlib
          root = pathlib.Path('.')
          pages_path = root/'data/shows/sunforge-outlaw-s1/pages_e01.json'
          raw = gzip.decompress(base64.b64decode(os.environ['ISSUE_B64'])).decode('utf-8')
          pages = json.loads(raw)
          pages_path.write_text(json.dumps(pages, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          direction_path = root/'data/shows/sunforge-outlaw-s1/direction.json'
          direction = json.loads(direction_path.read_text(encoding='utf-8'))
          text = direction['sunforge-story']['text']
          narrator = (' Caption narration may appear as dialogueInline speaker CAPTION. The narrator is a dry western storyteller: authoritative about ordinary facts, names, visible history, elapsed time and immediate context, but not about the larger mystery. Use captions to introduce people, compress time, contrast rumor with observed fact, or create mild irony. The narrator must not reveal mystery answers, explain themes, invent pseudo-scientific causality, or tell the reader what to feel. Not every page needs captions; each caption must do work the panels or balloons do not.')
          if 'Caption narration may appear' not in text:
              direction['sunforge-story']['text'] = text + narrator
          direction_path.write_text(json.dumps(direction, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          characters_path = root/'data/shows/sunforge-outlaw-s1/characters.json'
          characters = json.loads(characters_path.read_text(encoding='utf-8'))
          tomas = characters['C_sun_hanging_man']
          tomas['name'] = 'Tomas'
          tomas['role'] = 'Last Drop local being publicly hanged by Marcus when Kael intervenes; survives and later becomes one of the people who knows Kael by his real name'
          characters_path.write_text(json.dumps(characters, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          assert len(pages) == 22
          assert [p['page'] for p in pages] == list(range(1,23))
          assert len({p['id'] for p in pages}) == 22
          assert all(p['id'] == f"SUN_S1E01_P{p['page']:02d}" for p in pages)
          assert all(4 <= len(p.get('panelPlan', [])) <= 6 for p in pages)
          char_ids = set(characters)
          for p in pages:
              missing = set(p.get('characters', [])) - char_ids
              assert not missing, (p['id'], missing)
              assert p.get('direction') == ['sunforge-story']
          captions = sum(1 for p in pages for d in p.get('dialogueInline', []) if d.get('speaker') == 'CAPTION')
          assert captions >= 8
          print(f'validated 22 pages; {sum(len(p["panelPlan"]) for p in pages)} panels; {captions} captions')
          PY
      - name: Commit production changes and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shows/sunforge-outlaw-s1/pages_e01.json data/shows/sunforge-outlaw-s1/direction.json data/shows/sunforge-outlaw-s1/characters.json
          git rm .github/workflows/expand-sunforge-i01-22p.yml
          git commit -m 'Expand Sunforge Issue 1 to 22 pages'
          git push origin HEAD:expand-sunforge-i01-22p-20260914
