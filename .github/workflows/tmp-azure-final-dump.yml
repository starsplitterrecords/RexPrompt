name: Temporary Azure Reach Final Dump

on:
  push:
    paths:
      - '.github/workflows/tmp-azure-final-dump.yml'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/azure-reach-chef-boundary-20260910
      - name: Decode unreleased Azure Reach page data
        shell: python
        run: |
          import base64,gzip,json,pathlib,re
          root=pathlib.Path('data/shows/azure-reach-s1'); out=pathlib.Path('dump'); out.mkdir()
          pages=[]
          for p in sorted((root/'encoded').glob('*.json.gzb64')):
              data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode())
              src=data if isinstance(data,list) else data.get('pages',[])
              for page in src:
                  if re.match(r'^AZR_S1E0[2-6]_P\d{2}$',str(page.get('id',''))): pages.append(page)
          (out/'pages-e02-e06.json').write_text(json.dumps(pages,indent=2,ensure_ascii=False)+'\n')
          for name in ('direction.json','settings.json','characters.json'):
              (out/name).write_text((root/name).read_text())
          print('pages',len(pages))
      - uses: actions/upload-artifact@v4
        with:
          name: azure-final-chef-dump
          path: dump/
          if-no-files-found: error
          retention-days: 1
