name: IMG artifact bridge test

on:
  push:
    branches:
      - img-artifact-bridge-test
    paths:
      - '.github/workflows/img-artifact-bridge-test.yml'

permissions:
  contents: read

jobs:
  export-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RexPrompt
        uses: actions/checkout@v4
      - name: Verify target exists
        run: test -f production/drafts/azure-reach/azure-reach-s1-e02/azr_s1e02_p11.png
      - name: Upload target image
        uses: actions/upload-artifact@v4
        with:
          name: img-bridge-azr-s1e02-p11
          path: production/drafts/azure-reach/azure-reach-s1-e02/azr_s1e02_p11.png
          if-no-files-found: error
          retention-days: 1
