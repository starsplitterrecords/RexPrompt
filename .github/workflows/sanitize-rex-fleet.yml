name: Sanitize Rex Fleet

on:
  push:
    branches: [sanitize-rex-fleet]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize-rex-fleet
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sanitize Rex Fleet package
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, re

          ROOT = Path('.')
          SHOW = ROOT / 'data' / 'shows' / 'rex-fleet-s1'
          MANIFEST = ROOT / 'data' / 'shows.json'
          INDEX = ROOT / 'index.html'

          def load_json(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save_json(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          def save_scene_list(path, scenes):
              text = '[\n' + ',\n'.join(json.dumps(s, ensure_ascii=False, separators=(',', ':')) for s in scenes) + '\n]\n'
              path.write_text(text, encoding='utf-8')

          def load_encoded(path):
              text = ''.join(path.read_text(encoding='utf-8').split())
              return json.loads(gzip.decompress(base64.b64decode(text, validate=True)).decode('utf-8'))

          def save_encoded(path, obj):
              raw = json.dumps(obj, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              packed = gzip.compress(raw, mtime=0)
              path.write_text(base64.b64encode(packed).decode('ascii') + '\n', encoding='utf-8')

          # ------------------------------------------------------------------
          # Show-level production scope: Rex Fleet is comic production, not
          # the assembler's legacy default video prompt.
          # ------------------------------------------------------------------
          shows = load_json(MANIFEST)
          show = next(s for s in shows if s.get('id') == 'rex-fleet-s1')
          show['unitLabel'] = 'SCENE'
          show['generationLine'] = (
              'Prestige full-color comic-book sequential-art scene. Preserve scripted action, '
              'character identity, continuity, and exact lettering. Fictional production.'
          )
          save_json(MANIFEST, shows)

          # ------------------------------------------------------------------
          # Persistent character scope. Separate role / voice / arc and keep
          # ordinary production reference names structured instead of buried
          # in correction prose.
          # ------------------------------------------------------------------
          chars = load_json(SHOW / 'characters.json')

          for dead in (
              'C_mother_soft', 'C_venn_soft_to_herself', 'C_jex_low',
              'C_billie_low', 'C_tess_vo', 'C_kerr_cerulean', 'C_triarch_voice'
          ):
              chars.pop(dead, None)

          chars.pop('C_rhyne_aegis', None)
          chars.pop('C_keating_ember', None)

          def C(name, handle, role, reference=None, voice=None, arc=None, aliases=None):
              out = {'name': name, 'handle': handle, 'role': role}
              if reference:
                  out['referenceName'] = reference
              if aliases:
                  out['aliases'] = aliases
              if voice:
                  out['voice'] = voice
              if arc:
                  out['arc'] = arc
              return out

          chars['C_commodore_ella_venn'] = C(
              'Commodore Ella Venn', '@starsplit.ella.venn',
              'Fleet — Commander of Thunderbreak (Heavy Cruiser)', 'Venn',
              'Calm, deliberate, ceremonial but not aloof; authority through steadiness.',
              'Moves from doctrine-bound command toward operational restraint and shared civilian protection.'
          )
          chars['C_admiral_cael_dominion'] = C(
              'Admiral Cael Dominion', '@starsplit.cael.dominion',
              'Fleet Admiralty — projection doctrine', 'Dominion',
              'Formal, lofty, doctrine-first; threats arrive as institutional certainty rather than temper.',
              'Allows limited experiments in restraint while remaining the principal institutional counterweight to Venn.'
          )
          chars['C_abby_saville'] = C(
              'Abby Saville', '@starsplit.abby.saville',
              'Shards — Warlord of the Scythe of Saville', 'Abby',
              'Sharp, direct, pragmatic; hates wasted words.',
              'Builds a survival bloc, breaks Triarch command for civilian passage, survives Shatterforge, and returns at Auric Gate.'
          )
          chars['C_tessa_banks'] = C(
              'Tessa Banks', '@starsplit.tessa.banks',
              'Shards — Captain of Gravefire Cutter', 'Tess',
              'Sparse, cutting, honest, weary of ideology.',
              'Civilian protector and cross-faction bridge who repeatedly chooses practical restraint.'
          )
          chars['C_billie_rusk'] = C(
              'Billie Rusk', '@starsplit.billie.rusk',
              'Shards — Raider commander, Ashfang Marauder', 'Billie',
              'Loud, brash, mocking, theatrical; enjoys danger until consequences land close.',
              'Tests Abby’s restraint, develops a hard boundary around civilians, disables Pike at Auric Gate, and remains outside the Accord.'
          )
          chars['C_governor_halev'] = C(
              'Governor Chris Halev', '@starsplit.halev',
              'Verge — Civil leader of Auric Bazaar', 'Halev',
              'Plainspoken and pragmatic; speaks in cargo, heat, food, docks, and people.',
              'Brokers civilian survival needs into the Shattered Accord.'
          )
          chars['C_captain_naomi_sol'] = C(
              'Captain Naomi Sol', '@starsplit.naomi.sol',
              'Verge — Escort commander', 'Naomi',
              'Blunt, sharp, proud; humor and impatience leak through under pressure.',
              'Resists dependence on Fleet while becoming a key partner in shared corridor operations.'
          )
          chars['C_jex_marrin'] = C(
              'Jex Marrin', '@starsplit.jex.marrin',
              'Independent broker — Veil Market', 'Jex',
              'Smooth, sardonic, transactional; wit is armor and tradecraft.',
              'Gradually gives up informational and material advantage when secrecy and scarcity begin killing people.'
          )
          chars['C_elder_wallace'] = C(
              'Brent Wallace', '@starsplit.brent.wallace',
              'Verge — Trader guild elder', 'Elder Wallace',
              'Dry, muttering, sarcastic.',
              'Serves as a cynical commerce voice rather than a moral center.'
          )
          chars['C_oren_pike'] = C(
              'Oren Pike', '@starsplit.oren.pike',
              'Shards — Captain of Broken Oath', 'Pike',
              'Charismatic, bombastic, performance-conscious; wants witnesses as much as results.',
              'Seeks legitimacy through spectacle, loses authority when restraint outperforms him, and is disabled by Billie at Auric Gate.'
          )
          chars['C_silent_triarch'] = C(
              'The Silent Triarch', '@starsplit.silent.triarch',
              'Shards — masked ruling council', 'Triarch',
              'Sparse, deliberate, decree-like.',
              'Preserves authority through scarcity, coercion, blockade, and information control.',
              aliases=['@starsplit.triarch', '@starsplit.triarch.voice']
          )
          chars['C_luminara_mother'] = C(
              'Luminara Mother', '@starsplit.luminara.mother',
              'Verge civilian parent', 'Mother',
              'Protective, pragmatic, fatigue-weighted.',
              'Keeps civilian cost visible inside corridor politics.'
          )
          chars['C_luminara_boy'] = C(
              'Luminara Boy', '@starsplit.luminara.boy',
              'Verge civilian child', 'Luminara Boy',
              'Direct, curious, innocent without being precocious.',
              'His questions expose stakes adults obscure.'
          )
          chars['C_archivist_selene_stormwell'] = C(
              'Archivist Selene Stormwell', '@starsplit.selene.stormwell',
              'Fleet — Keeper of Memory, Stormwell Archive', 'Selene',
              'Calm, deliberate, liturgical.',
              'Turns cross-faction survival into institutional record rather than preserving a Fleet-only story.'
          )
          chars['C_liora_virelia'] = C(
              'Liora Virelia', '@starsplit.liora.virelia',
              'Historical voice / scientific memory witness', 'Liora'
          )
          chars['C_lieutenant_deka'] = C(
              'Lieutenant Erin Deka', '@starsplit.deka',
              'Recurring operational supporting officer', 'Deka'
          )
          chars['C_jia_morgan'] = C(
              'Jia Morgan', '@starsplit.jia.morgan',
              'Technical analyst', 'Jia',
              'Precise, empirical, provisional; distinguishes measurement from theory.',
              'Translates corridor and anomaly measurements into operational rules.'
          )
          chars['C_soren_kerr'] = C(
              'Admiral Soren Kerr', '@starsplit.soren.kerr',
              'Fleet Admiralty — Cerulean / restraint', 'Kerr',
              'Diplomatic, morally direct, politically seasoned; attentive to civilians and legitimacy.'
          )
          chars['C_tom_barrett'] = C(
              'Tom Barrett', '@starsplit.tom.barrett',
              'Shards — Captain', 'Tom'
          )
          chars['C_admiral_colin_rhyne'] = C(
              'Admiral Colin Rhyne', '@starsplit.colin.rhyne',
              'Fleet Admiralty — Aegis / Defense', 'Rhyne',
              'Practical, protective, integration-minded; favors Verge pilots in Fleet pickets and civilian access.'
          )
          chars['C_admiral_janet_keating'] = C(
              'Admiral Janet Keating', '@starsplit.janet.keating',
              'Fleet Admiralty — hard-line military voice', 'Keating',
              'Force- and blockade-oriented; treats delay and civilian constraints as operational risk.'
          )
          chars['C_silent_triarch_raid'] = C(
              'Silent Triarch — Raid', '@starsplit.silent.triarch.raid',
              'Triarch mask — Raid', 'Raid Mask',
              'Sparse and imperative; frames seizure as survival.',
              aliases=['@starsplit.raid.mask']
          )
          chars['C_silent_triarch_fear'] = C(
              'Silent Triarch — Fear', '@starsplit.silent.triarch.fear',
              'Triarch mask — Fear', 'Fear Mask',
              'Sparse and clinical; treats fear as a governing instrument.',
              aliases=['@starsplit.fear.mask']
          )
          chars['C_silent_triarch_trade'] = C(
              'Silent Triarch — Trade', '@starsplit.silent.triarch.trade',
              'Triarch mask — Trade', 'Trade Mask',
              'Sparse and transactional; frames control as managed flow.',
              aliases=['@starsplit.trade.mask']
          )

          # Functional roles: retain identity only; remove generated source-label commentary.
          functional = {
              'C_second': ('Second', '@starsplit.second', 'Verge escort second officer'),
              'C_officer': ('Officer', '@starsplit.officer', 'Fleet officer'),
              'C_raider': ('Raider', '@starsplit.raider', 'Shard raider'),
              'C_fleet_sergeant': ('Fleet Sergeant', '@starsplit.fleet.sergeant', 'Fleet sergeant'),
              'C_tactical': ('Tactical', '@starsplit.tactical', 'Fleet tactical officer'),
              'C_medic': ('Medic', '@starsplit.medic', 'Fleet medic'),
              'C_crew_various': ('Crew (various)', '@starsplit.crew.various', 'Fleet crew ensemble'),
              'C_rival_captain': ('Rival Captain', '@starsplit.rival.captain', 'Shard rival captain'),
              'C_scribe': ('Scribe', '@starsplit.scribe', 'Court or market scribe'),
              'C_emissary': ('Emissary', '@starsplit.emissary', 'Triarch emissary'),
              'C_child': ('Child', '@starsplit.child', 'Civilian child'),
          }
          for cid, (name, handle, role) in functional.items():
              if cid in chars:
                  chars[cid] = C(name, handle, role)

          save_json(SHOW / 'characters.json', chars)

          # ------------------------------------------------------------------
          # Episode 1 uses dictionary references. Merge delivery-note pseudo-
          # characters back into their real identities and remove remote Billie
          # from the Thunderbreak bridge cast list.
          # ------------------------------------------------------------------
          e1 = load_json(SHOW / 'scenes_e01.json')
          id_map = {
              'C_mother_soft': 'C_luminara_mother',
              'C_venn_soft_to_herself': 'C_commodore_ella_venn',
              'C_jex_low': 'C_jex_marrin',
              'C_billie_low': 'C_billie_rusk',
              'C_tess_vo': 'C_tessa_banks',
              'C_kerr_cerulean': 'C_soren_kerr',
              'C_rhyne_aegis': 'C_admiral_colin_rhyne',
              'C_keating_ember': 'C_admiral_janet_keating',
              'C_triarch_voice': 'C_silent_triarch',
          }
          for scene in e1:
              if scene.get('characters'):
                  out = []
                  for cid in scene['characters']:
                      cid = id_map.get(cid, cid)
                      if scene.get('id') == 'RF_S1E01_S06' and cid == 'C_billie_rusk':
                          continue
                      if cid not in out:
                          out.append(cid)
                  scene['characters'] = out
          save_scene_list(SHOW / 'scenes_e01.json', e1)
          save_scene_list(SHOW / 'scenes_prequel.json', e1)

          # ------------------------------------------------------------------
          # Legacy lookup dictionaries now contain only what Episode 1 actually
          # references. E2-E12 own their inline dialogue/direction.
          # ------------------------------------------------------------------
          dlg = load_json(SHOW / 'dialogue.json')
          dlg['D_RF_E01_S07_03']['speakerId'] = 'C_luminara_mother'
          dlg['D_RF_E01_S07_03']['subtext'] = 'soft'
          dlg['D_RF_E01_S08_02']['speakerId'] = 'C_commodore_ella_venn'
          dlg['D_RF_E01_S08_02']['subtext'] = 'soft, to herself'
          dlg['D_RF_E01_S09_03']['speakerId'] = 'C_jex_marrin'
          dlg['D_RF_E01_S09_03']['subtext'] = 'low'
          dialogue_refs = []
          direction_refs = []
          setting_refs = []
          for scene in e1:
              dialogue_refs.extend(scene.get('dialog', []))
              direction_refs.extend(scene.get('direction', []))
              if scene.get('setting') and scene['setting'] not in setting_refs:
                  setting_refs.append(scene['setting'])
          dlg = {k: dlg[k] for k in dialogue_refs}
          save_json(SHOW / 'dialogue.json', dlg)

          direction_text = {
              'X_RF_E01_S01_VIS': 'Establish Luminara departure as working civilian infrastructure: Mother and Boy amid grain freight and departure traffic. Keep their relationship readable while the dock remains active.',
              'X_RF_E01_S02_VIS': 'Establish convoy scale inside Kaldr Rift and keep the debris corridor spatially legible. The transition should make the convoy feel exposed.',
              'X_RF_E01_S03_VIS': 'Keep Naomi and her second in the cramped escort cockpit. Naomi’s reaction to Thunderbreak taking the lead is the beat.',
              'X_RF_E01_S04_VIS': 'Make Thunderbreak’s sideways ram and protective geometry unmistakable. The convoy ship it shields must remain readable in the same action.',
              'X_RF_E01_S05_VIS': 'Stage the boarding as zero-G cargo-bay chaos. Keep the Mother, raider, and Fleet sergeant readable through the movement; cargo remains both obstacle and objective.',
              'X_RF_E01_S06_VIS': 'Stay on Venn’s command response as Ashfang breaks the screen. Show the threat through tactical space and ship geometry rather than placing Billie on Thunderbreak.',
              'X_RF_E01_S07_VIS': 'Let the med-bay quiet carry the cost of the rescue. Keep the Mother and Venn’s reactions readable around the medic’s work.',
              'X_RF_E01_S08_VIS': 'Treat the memorial as restrained crew ritual. Names and losses matter more than spectacle; Venn’s private line remains private.',
              'X_RF_E01_S09_VIS': 'Keep survivor disembarkation active around Naomi and Venn’s corridor tension. Jex’s aside should feel like an opportunist reading the new situation.',
              'X_RF_E01_S10_VIS': 'Black Drift dominates the frame: Ashfang idles among jagged rock as the episode shifts from corridor survival to the raiders’ next move.',
              'X_RF_E01_S11_VIS': 'Stay with Billie and Ashfang in Black Drift. The final beat is her promise to try again, not a generic quiet portrait.'
          }
          direction = {k: {'text': direction_text[k]} for k in direction_refs}
          save_json(SHOW / 'direction.json', direction)

          settings = load_json(SHOW / 'settings.json')
          setting_env = {
              'S_luminara_fields_dock': 'Agricultural freight dock serving grain and food shipments.',
              'S_kaldr_rift': 'Debris corridor used by convoy traffic between settled systems.',
              'S_verge_escort_cockpit': 'Compact working escort cockpit with utilitarian controls and limited space.',
              'S_thunderbreak_bridge': 'Ordered heavy-cruiser command bridge built around tactical coordination and convoy control.',
              'S_farm_freighter_cargo_neck': 'Zero-gravity cargo transit section connecting freight compartments.',
              'S_thunderbreak_med_bay': 'Functional Fleet medical bay designed for emergency stabilization.',
              'S_thunderbreak_memorial_deck': 'Shipboard remembrance space centered on recorded names and losses.',
              'S_auric_bazaar_dock_ring': 'Crowded civilian and trade dock receiving convoy traffic at Auric Bazaar.',
              'S_black_drift_shardfields': 'Jagged debris and rock field used by Shard vessels for cover and staging.'
          }
          settings = {
              k: {'name': settings[k]['name'], 'environment': setting_env[k]}
              for k in setting_refs
          }
          save_json(SHOW / 'settings.json', settings)

          # ------------------------------------------------------------------
          # Scene-level sanitation. Persistent performance voice leaves scene
          # direction; direct-continuity prose becomes a structured reference.
          # ------------------------------------------------------------------
          GENERIC_DIALOGUE = 'Play the dialogue as an exchange with listening, interruption and reaction; avoid posed recitation. Keep faces readable and let the environment stay active.'
          GENERIC_CONTINUITY = 'Continuous from the prior beat in this location; preserve positions, props, damage, eyelines and emotional momentum.'
          GENERIC_HOLD = 'Let this visual beat breathe long enough to establish consequence before the next exchange.'
          META_PREFIXES = ('Canon anchors', 'Characters:', 'Tone:', 'Season 2 hooks:', 'Visual tone guidance:')
          removed = {'performance': 0, 'dialogue': 0, 'continuity': 0, 'hold': 0, 'meta': 0}

          def sanitize_scenes(scenes):
              previous = None
              for scene in scenes:
                  clean = []
                  for item in scene.get('directionInline', []):
                      if item.startswith('Performance:'):
                          removed['performance'] += 1
                          continue
                      if item == GENERIC_DIALOGUE:
                          removed['dialogue'] += 1
                          continue
                      if item == GENERIC_CONTINUITY:
                          if not previous:
                              raise SystemExit(f"{scene.get('id')}: continuity boilerplate has no previous scene")
                          scene['continuityFrom'] = previous.get('id')
                          removed['continuity'] += 1
                          continue
                      if item == GENERIC_HOLD:
                          removed['hold'] += 1
                          continue
                      if item.startswith(META_PREFIXES):
                          removed['meta'] += 1
                          continue
                      clean.append(item)
                  if 'directionInline' in scene:
                      scene['directionInline'] = clean
                  previous = scene
              return scenes

          e2_path = SHOW / 'scenes_e02.json'
          e2 = sanitize_scenes(load_json(e2_path))
          save_scene_list(e2_path, e2)

          later = {}
          for n in range(3, 13):
              path = SHOW / 'encoded' / f'scenes_e{n:02d}.json.gzb64'
              scenes = sanitize_scenes(load_encoded(path))
              later[n] = scenes
              save_encoded(path, scenes)

          # ------------------------------------------------------------------
          # Assembler: resolve inline handles back to persistent character data
          # so voice lives once at identity scope. Render structured continuity
          # references without storing the same paragraph in every scene.
          # ------------------------------------------------------------------
          html = INDEX.read_text(encoding='utf-8')
          old = 'function joinPath(base,file){return String(base||"data").replace(/\\\/$/,"")+"/"+file}function getHandle(id,c){const e=c[id];return e?e.handle||e.name||id:id}function formatEntry(e){if(typeof e==="string")return e;if(e.text)return e.text;if(e.name)return e.name;if(e.summary)return e.summary;return JSON.stringify(e)}'
          new = 'function joinPath(base,file){return String(base||"data").replace(/\\\/$/,"")+"/"+file}function getHandle(id,c){const e=c[id];return e?e.handle||e.name||id:id}function formatEntry(e){if(typeof e==="string")return e;if(e.text)return e.text;if(e.name)return e.name;if(e.summary)return e.summary;return JSON.stringify(e)}function findCharacterByHandle(h,c){return Object.values(c||{}).find(e=>e&&(e.handle===h||(Array.isArray(e.aliases)&&e.aliases.includes(h))))}function formatCharacter(e,fallback){if(!e)return fallback;const p=[e.name||fallback];if(e.role)p.push(e.role);if(e.voice)p.push("Voice: "+e.voice);return p.join(" — ")}'
          if old not in html:
              raise SystemExit('index.html character helper anchor not found')
          html = html.replace(old, new)
          old_chars = 'if(s.charactersInline?.length){out.push("\\n[CHARACTERS]");s.charactersInline.forEach(c=>out.push(c.name||c.handle))}else if(s.characters?.length){out.push("\\n[CHARACTERS]");s.characters.forEach(k=>{const e=store["characters.json"]?.[k];if(e)out.push(formatEntry(e))})}'
          new_chars = 'if(s.charactersInline?.length){out.push("\\n[CHARACTERS]");s.charactersInline.forEach(c=>{const e=findCharacterByHandle(c.handle,store["characters.json"]||{});out.push(formatCharacter(e,c.name||c.handle))})}else if(s.characters?.length){out.push("\\n[CHARACTERS]");s.characters.forEach(k=>{const e=store["characters.json"]?.[k];if(e)out.push(formatCharacter(e,k))})}'
          if old_chars not in html:
              raise SystemExit('index.html character rendering anchor not found')
          html = html.replace(old_chars, new_chars)
          old_dir = 'if(s.directionInline?.length){out.push("\\n[DIRECTION]");s.directionInline.forEach(x=>out.push(formatEntry(x)))}else if(s.direction?.length){out.push("\\n[DIRECTION]");s.direction.forEach(k=>{const e=store["direction.json"]?.[k];if(e)out.push(formatEntry(e))})}'
          new_dir = 'if(s.continuityFrom)out.push("\\n[CONTINUITY]\\nContinue directly from "+s.continuityFrom+"; preserve established positions, props, damage, eyelines, and emotional state.");if(s.directionInline?.length){out.push("\\n[DIRECTION]");s.directionInline.forEach(x=>out.push(formatEntry(x)))}else if(s.direction?.length){out.push("\\n[DIRECTION]");s.direction.forEach(k=>{const e=store["direction.json"]?.[k];if(e)out.push(formatEntry(e))})}'
          if old_dir not in html:
              raise SystemExit('index.html direction rendering anchor not found')
          html = html.replace(old_dir, new_dir)
          INDEX.write_text(html, encoding='utf-8')

          # ------------------------------------------------------------------
          # Sanitation assertions.
          # ------------------------------------------------------------------
          e1_ids = {s['id'] for s in e1}
          if load_json(SHOW / 'scenes_prequel.json') != e1:
              raise SystemExit('Episode 1 legacy mirror differs after sanitation')
          if set(load_json(SHOW / 'dialogue.json')) != set(dialogue_refs):
              raise SystemExit('dialogue.json contains unreferenced or missing entries')
          if set(load_json(SHOW / 'direction.json')) != set(direction_refs):
              raise SystemExit('direction.json contains unreferenced or missing entries')
          if set(load_json(SHOW / 'settings.json')) != set(setting_refs):
              raise SystemExit('settings.json contains unreferenced or missing Episode 1 entries')

          chars_check = load_json(SHOW / 'characters.json')
          primary_handles = [v.get('handle') for v in chars_check.values() if v.get('handle')]
          if len(primary_handles) != len(set(primary_handles)):
              raise SystemExit('Duplicate primary character handles remain')
          for dead in ('C_mother_soft','C_venn_soft_to_herself','C_jex_low','C_billie_low','C_tess_vo','C_kerr_cerulean','C_triarch_voice','C_rhyne_aegis','C_keating_ember'):
              if dead in chars_check:
                  raise SystemExit(f'Delivery/correction identity survived: {dead}')
          for cid, record in chars_check.items():
              blob = json.dumps(record, ensure_ascii=False)
              if 'Production reference:' in blob or 'Source speaker label:' in blob:
                  raise SystemExit(f'Correction/source-label prose survived in {cid}')

          all_scenes = list(e2)
          for n in range(3, 13):
              all_scenes.extend(later[n])
          ids = {s.get('id') for s in all_scenes}
          forbidden = (GENERIC_DIALOGUE, GENERIC_CONTINUITY, GENERIC_HOLD)
          for scene in all_scenes:
              for item in scene.get('directionInline', []):
                  if item.startswith('Performance:') or item in forbidden or item.startswith(META_PREFIXES):
                      raise SystemExit(f"{scene.get('id')}: repeated scaffold survived: {item}")
              if scene.get('continuityFrom') and scene['continuityFrom'] not in ids:
                  raise SystemExit(f"{scene.get('id')}: continuityFrom target missing: {scene['continuityFrom']}")

          if '10-second vertical clip' in show['generationLine'] or 'TV style' in show['generationLine']:
              raise SystemExit('Rex Fleet still inherits video production language')
          if 'comic-book' not in show['generationLine']:
              raise SystemExit('Rex Fleet comic generation line missing')

          print('Sanitation removed:', removed)
          print('Persistent characters:', len(chars_check))
          print('Episode 1 dialogue refs:', len(dialogue_refs))
          print('Episode 1 direction refs:', len(direction_refs))
          print('Episode 1 setting refs:', len(setting_refs))
          PY
      - name: Validate Rex Fleet
        run: python tools/validate_rex_fleet.py
      - name: Commit sanitized package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html data/shows.json data/shows/rex-fleet-s1
          if git diff --cached --quiet; then
            echo 'No sanitation changes.'
            exit 0
          fi
          git commit -m "Sanitize Rex Fleet production package"
