name: Fix Vikings Issue 5 Kin montage

on:
  push:
    branches:
      - fix/vikings-issue5-kin-montage
    paths:
      - tools/fix_vikings_issue5_kin_montage.py
      - .github/workflows/fix-vikings-issue5-kin-montage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vikings-issue5-kin-montage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch montage
        run: python tools/fix_vikings_issue5_kin_montage.py
      - name: Commit patched production payload
        run: |
          if git diff --quiet; then
            echo "No montage changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/vikings-2026-s1/encoded/pages_e05_p13_p18.json.gzb64
          git commit -m "Fix Vikings Issue 5 Kin montage continuity"
          git push origin HEAD:fix/vikings-issue5-kin-montage

# One-shot workflow for the isolated Issue 5 montage correction.
