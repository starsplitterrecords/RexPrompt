name: Finalize Sunforge Outlaw ingest

on:
  push:
    branches:
      - ingest-sunforge-outlaw-20260911
    paths:
      - '.github/workflows/ingest-sunforge-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-sunforge-outlaw-20260911
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ingest branch
        uses: actions/checkout@v4
        with:
          ref: ingest-sunforge-outlaw-20260911
          fetch-depth: 0

      - name: Register Sunforge shows and validate package
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re

          root = pathlib.Path('.')
          base = root / 'data/shows/sunforge-outlaw-s1'
          required = ['characters.json','settings.json','regions.json','factions.json','mood.json','lighting.json','negatives.json','blocking.json','dialogue.json','direction.json','pages_base.json','series.json','pages_e01.json','pages_e02.json','pages_e03.json','pages_e04.json']
          for name in required:
              p = base / name
              if not p.exists():
                  raise SystemExit(f'missing {p}')
              json.loads(p.read_text())

          characters = json.loads((base/'characters.json').read_text())
          settings = json.loads((base/'settings.json').read_text())
          regions = json.loads((base/'regions.json').read_text())
          expected_counts = {1:7, 2:6, 3:6, 4:6}
          seen = set()
          for issue, count in expected_counts.items():
              pages = json.loads((base/f'pages_e0{issue}.json').read_text())
              if len(pages) != count:
                  raise SystemExit(f'issue {issue}: expected {count} pages, got {len(pages)}')
              for n, page in enumerate(pages, 1):
                  expected_id=f'SUN_S1E0{issue}_P{n:02d}'
                  if page.get('id') != expected_id:
                      raise SystemExit(f'bad page id {page.get("id")} != {expected_id}')
                  if page.get('unit') != 'PAGE' or page.get('issue') != issue or page.get('page') != n:
                      raise SystemExit(f'bad page metadata {expected_id}')
                  if page['id'] in seen:
                      raise SystemExit(f'duplicate id {page["id"]}')
                  seen.add(page['id'])
                  if not page.get('summary') or not page.get('panelPlan'):
                      raise SystemExit(f'missing story data {expected_id}')
                  if page.get('setting') not in settings:
                      raise SystemExit(f'unknown setting {page.get("setting")} in {expected_id}')
                  if page.get('region') not in regions:
                      raise SystemExit(f'unknown region {page.get("region")} in {expected_id}')
                  missing=[c for c in page.get('characters',[]) if c not in characters]
                  if missing:
                      raise SystemExit(f'unknown characters {missing} in {expected_id}')
                  dumped=json.dumps(page).lower()
                  for banned in ('aigenerated','generationlog','creative development notes','content generation standard'):
                      if banned in dumped:
                          raise SystemExit(f'contamination token {banned} in {expected_id}')

          if len(seen) != 25:
              raise SystemExit(f'expected 25 unique pages, got {len(seen)}')

          shows_path = root / 'data/shows.json'
          shows = json.loads(shows_path.read_text())
          ids = {f'sunforge-outlaw-s1-e0{i}' for i in range(1,5)}
          shows = [s for s in shows if s.get('id') not in ids]
          generation = ('Finished full-color portrait interior story comic page for Sunforge Outlaw. '
              'Grounded frontier science-fiction western under harsh Sunfields light: tactile dust, leather, oxidized metal, practical machinery, natural human acting, strong silhouettes, varied sequential composition, and professional integrated lettering. '
              'Preserve scripted panel order, recurring character identity, physical geography, causal action, and exact dialogueInline. '
              'Sunforges and identity refraction remain observed phenomena rather than explanatory spectacle. Interior story page only; no cover, promotional, dossier, infographic, or generic cyberpunk framing unless explicitly scripted. Fictional production.')
          labels = {1:'Issue 1 — Dust on the Lens',2:'Issue 2 — Dead Weight in the Basin',3:'Issue 3 — A Shadow on the Glass',4:'Issue 4 — The Edge of the Sunfields'}
          for i in range(1,5):
              shows.append({
                  'id': f'sunforge-outlaw-s1-e0{i}',
                  'name': f'Sunforge Outlaw — {labels[i]}',
                  'seriesId':'sunforge-outlaw',
                  'seriesName':'Sunforge Outlaw',
                  'issueLabel':labels[i],
                  'basePath':'data/shows/sunforge-outlaw-s1',
                  'scenesFile':'pages_base.json',
                  'unitLabel':'PAGE',
                  'generationLine':generation,
                  'sceneOverlays':[{'file':f'pages_e0{i}.json'}]
              })
          shows_path.write_text(json.dumps(shows, indent=2, ensure_ascii=False) + '\n')

          check=json.loads(shows_path.read_text())
          got=[s for s in check if s.get('seriesId')=='sunforge-outlaw']
          if len(got) != 4:
              raise SystemExit(f'expected 4 registered Sunforge issues, got {len(got)}')
          print('Sunforge validation PASS: 4 issues, 25 pages, all references resolve.')
          PY
          git diff --check

      - name: Commit registry and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/ingest-sunforge-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shows.json .github/workflows/ingest-sunforge-finalize.yml
          git commit -m 'Register and validate Sunforge Outlaw ingest'
          git push origin HEAD:ingest-sunforge-outlaw-20260911
