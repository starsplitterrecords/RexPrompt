name: Validate Rex Fleet Academy — Between the Beacons

on:
  pull_request:
    paths:
      - 'data/shows.json'
      - 'data/shows/rex-fleet-academy-between-beacons/**'
      - 'data/shows/rex-fleet-s1/characters.json'
      - 'production/references/rex-fleet-academy-between-beacons/**'
      - 'tools/validate_rex_fleet_academy_between_beacons.py'
      - '.github/workflows/validate-rex-fleet-academy-between-beacons.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Between the Beacons
        run: python tools/validate_rex_fleet_academy_between_beacons.py
