name: Apply Backyard Rockets page-specific visual polish
on:
  push:
    branches:
      - fix/backyard-rockets-chef-visual-specificity-20260911
    paths:
      - '.github/workflows/apply-backyard-rockets-page-specific-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backyard-rockets-chef-visual-specificity-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply page-specific visual recipes
        run: python tools/_temp_rockets_visual_recipe_polish.py
      - name: Validate Rockets production state
        shell: bash
        run: |
          python tools/validate_backyard_rockets_sanitization.py
          python tools/validate_backyard_rockets.py
          python tools/audit_backyard_rockets_continuity.py
          git diff --check
      - name: Read back representative page recipes
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          base=Path('data/shows/backyard-rockets-s1')
          shows=json.loads(Path('data/shows.json').read_text())
          show=next(x for x in shows if x.get('id')=='backyard-rockets-s1')
          samples={'BR_S1E05_A02_SC01','BR_S1E06_A02_SC02','BR_S1E07_A03_SC03','BR_S1E08_A02_SC06','BR_S1E08_A03_SC05','BR_S1E08_A03_SC07'}
          found={}
          for ov in show.get('sceneOverlays',[]):
            if ov.get('encoding')!='gzip-base64': continue
            p=base/ov['file']; obj=json.loads(gzip.decompress(base64.b64decode(''.join(p.read_text().split()))).decode())
            rows=obj.get('scenes',obj) if isinstance(obj,dict) else obj
            for s in rows:
              if s.get('id') in samples: found[s['id']]=s
          if set(found)!=samples: raise SystemExit('Missing readback sample')
          for sid in sorted(found):
            s=found[sid]
            print('\n===',sid,'===')
            print('SUMMARY:',s.get('summary'))
            for i,p in enumerate(s.get('panelPlan') or [],1): print(f'P{i}:',p)
            print('DIRECTION:',s.get('directionInline'))
            for d in s.get('dialogueInline',[]) or []: print('DIALOGUE:',d.get('speaker'),d.get('text'))
          PY
      - name: Commit only production changes
        shell: bash
        run: |
          rm -f tools/_temp_rockets_visual_recipe_polish.py
          rm -f .github/workflows/apply-backyard-rockets-page-specific-polish.yml
          rm -f backyard-rockets-continuity-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+starsplitterrecords@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Replace Rockets compiler prose with page-specific staging"
          git push origin HEAD:fix/backyard-rockets-chef-visual-specificity-20260911
