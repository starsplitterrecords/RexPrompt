name: Validate Star Splitter Prequel data

on:
  pull_request:
    paths:
      - 'index.html'
      - 'data/shows.json'
      - 'data/scenes_prequel.json'
      - 'data/characters.json'
      - 'data/dialogue.json'
      - 'data/settings.json'
      - 'data/factions.json'
      - 'data/regions.json'
      - 'data/shows/star-splitter-prequel/**'
      - 'data/shows/rex-fleet-s1/characters.json'
      - 'production/references/star-splitter-prequel/**'
      - 'tools/validate_star_splitter_prequel.py'
      - '.github/workflows/validate-star-splitter-prequel.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Star Splitter Prequel
        run: python tools/validate_star_splitter_prequel.py
