name: Validate Sunforge naming normalization
# rerun after residue cleanup

on:
  push:
    branches: [normalize-sunforge-names-20260918]
    paths:
      - '.github/workflows/validate-sunforge-names.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: normalize-sunforge-names-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Sunforge identities
        run: |
          python - <<'PY'
          import json, pathlib, re
          base=pathlib.Path('data/shows/sunforge-outlaw-s1')
          chars=json.loads((base/'characters.json').read_text())
          expected=[
            "Brandon Mack","Eva O'Learly","Jessie Petrescu","Samuel Hayes","Isabella Torres",
            "Marcus Kovacs","Ray Silvestro","Raina James","Dylan Sheets","Marty Francis",
            "Mary Bell","Owen Bell","Ada Rowan","Rachael Hughes","Kayla Simmons","Alec Damon"
          ]
          names={c.get('name') for c in chars.values()}
          for n in expected:
            assert n in names, n
          counts={}
          all_ids=set()
          for issue in range(1,13):
            pages=json.loads((base/f'pages_e{issue:02d}.json').read_text())
            counts[issue]=len(pages)
            for p in pages:
              assert p['id'] not in all_ids, p['id']
              all_ids.add(p['id'])
              missing=set(p.get('characters',[]))-set(chars)
              assert not missing, (p['id'], missing)
          assert counts[1]==22, counts
          assert all(counts[i]==6 for i in range(2,13)), counts
          assert sum(counts.values())==88, counts
          retired=[
            r'\bKael\b',r'\bJessa\b',r'\bIsabelle\b',r'\bVeyra\b',r'\bVarnok\b',
            r'\bSaye\b',r'\bMerrit\b',r'\bArchitect\b',r'\bElias\b',r'\bDarrow\b',
            r'\bKeene\b',"Eva O'Leary",'Baird Rook','Mara Bell','Renna Iles','Mira Sloan','Pell Oren',
            'C_sun_kael','C_sun_jessa','C_sun_isabelle','C_sun_veyra','C_sun_baird_rook',
            'C_sun_mara_bell','C_sun_renna_iles','C_sun_mira_sloan','C_sun_pell_oren'
          ]
          text='\n'.join(p.read_text() for p in base.glob('*.json'))
          for pat in retired:
            assert not re.search(pat,text), pat
          e1=json.loads((base/'pages_e01.json').read_text())
          e4=json.loads((base/'pages_e04.json').read_text())
          e6=json.loads((base/'pages_e06.json').read_text())
          assert any('Jessie said BRANDON' in d.get('text','') for d in e1[3]['dialogueInline'])
          assert 'genuinely accidental' in e1[3]['directionInline'][0]['text']
          assert 'Not mine' in ' '.join(d.get('text','') for d in e4[3]['dialogueInline'])
          assert 'One Mistake, Twenty Stories' == e6[2]['title']
          print('Sunforge naming validation passed:', counts)
          PY
      - name: Build production review PDFs
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.2.5
          python tools/export_review_pdfs.py --out dist/review-pdfs
