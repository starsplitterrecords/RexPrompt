jobs:
  page-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check prompt-suppress.js
          node --check tools/test_prompt_assembly.cjs
          node --check tools/test_editorial_page_scopes.cjs
          node --check tools/test_rex_fleet_issue04_density.cjs
          node --check tools/test_rex_fleet_issue05_density.cjs
          node --check tools/test_page_layout.cjs
          node --check tools/test_sunforge_page_layouts.cjs
          node --check tools/test_sunforge_all_layouts.cjs
          node --check tools/test_sunforge_recipe_sanitation.cjs
          node --check tools/test_azure_page_layouts.cjs
          node --check tools/test_backyard_rockets_layouts.cjs
          node --check tools/test_low_tide_page_layout.cjs
          node --check tools/test_low_tide_dialogue_overlay.cjs
          node --check tools/test_stardust_e02_layouts.cjs
          node --check tools/test_stardust_e02_density_scope.cjs
      - name: Test assembled page content
        run: |
          node tools/test_prompt_assembly.cjs
          node tools/test_editorial_page_scopes.cjs
          node tools/test_rex_fleet_issue04_density.cjs
          node tools/test_rex_fleet_issue05_density.cjs
          node tools/test_page_layout.cjs
          node tools/test_sunforge_page_layouts.cjs
          node tools/test_sunforge_all_layouts.cjs
          node tools/test_sunforge_recipe_sanitation.cjs
          node tools/test_azure_page_layouts.cjs
          node tools/test_backyard_rockets_layouts.cjs
          node tools/test_low_tide_page_layout.cjs
          node tools/test_low_tide_dialogue_overlay.cjs
          node tools/test_stardust_e02_layouts.cjs
          node tools/test_stardust_e02_density_scope.cjs
