name: Apply Stardust Sanitization

on:
  push:
    branches:
      - 'sanitize/stardust-station'
    paths:
      - 'tools/sanitize_stardust_station.py'
      - '.github/workflows/apply-stardust-sanitization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize/stardust-station
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply sanitization
        run: python tools/sanitize_stardust_station.py
      - name: Commit sanitized data
        run: |
          if git diff --quiet; then
            echo "No sanitization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/stardust-station
          git commit -m "Sanitize Stardust Station production data"
          git push origin HEAD:sanitize/stardust-station
