name: Temporary Azure Reach Chef Cleanup

on:
  push:
    paths:
      - '.github/workflows/tmp-azure-chef-fix.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/azure-reach-chef-layer-20260910
      - name: Remove writing doctrine from chef-facing Azure Reach recipes
        shell: python
        run: |
          import base64, gzip, json, pathlib, re
          root=pathlib.Path('data/shows/azure-reach-s1')
          banned={'AZR_DRAMATIC_ENGINE','AZR_ENVIRONMENT_ABUNDANCE','AZR_PARK_STAGING','AZR_SOFT_ENV_CONTINUITY'}

          # Planning doctrine stays in season_one_plan.json. It must not be an assembler direction block.
          dpath=root/'direction.json'
          directions=json.loads(dpath.read_text())
          for k in banned: directions.pop(k,None)
          dpath.write_text(json.dumps(directions,indent=2,ensure_ascii=False)+'\n')

          # Keep show-level instructions strictly image-production oriented for unreleased Issues 3-6.
          spath=pathlib.Path('data/shows.json')
          shows=json.loads(spath.read_text())
          visual_line=('Finished full-color portrait interior story comic page for Azure Reach. Bright, polished, extremely high-end contemporary marine-park visual language with luminous water, elegant glass-and-stone architecture, credible animal habitats, natural character acting, cinematic sequential composition, and clean professional integrated lettering. Use released Azure Reach Issue 1 as strict visual canon for established character identity and rendering language. Preserve scripted panel count, panel order, setting, physical geography, animal behavior, continuity, and exact lettering. Interior story page only; no cover, promotional, dossier, or infographic framing unless explicitly scripted.')
          for show in shows:
              if show.get('id') in {f'azure-reach-s1-e0{i}' for i in range(3,7)}:
                  show['generationLine']=visual_line
          spath.write_text(json.dumps(shows,indent=2,ensure_ascii=False)+'\n')

          # New park settings remain available, but describe only what the image should depict.
          pure={
            'AZR_LagoonPromenade':'LAGOON PROMENADE — Broad sunlit water-edge walk with layered blue pools, palms and coastal planting, premium seating, families and staff in motion, and long sightlines into multiple habitats.',
            'AZR_ReefGallery':'CORAL REEF GALLERY — Monumental jewel-bright reef window with dense tropical fish, living-coral forms, shafts of blue light, reflective stone and quiet luxury seating.',
            'AZR_KelpWalk':'KELP FOREST WALK — Tall cool-blue gallery beside a towering kelp habitat, with shark silhouettes, schooling fish, swaying kelp, public benches and clean staff access.',
            'AZR_TidepoolTerrace':'TIDEPOOL TERRACE — Open-air and glass-edged terrace overlooking tidepool habitats and coastal planting, with shaded premium seating, educator stations and broad public circulation.',
            'AZR_RayOverlook':'RAY OVERLOOK — Elevated public edge above a sweeping ray and skate habitat, with broad water reflections, elegant railings, guest sightlines and screened keeper access.',
            'AZR_ConservationGarden':'CONSERVATION WATER GARDEN — Lush public garden of mangroves, reeds, freshwater planting, recirculating streams and interpretive water features integrated into polished park landscaping.',
            'AZR_GalaPromenade':'GALA PROMENADE — Azure Reach main glass-and-water public spine dressed for a prestige evening with projection on glass, restrained hospitality, open habitat sightlines and expensive event detail.',
            'AZR_CoralGrandHall':'CORAL GRAND HALL — Vast multi-story tropical reef panorama with thousands of small reef fish, dramatic coral architecture, reflective stone, discrete donor seating and generous public circulation.',
            'AZR_TropicalReefArcade':'TROPICAL REEF ARCADE — Sequence of jewel-box reef windows with different tropical fish communities, coral forms, water depths and lighting moods.',
            'AZR_JellyGallery':'JELLYFISH GALLERY — Luminous low-light gallery of large cylindrical and wall-scale jelly displays, elegant seating, slow colored reflections and clearly readable faces.',
            'AZR_PelagicTunnel':'PELAGIC TUNNEL — Long transparent tunnel through an open-ocean habitat with schooling sardines or mullet, large pelagic fish and occasional tuna-like silhouettes overhead.',
            'AZR_SharkGallery':'SHARK GALLERY — Expansive deep-water window and tunnel system with varied sharks, skates and rays, strong open-water depth and sparse high-end architecture framing the animal scale.',
            'AZR_ArcticBeluga':'ARCTIC / BELUGA WING — Bright ice-toned water galleries for belugas and Arctic marine interpretation, with pale stone, cool daylight, underwater viewing and warm guest refuge spaces.',
            'AZR_SeaLionCove':'SEA LION COVE — Large indoor-outdoor coastal habitat with rockwork, deep blue water, haul-out areas, broad public viewing edges and clean keeper access.',
            'AZR_OtterHabitat':'OTTER RIVER HABITAT — Lush stream-and-pool environment with underwater windows, planted banks, rock shelves, clear water and energetic otters.',
            'AZR_SeahorseConservatory':'SEAHORSE CONSERVATORY — Intimate high-design gallery of seahorses, pipefish, seagrasses and delicate aquatic plants, with magnified viewing and botanical-display detailing.',
            'AZR_RainforestFishHall':'RAINFOREST FISH HALL — Warm planted freshwater gallery with flooded-root habitats, piranhas and other tropical freshwater fish, humid greenery and dramatic blackwater river displays.',
            'AZR_PiranhaGallery':'PIRANHA GALLERY — Refined freshwater exhibit with dense planted river habitat, dark root forms, warm filtered light and a naturally schooling group of piranhas.',
            'AZR_FreshwaterRivers':'FRESHWATER RIVERS HALL — Long bright sequence of river habitats from cold-water streams to broad freshwater systems, with visible current, rock, wood, plants and region-specific fish.',
            'AZR_TroutStream':'TROUT STREAM PAVILION — Crystal-clear cold-water run with varied trout, submerged stone, fast current, rippled light and an overhead garden canopy.',
            'AZR_SchoolingFishCylinder':'SCHOOLING FISH CYLINDER — Towering cylindrical habitat filled with coordinated sardines, mullet or similar schooling fish whose shifting formation fills the vertical water column.',
            'AZR_OpenOceanHall':'OPEN OCEAN HALL — Immense blue-water viewing room for pelagic species, with fast schooling fish, larger yellowfin- and skipjack-like silhouettes, sparse architecture and premium seating.',
            'AZR_UnderwaterDining':'UNDERWATER DINING ROOM — High-end restaurant with floor-to-ceiling habitat glass, quiet table spacing, elegant service and naturally moving marine life beyond the windows.',
            'AZR_DonorLounge':'DONOR LOUNGE — Discreet luxury hospitality space open to a major habitat view, with excellent furniture, restrained service, polished finishes and broad glass sightlines into the park.',
            'AZR_VIPArrivalCourt':'VIP ARRIVAL COURT — Polished private arrival terrace off the main public approach, with water, planting, hosts, premium finishes and glimpses of nearby habitats.',
            'AZR_PremiumTerrace':'PREMIUM OBSERVATION TERRACE — Comfortable high-end viewing terrace overlooking multiple aquatic spaces, with quiet seating, discreet hospitality service and unobstructed animal sightlines.',
            'AZR_MangroveWalk':'MANGROVE WALK — Immersive brackish-water corridor through mangrove roots, shallow fish habitats, overhead and underwater sightlines, dense planting and dappled light.',
            'AZR_AquaticBotany':'AQUATIC BOTANY ATRIUM — Glass-roofed conservatory of aquatic plants, water lilies, reeds, submerged gardens and fish integrated into landscape-scale water features.',
            'AZR_CoralNursery':'CORAL NURSERY GALLERY — Public-facing viewing window onto coral propagation tables, colorful small-fish systems, clean research equipment and bright working water.',
            'AZR_TropicalFishRotunda':'TROPICAL FISH ROTUNDA — Circular sequence of vivid reef and lagoon displays with different tropical fish assemblages, coral structures and water colors in every direction.'
          }
          setpath=root/'settings.json'; settings=json.loads(setpath.read_text())
          for k,text in pure.items(): settings[k]={'text':text}
          setpath.write_text(json.dumps(settings,indent=2,ensure_ascii=False)+'\n')

          replacements={
            'No conference table.':'Families, water and habitat sightlines fill the space around the moving group.',
            'The park, not a board, supplies the evidence.':'A guest near the dolphin entrance supplies the visible evidence while the habitat remains in view.',
            'no presentation screen dominates the composition.':'the reef window dominates the composition.',
            "without turning it into a branded 'system.' Tropical fish and moving guests remain visible, making the solution spatial and social rather than conference-room logic.":'as tropical fish and moving guests continue behind the group; the promenade geometry visibly separates the experience from the souvenir.',
            'Do not stage a debrief table or lesson board.':'The school of fish and moving kelp remain the dominant background.',
            'without a conference-room dashboard or APPROVED stamp dominating the page.':'with the surrounding habitat and staff activity remaining visually dominant.',
            'no sealed conference-room composition.':'with the Arctic habitat view filling the background.',
            'rather than huddling around a board;':'as'
          }
          stale='Track wristbands, session clocks, staff radios, visitor routes, access markers, sponsor materials, microscope feed, tidepool rest/rotation state and all public/staff boundaries precisely. '
          changed_files=[]; used_settings=set()
          for p in sorted((root/'encoded').glob('*.json.gzb64')):
              raw=gzip.decompress(base64.b64decode(p.read_text().strip())).decode()
              data=json.loads(raw); changed=False
              pages=data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  pid=str(page.get('id',''))
                  if not re.match(r'^AZR_S1E0[2-6]_P\d{2}$',pid): continue
                  old=page.get('direction',[])
                  new=[x for x in old if x not in banned]
                  if new!=old: page['direction']=new; changed=True
                  if pid.startswith('AZR_S1E05_'):
                      for item in page.get('directionInline') or []:
                          if isinstance(item,dict) and isinstance(item.get('text'),str) and stale in item['text']:
                              item['text']=item['text'].replace(stale,''); changed=True
                  for field in ('summary',):
                      if isinstance(page.get(field),str):
                          s=page[field]
                          for a,b in replacements.items(): s=s.replace(a,b)
                          if s!=page[field]: page[field]=s; changed=True
                  if isinstance(page.get('panelPlan'),list):
                      newplan=[]
                      for item in page['panelPlan']:
                          if isinstance(item,str):
                              s=item
                              for a,b in replacements.items(): s=s.replace(a,b)
                              newplan.append(s)
                          elif isinstance(item,dict) and isinstance(item.get('text'),str):
                              q=dict(item); s=q['text']
                              for a,b in replacements.items(): s=s.replace(a,b)
                              q['text']=s; newplan.append(q)
                          else: newplan.append(item)
                      if newplan!=page['panelPlan']: page['panelPlan']=newplan; changed=True
                  if page.get('setting'): used_settings.add(page['setting'])
              if changed:
                  encoded=base64.b64encode(gzip.compress((json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n').encode(),mtime=0)).decode()
                  p.write_text(encoded+'\n'); changed_files.append(str(p))

          # Permanent mechanical guard: writing/planning doctrine must not leak back into chef-facing recipe fields.
          vpath=pathlib.Path('tools/validate_azure_reach.py'); v=vpath.read_text()
          marker='directions = load(SHOW / "direction.json")\n'
          guard='''directions = load(SHOW / "direction.json")\n\n# Chef-layer separation: writing/planning doctrine belongs outside assembled image recipes.\nNON_IMAGE_DIRECTION_KEYS = {\n    "AZR_DRAMATIC_ENGINE", "AZR_ENVIRONMENT_ABUNDANCE",\n    "AZR_PARK_STAGING", "AZR_SOFT_ENV_CONTINUITY",\n}\nassert not (NON_IMAGE_DIRECTION_KEYS & set(directions)), "Writing/planning doctrine leaked into direction.json"\nCHEF_META_TERMS = ("process-improvement", "workflow optimization", "KPI repair", "scalable process", "do not default conversations")\n'''
          if 'NON_IMAGE_DIRECTION_KEYS' not in v: v=v.replace(marker,guard)
          needle='    assert isinstance(entry.get("generationLine"), str) and entry["generationLine"].strip(), f"{show_id}: missing generationLine"\n'
          add=needle+'    assert not any(term.lower() in entry["generationLine"].lower() for term in CHEF_META_TERMS), f"{show_id}: writing/planning language leaked into generationLine"\n'
          if 'writing/planning language leaked into generationLine' not in v: v=v.replace(needle,add)
          needle2='        assert len(direction_refs) == len(set(direction_refs)), f"{page_id}: duplicate direction refs"\n'
          add2=needle2+'        assert not (NON_IMAGE_DIRECTION_KEYS & set(direction_refs)), f"{page_id}: non-image direction leaked into chef recipe"\n'
          if 'non-image direction leaked into chef recipe' not in v: v=v.replace(needle2,add2)
          vpath.write_text(v)

          # Temporary deep assertions over the corrected payload.
          assert len(used_settings) >= 30, f'Expected broad recipe-level park variety; saw {len(used_settings)} settings'
          assert not (banned & set(json.loads(dpath.read_text())))
          for p in sorted((root/'encoded').glob('*.json.gzb64')):
              data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode())
              pages=data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  pid=str(page.get('id',''))
                  if not re.match(r'^AZR_S1E0[2-6]_P\d{2}$',pid): continue
                  assert not (banned & set(page.get('direction',[]))), pid
                  text=json.dumps(page,ensure_ascii=False).lower()
                  for bad in ('no conference table','not a board','conference-room logic','do not stage a debrief table','conference-room dashboard','no sealed conference-room','huddling around a board'):
                      assert bad not in text, (pid,bad)
                  if pid.startswith('AZR_S1E05_'):
                      for bad in ('wristbands','microscope feed','tidepool rest/rotation'):
                          assert bad not in text, (pid,bad)
          print('Changed encoded files:', len(changed_files))
          print('Distinct settings actively used in Issue 2-6 recipes:', len(used_settings))
      - name: Validate Azure Reach
        run: python tools/validate_azure_reach.py
      - name: Commit cleanup and remove temporary audit tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name starsplitterrecords
          git config user.email 77013062+starsplitterrecords@users.noreply.github.com
          git rm -f .github/workflows/tmp-azure-chef-audit.yml .github/workflows/tmp-azure-chef-fix.yml
          git add data/shows.json data/shows/azure-reach-s1/direction.json data/shows/azure-reach-s1/settings.json data/shows/azure-reach-s1/encoded tools/validate_azure_reach.py
          git commit -m 'Keep Azure Reach writing doctrine out of image recipes'
          git push origin HEAD:fix/azure-reach-chef-layer-20260910
