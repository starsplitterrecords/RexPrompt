name: Stardust generic staging audit

on:
  push:
    branches:
      - fix/stardust-visual-first-final2-20260911
    paths:
      - .github/workflows/stardust-generic-staging-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stardust-visual-first-final2-20260911
      - name: Locate residual generic staging
        run: |
          grep -Rn -E 'expression readable and eyeline directed toward the others|chassis or display turns toward the crew|Medium close on the Operations Liaison on the live call' data/shows/stardust-station/pages_e*.json || true
