name: IMG Readback Rex Fleet P04
on:
  push:
    branches:
      - img-readback-rex-fleet-p04-20261023
    paths:
      - .github/workflows/img-readback-rex-fleet-p04-20261023.yml
permissions:
  contents: read
jobs:
  exact-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact approved predecessor pixels
        run: |
          set -euo pipefail
          mkdir -p image-readback
          cp production/drafts/rex-fleet/rex-fleet-i01/rf_i01_p04.png image-readback/rf_i01_p04.png
          sha256sum image-readback/rf_i01_p04.png > image-readback/sha256.txt
      - name: Upload exact image
        uses: actions/upload-artifact@v4
        with:
          name: rex-fleet-i01-p04-readback
          path: image-readback/
          if-no-files-found: error
          retention-days: 1
