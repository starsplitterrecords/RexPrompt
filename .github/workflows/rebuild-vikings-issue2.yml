name: Rebuild Vikings Issue 2 payload

on:
  push:
    branches:
      - recover/vikings-2026-issue-02

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover/vikings-2026-issue-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect surviving page context
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          root = Path('data/shows/vikings-2026-s1/encoded')
          for name in ['pages_i02_p01_p06.json.gzb64','pages_i02_p13_p18.json.gzb64','pages_i02_p19_p24.json.gzb64']:
              encoded = ''.join((root / name).read_text(encoding='utf-8').split())
              pages = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8'))
              print('===', name, '===')
              for page in pages:
                  print(page['id'], '|', page.get('title'), '|', page.get('summary'))
                  for line in page.get('dialogueInline', []):
                      print('  ', line.get('characterHandle'), ':', line.get('text'))
          PY
