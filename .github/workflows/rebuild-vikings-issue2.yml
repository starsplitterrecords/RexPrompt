name: Rebuild Vikings Issue 2 payload

on:
  push:
    branches:
      - recover/vikings-2026-issue-02

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover/vikings-2026-issue-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect recipe schema
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          root = Path('data/shows/vikings-2026-s1/encoded')
          for name, index in [('pages_i02_p01_p06.json.gzb64', 5), ('pages_i02_p13_p18.json.gzb64', 0)]:
              encoded = ''.join((root / name).read_text(encoding='utf-8').split())
              pages = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8'))
              print(json.dumps(pages[index], ensure_ascii=False, indent=2))
          PY
