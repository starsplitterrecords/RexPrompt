name: Temporary Azure Reach Final Chef Audit

on:
  push:
    paths:
      - '.github/workflows/tmp-azure-final-chef-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/azure-reach-chef-boundary-20260910
      - name: Audit assembler-visible Azure Reach recipe content
        shell: python
        run: |
          import base64, gzip, json, pathlib, re, collections
          root=pathlib.Path('data/shows/azure-reach-s1')
          shows=json.loads(pathlib.Path('data/shows.json').read_text())
          settings=json.loads((root/'settings.json').read_text())
          directions=json.loads((root/'direction.json').read_text())
          characters=json.loads((root/'characters.json').read_text())
          targets={f'azure-reach-s1-e0{i}' for i in range(2,7)}
          bad_phrases=[
            'institutional learning','beatrice\'s growth','finale\'s lesson','causal season-finale',
            'carry forward issue','do not reset','proof-of-system page','operational restraint',
            'dramatic engine','environmental abundance','soft environment continuity','prefer conversations',
            'workflow optimization','process-improvement','scalable process','conference-room logic',
            'no conference table','not a board','do not default conversations'
          ]
          stale_e5=['wristbands','microscope feed','tidepool rest/rotation']
          report=[]; hits=[]; by_issue=collections.defaultdict(list); setting_counts=collections.Counter()
          def text_of(x):
              if isinstance(x,str): return x
              if isinstance(x,dict): return x.get('text') or x.get('summary') or x.get('name') or json.dumps(x,ensure_ascii=False)
              return str(x)
          for show in shows:
              if show.get('id') not in targets: continue
              issue=int(show['id'][-1])
              pages=[]
              for ov in show.get('sceneOverlays',[]):
                  raw=base64.b64decode((root/ov['file']).read_text().strip())
                  data=json.loads(gzip.decompress(raw).decode())
                  pages += data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  pid=page['id']; setting=page.get('setting')
                  setting_counts[setting]+=1; by_issue[issue].append(setting)
                  chunks=[show.get('generationLine',''), page.get('summary','')]
                  if setting in settings: chunks.append(text_of(settings[setting]))
                  for c in page.get('charactersInline') or []:
                      h=c.get('handle')
                      e=next((v for v in characters.values() if v.get('handle')==h),None)
                      if e and e.get('visualAnchor'): chunks.append(e['visualAnchor'])
                  chunks += [text_of(x) for x in page.get('panelPlan') or []]
                  for k in page.get('direction') or []:
                      if k in directions: chunks.append(text_of(directions[k]))
                  chunks += [text_of(x) for x in page.get('directionInline') or []]
                  assembled_non_dialogue='\n'.join(chunks).lower()
                  local=[]
                  for phrase in bad_phrases:
                      if phrase in assembled_non_dialogue: local.append(phrase)
                  if issue==5:
                      for phrase in stale_e5:
                          if phrase in assembled_non_dialogue: local.append(phrase)
                  if local: hits.append({'id':pid,'hits':sorted(set(local))})
                  report.append({'id':pid,'setting':setting,'direction':page.get('direction') or [],'directionInline':page.get('directionInline') or []})
          assert not hits, json.dumps(hits[:20],indent=2)
          assert len(report)==110, len(report)
          unique_all=set(r['setting'] for r in report)
          lines=[f'pages={len(report)}',f'unique_settings_all={len(unique_all)}',f'meta_or_stale_hits={len(hits)}']
          for issue in range(2,7):
              vals=by_issue[issue]
              uniq=sorted(set(vals))
              lines.append(f'issue_{issue}_pages={len(vals)} unique_settings={len(uniq)}')
              lines.append('  '+', '.join(uniq))
          roomish=[r for r in report if any(t in (r['setting'] or '').lower() for t in ('ops','meeting','control','suite','backstagehuddle'))]
          lines.append(f'roomish_pages={len(roomish)}')
          lines += [f"  {r['id']} -> {r['setting']}" for r in roomish]
          lines.append('top_settings:')
          lines += [f'  {k}: {v}' for k,v in setting_counts.most_common()]
          pathlib.Path('final-audit.txt').write_text('\n'.join(lines)+'\n')
          pathlib.Path('final-page-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('\n'.join(lines[:15]))
      - uses: actions/upload-artifact@v4
        with:
          name: azure-final-chef-audit
          path: |
            final-audit.txt
            final-page-report.json
          if-no-files-found: error
          retention-days: 1
