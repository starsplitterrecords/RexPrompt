name: Sunforge reconciled script pass v2
on:
  push:
    branches:
      - sunforge-script-reconciled-20260914
permissions:
  contents: write
jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunforge-script-reconciled-20260914
          fetch-depth: 0
      - name: Apply reconciled editorial pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('data/shows/sunforge-outlaw-s1')
          files = {}
          for n in (8,10,11,12):
              p = base / f'pages_e{n:02d}.json'
              files[n] = (p, json.loads(p.read_text()))

          def page(issue, page_id):
              return next(x for x in files[issue][1] if x['id'] == page_id)

          def change(issue, page_id, speaker, old, new):
              pg = page(issue, page_id)
              hits = [x for x in pg.get('dialogueInline', []) if x.get('speaker') == speaker and x.get('text') == old]
              if len(hits) != 1:
                  raise RuntimeError(f'{page_id}: {speaker} {old!r} hits={len(hits)}')
              hits[0]['text'] = new

          # Issue 8 — normal spoken English while preserving the gradual uncanny turn.
          change(8,'SUN_S1E08_P01','Eva','Rider. South ridge.',"There's a rider on the south ridge.")
          change(8,'SUN_S1E08_P01','Jessa','A mile. Maybe less.','About a mile. Maybe a little less.')
          change(8,'SUN_S1E08_P03','Veyra','Same profile.','It looks like the same rider.')
          change(8,'SUN_S1E08_P04','Eva','That is all you have?',"That's all you've got?")
          change(8,'SUN_S1E08_P04','Kael','We walked toward a stranger for half the day. They did not ask us to.',"We walked toward a stranger for half the day. They didn't ask us to.")
          change(8,'SUN_S1E08_P05','Veyra','Before Samuel started working ahead of Kael.','It was before Samuel started working ahead of Kael.')
          change(8,'SUN_S1E08_P06','Eva','You really do not?',"You really don't?")

          # Issue 10 — keep the breadth/depth idea in the scene, not as a thesis recitation.
          change(10,'SUN_S1E10_P01','Kael','That is a broad category.',"That's a pretty broad category.")
          change(10,'SUN_S1E10_P01','Jessa','You are becoming exhausting.',"You're going to wear me out.")
          change(10,'SUN_S1E10_P02','Jessa','You see the mask. He sees his cousin.',"We've been here five minutes and you've already turned his cousin into evidence.")
          change(10,'SUN_S1E10_P02','Baird Rook','Exactly.','I like her.')
          change(10,'SUN_S1E10_P03','Eva','So we will not know whether it is new.',"So we won't know whether it's new.")
          page(10,'SUN_S1E10_P05')['dialogueInline'] = [
              {'speaker':'Eva','text':'Who told you something was happening here?'},
              {'speaker':'Dylan','text':'Mara at South Cut.'},
              {'speaker':'Baird Rook','text':'Mara heard it from Len.'},
              {'speaker':'Samuel','text':'Len told me he heard it from a caravan out of Bellweather.'},
              {'speaker':'Veyra','text':'Bellweather heard about us after we left.'},
              {'speaker':'Jessa','text':'So the story is feeding itself now.'},
              {'speaker':'Samuel','text':'Parts of it. One person hears something, tells the next person, and by the time it reaches us it looks new.'},
              {'speaker':'Eva','text':'Then how do we know what actually started somewhere?'},
              {'speaker':'Samuel','text':"We don't. Not yet."},
              {'speaker':'Kael','text':'Is there any supper left?'},
              {'speaker':'Baird Rook','text':'Plenty.'},
              {'speaker':'Kael','text':'Then something interesting did happen.'},
          ]

          # Issue 11 — naturalize Jessa/Renna and let Kael begin asking rather than only answering.
          change(11,'SUN_S1E11_P02','Jessa','That is not flattering.',"That's not flattering.")
          change(11,'SUN_S1E11_P02','Jessa','Do not encourage her.',"Don't encourage her.")
          change(11,'SUN_S1E11_P03','Jessa','That is not a crime.',"That's not a crime.")
          change(11,'SUN_S1E11_P03','Renna Iles','I did not say it was.',"I didn't say it was.")
          change(11,'SUN_S1E11_P03','Jessa','Do not make me regret it.',"Don't make me regret it.")
          change(11,'SUN_S1E11_P03','Renna Iles','You like leaving before anybody can ask you to stay.','Every time things start looking permanent, you pack.')
          change(11,'SUN_S1E11_P03','Jessa','I like my decisions belonging to me.','I like deciding when I stay and when I go.')
          change(11,'SUN_S1E11_P03','Renna Iles','Those are not always different things.',"I'm not saying you're wrong. I'm saying you do it every time.")
          change(11,'SUN_S1E11_P04','Kael',"That doesn't mean I need to hand them to her like they are facts.","That doesn't mean I need to hand them to her like they're facts.")
          change(11,'SUN_S1E11_P05','Eva','That is the short answer.',"That's the short answer.")
          change(11,'SUN_S1E11_P05','Jessa','It is also true.',"It's also true.")
          change(11,'SUN_S1E11_P05','Eva','Renna thinks that is the same thing.',"Renna thinks that's the same thing.")
          pg = page(11,'SUN_S1E11_P06')
          pg['panelPlan'][2]['text'] = 'Kael asks Jessa whether she wants to stay instead of deciding for her; Eva lets the answer stand without turning it into a theory.'
          pg['dialogueInline'] = [
              {'speaker':'Renna Iles','text':'Stay for supper.'},
              {'speaker':'Jessa','text':'We can make the next stop before dark.'},
              {'speaker':'Renna Iles','text':'I know.'},
              {'speaker':'Kael','text':'Do you want to stay?'},
              {'speaker':'Jessa','text':"You're not helping."},
              {'speaker':'Kael','text':'I asked a question.'},
              {'speaker':'Renna Iles','text':'I like him.'},
              {'speaker':'Jessa','text':'Of course you do.'},
              {'speaker':'Jessa','text':'One night.'},
              {'speaker':'Eva','text':"I didn't say anything."},
              {'speaker':'Jessa','text':'I know.'},
              {'speaker':'Eva','text':'I want credit for that.'},
              {'speaker':'Kael','text':'You just spent the credit.'},
              {'speaker':'Eva','text':'Worth it.'},
          ]

          # Issue 12 — Kael is known now, but he still does not become the author's moral oracle.
          change(12,'SUN_S1E12_P01','Eva','We have heard that before.',"We've heard that before.")
          change(12,'SUN_S1E12_P02','Maela Crow','I am trying.',"I'm trying.")
          change(12,'SUN_S1E12_P02','Eva','That is specific.',"That's specific.")
          change(12,'SUN_S1E12_P02','Kael',"No, ma'am. I know why you want me to be him, but I'm not. Opening his packet won't fix that.","No, ma'am. It has his name on it. Looking like him doesn't make it mine.")
          change(12,'SUN_S1E12_P03','Samuel','It does not help.',"It doesn't help.")
          page(12,'SUN_S1E12_P05')['dialogueInline'] = [
              {'speaker':'Maela Crow','text':'I wanted you to be him.'},
              {'speaker':'Kael','text':'I know.'},
              {'speaker':'Maela Crow','text':'Then I could be done.'},
              {'speaker':'Kael','text':"I can't do that for you."},
              {'speaker':'Maela Crow','text':'Then what am I supposed to do with it?'},
              {'speaker':'Kael','text':"I don't know, ma'am. Lysa isn't here to tell us."},
              {'speaker':'Maela Crow','text':"That's not very helpful."},
              {'speaker':'Kael','text':"No. But I'm not Darrow, and opening it for me won't make me him."},
              {'speaker':'Maela Crow','text':'So the choice is still mine.'},
              {'speaker':'Kael','text':'I think it always was.'},
              {'speaker':'Samuel','text':'That sounded almost pastoral.'},
              {'speaker':'Kael','text':"Don't start."},
          ]

          for issue,(p,data) in files.items():
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # Full-package mechanical integrity.
          ids=set(); total=0
          for i in range(1,13):
              p=base/f'pages_e{i:02d}.json'
              pages=json.loads(p.read_text())
              expected=7 if i==1 else 6
              if len(pages)!=expected:
                  raise RuntimeError(f'{p}: {len(pages)} != {expected}')
              for pg in pages:
                  if pg['id'] in ids:
                      raise RuntimeError(f'duplicate page id {pg["id"]}')
                  ids.add(pg['id']); total+=1
          if total!=73:
              raise RuntimeError(f'expected 73 pages, got {total}')
          print('Validated reconciled Sunforge script:', total, 'pages')
          PY
      - name: Commit pass and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sunforge-reconciled-script-pass-v2.yml
          git add data/shows/sunforge-outlaw-s1/pages_e08.json data/shows/sunforge-outlaw-s1/pages_e10.json data/shows/sunforge-outlaw-s1/pages_e11.json data/shows/sunforge-outlaw-s1/pages_e12.json
          git commit -m "Refine Sunforge script after dialogue reconciliation"
          git push origin HEAD:sunforge-script-reconciled-20260914
