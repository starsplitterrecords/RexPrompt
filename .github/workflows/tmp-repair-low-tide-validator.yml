name: Temporary repair Low Tide validator

on:
  push:
    branches:
      - repair/low-tide-normalization-2026-09-18-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Temporary repair Low Tide validator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair validator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_low_tide_img_normalization.py')
          s=p.read_text(encoding='utf-8')

          marker='''ENCODED_PAGE_FILES = (
              "pages_c04_between_runs_enhanced.json.gzb64",
              "pages_c05_return_tide_enhanced.json.gzb64",
              "pages_c06_after_the_water_enhanced.json.gzb64",
              "pages_c07_last_low_tide_enhanced.json.gzb64",
          )
          '''
          addition=marker+'''LEGACY_SCENE_PAGE_FILE = SHOW_DIR / "pages_c01_scene_pages.json"
          OBSOLETE_RECOVERY_FILES = (
              "DO-NOT-USE.txt",
              "FIXME.txt",
              "NO-MORE-TEMP.txt",
              "PAUSE.txt",
              "README-RECOVERY-TEMP.md",
              "RECOVERY.md",
              "recovered-images-note.txt",
              "recovery-binary-note.txt",
              "recovery-byte-hashes.json",
              "recovery-sequence.json",
              "recovery-status.json",
          )
          '''
          if 'LEGACY_SCENE_PAGE_FILE' not in s:
              assert marker in s
              s=s.replace(marker,addition)

          old='''        locks = item.get("continuityLocks")
                  assert isinstance(locks, list) and len(locks) >= 3, f"{cid}: continuityLocks missing or too weak"

          '''
          if old in s:
              s=s.replace(old,'')

          anchor='''        assert_no_meta(f"{cid}.promptContinuity", " ".join(map(str, prompt)))

                  assert "relationship" not in item, f"{cid}: development relationship prose is again assembler-visible"
          '''
          replacement='''        assert_no_meta(f"{cid}.promptContinuity", " ".join(map(str, prompt)))

                  wardrobe = item.get("wardrobe")
                  if isinstance(wardrobe, str) and wardrobe.strip():
                      assert wardrobe.strip() != item["visual"].strip(), f"{cid}: wardrobe duplicates the identity baseline"
                  locks = item.get("continuityLocks")
                  if isinstance(locks, list):
                      assert locks != prompt, f"{cid}: continuityLocks duplicates promptContinuity"

                  assert "relationship" not in item, f"{cid}: development relationship prose is again assembler-visible"
          '''
          if 'wardrobe duplicates the identity baseline' not in s:
              assert anchor in s
              s=s.replace(anchor,replacement)

          fn='''def validate_recovery_cleanup() -> None:
              assert not LEGACY_SCENE_PAGE_FILE.exists(), "retired Low Tide S01-S08 scene-page package is still active"
              ref_dir = NORMALIZATION.parent
              for name in OBSOLETE_RECOVERY_FILES:
                  assert not (ref_dir / name).exists(), f"obsolete Low Tide recovery artifact remains: {name}"

              normalization_text = NORMALIZATION.read_text(encoding="utf-8")
              for stale in ("binary-persistence-pending", "LTS_C01_S01", "pages_c01_scene_pages.json"):
                  assert stale not in normalization_text, f"stale Low Tide recovery state remains in normalization reference: {stale}"


          '''
          if 'def validate_recovery_cleanup()' not in s:
              target='def validate_regions_and_settings() -> None:\n'
              assert target in s
              s=s.replace(target,fn+target)

          if '    validate_recovery_cleanup()\n' not in s:
              target='    validate_normalization_reference()\n    validate_characters()\n'
              assert target in s
              s=s.replace(target,'    validate_normalization_reference()\n    validate_recovery_cleanup()\n    validate_characters()\n')

          s=s.replace('print("Recovery conflict: resolved to active P-page contract")\\n    print("Core character baselines:", len(CORE_CHARACTER_IDS))',
                      'print("Recovery conflict: resolved to active P-page contract")\n    print("Core character baselines:", len(CORE_CHARACTER_IDS))')

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/validate_low_tide_img_normalization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_low_tide_img_normalization.py
          git diff --cached --quiet && exit 1
          git commit -m "Harden Low Tide recovery cleanup validation"
          git push
