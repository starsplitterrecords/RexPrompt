name: Final Sunforge dialogue fixes
on:
  push:
    branches: [sunforge-dialogue-pass-20260914]
    paths: ['.github/workflows/sunforge-dialogue-final-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunforge-dialogue-pass-20260914
      - name: Fix Issue 12 closing dialogue
        run: |
          python - <<'PY'
          import json, pathlib
          path=pathlib.Path('data/shows/sunforge-outlaw-s1/pages_e12.json')
          pages=json.loads(path.read_text(encoding='utf-8'))
          replacement={
            'SUN_S1E12_P05': [
              ('Maela Crow','I wanted you to be him.'),
              ('Kael','I know.'),
              ('Maela Crow','Then I could hand this over and be done.'),
              ('Kael','You can put it somewhere safe.'),
              ('Maela Crow',"That isn't the same thing."),
              ('Kael','No.'),
              ('Maela Crow','Lysa made me promise.'),
              ('Kael','Then keep the promise. You just do not have to carry it in your hands every day.'),
              ('Maela Crow','And if Darrow never comes?'),
              ('Kael','Then he never comes.'),
              ('Maela Crow',"That's not very helpful."),
              ('Kael',"No, ma'am."),
              ('Samuel','That was almost pastoral.'),
              ('Kael',"Don't ruin it.")
            ],
            'SUN_S1E12_P06': [
              ('Eva','I was wrong.'),
              ('Kael','About which part?'),
              ('Eva','I kept waiting for one of the names to turn into an answer.'),
              ('Jessa','And now?'),
              ('Eva','The woman in the green scarf knew his face before Veyra knew his name.'),
              ('Veyra','Yes.'),
              ('Eva','I want to find her.'),
              ('Jessa','Unfortunately, so do I.'),
              ('Samuel','That makes three.'),
              ('Kael','Can we at least walk while you become obsessed?'),
              ('Eva','We?'),
              ('Kael',"Don't.")
            ]
          }
          for p in pages:
              if p['id'] in replacement:
                  p['dialogueInline']=[{'speaker':s,'text':t} for s,t in replacement[p['id']]]
          path.write_text(json.dumps(pages,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Validate full file and all 73 pages across package.
          base=path.parent
          count=0
          for n in range(1,13):
              issue=json.loads((base/f'pages_e{n:02d}.json').read_text(encoding='utf-8'))
              for p in issue:
                  d=p.get('dialogueInline')
                  if not isinstance(d,list) or not d:
                      raise SystemExit(f'missing dialogue: {p["id"]}')
                  for line in d:
                      if not line.get('speaker') or not str(line.get('text','')).strip():
                          raise SystemExit(f'bad dialogue: {p["id"]}')
                  count+=1
          if count != 73:
              raise SystemExit(f'expected 73 pages, found {count}')
          print('validated', count, 'pages')
          PY
      - name: Commit and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sunforge-dialogue-final-fix.yml
          git add data/shows/sunforge-outlaw-s1/pages_e12.json
          git commit -m 'Finish Sunforge dialogue pass'
          git push origin HEAD:sunforge-dialogue-pass-20260914
