name: Validate Stardust Station

on:
  pull_request:
    paths:
      - 'data/shows.json'
      - 'data/shows/stardust-station/**'
      - 'production/drafts/**'
      - 'production/references/stardust-station/**'
      - 'production/visual-sources.json'
      - 'tools/validate_stardust_station.py'
      - 'tools/validate_visual_state.py'
      - '.github/workflows/validate-stardust-station.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Stardust Station mechanical integrity
        run: python tools/validate_stardust_station.py
      - name: Validate shared production visual state
        run: python tools/validate_visual_state.py
