name: Validate Stardust Station

on:
  pull_request:
    paths:
      - 'data/shows.json'
      - 'data/shows/stardust-station/**'
      - 'tools/validate_stardust_station.py'
      - 'tools/validate_stardust_station_issue2.py'
      - '.github/workflows/validate-stardust-station.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Stardust Station Issue 1 page production data
        run: python tools/validate_stardust_station.py
      - name: Validate Stardust Station Issue 2 page production data
        run: python tools/validate_stardust_station_issue2.py
