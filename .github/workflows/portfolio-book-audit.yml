name: Portfolio Complete-Book Inventory
on:
  pull_request:
    paths:
      - 'tools/audit_portfolio_books.cjs'
      - 'tools/test_book_export_manifest.cjs'
      - 'production/book-manifests.json'
      - 'production/book-export-coverage.json'
      - '.github/workflows/portfolio-book-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/audit_portfolio_books.cjs'
      - 'tools/test_book_export_manifest.cjs'
      - 'production/book-manifests.json'
      - 'production/book-export-coverage.json'
permissions:
  contents: write
jobs:
  update-inventory:
    if: github.event_name == 'pull_request' && github.head_ref == 'work/portfolio-complete-book-coverage-20261025' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/audit_portfolio_books.cjs --write
      - name: Commit audited source-backed inventories and portfolio report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/book-manifests.json production/book-export-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh source-verified portfolio book inventories"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
  verify-inventory:
    if: github.event_name == 'push' || github.head_ref != 'work/portfolio-complete-book-coverage-20261025'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/audit_portfolio_books.cjs --check
      - run: node tools/test_book_export_manifest.cjs
