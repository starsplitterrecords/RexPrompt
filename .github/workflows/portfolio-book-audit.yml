name: Validate source-backed book manifests and editorial roles
on:
  pull_request:
    paths:
      - 'data/shows.json'
      - 'data/shows/**'
      - 'production/drafts/**'
      - 'production/book-manifests.json'
      - 'production/book-export-coverage.json'
      - 'production/issue-structure.json'
      - 'production/PORTFOLIO_BOOK_EXPORT_COVERAGE.md'
      - 'tools/audit_portfolio_books.cjs'
      - 'tools/test_book_export_manifest.cjs'
      - 'issue-publishing.js'
      - '.github/workflows/portfolio-book-audit.yml'
  push:
    branches: [main]
    paths:
      - 'production/book-manifests.json'
      - 'production/book-export-coverage.json'
      - 'production/issue-structure.json'
      - 'production/PORTFOLIO_BOOK_EXPORT_COVERAGE.md'
      - 'tools/audit_portfolio_books.cjs'
      - 'tools/test_book_export_manifest.cjs'
      - '.github/workflows/portfolio-book-audit.yml'
permissions:
  contents: read
jobs:
  verify-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/audit_portfolio_books.cjs --check
      - run: node tools/test_book_export_manifest.cjs
