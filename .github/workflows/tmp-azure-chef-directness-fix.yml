name: Temporary Azure Reach Chef Directness Fix

on:
  push:
    paths:
      - '.github/workflows/tmp-azure-chef-directness-fix.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/azure-reach-chef-boundary-20260910
      - name: Remove remaining editorial explanation from image recipes
        shell: python
        run: |
          import base64,gzip,json,pathlib,re
          root=pathlib.Path('data/shows/azure-reach-s1')
          replacements={
            ('AZR_S1E02_P05','panel',1):'2. SMALL RELIEF PANEL: Raf and Nia exchange a brief relieved nod after the ordinary-language clarification.',
            ('AZR_S1E02_P08','summary',None):'After the early closure, Maya, Dora and Sal compare what guests are actually doing at the habitat while Julian listens and watches the public reaction.',
            ('AZR_S1E02_P09','summary',None):'Walking between the dolphin gallery and food court, the ensemble passes guests carrying keepsakes and dolphin-themed food while another guest lingers with an object near the dolphin entrance.',
            ('AZR_S1E02_P09','panel',4):'5. Julian watches another guest clutch an object near the dolphin entrance while families continue moving between the gallery and food court.',
            ('AZR_S1E02_P10','panel',1):'2. Beatrice watches families react to the reef, then turns back to the group and proposes giving guests something truthful to respond to.',
            ('AZR_S1E02_P17','summary',None):'A guest tries to create another personal exchange at the demonstration; Pip redirects the guest while the dolphin completes the approved trained return routine.',
            ('AZR_S1E02_P19','summary',None):'At the retail completion point, Pip and Nia hand over the finished souvenir while keeping the dolphin habitat and trainer-led demonstration visually separate from the transaction.',
            ('AZR_S1E02_P20','panel',5):'6. FINAL on Raf with a tray or serving basket as Fleur credits typography and he credits breading; the corrected cheerful menu fills the background.',
            ('AZR_S1E02_P22','panel',3):"4. TWO-SHOT, slightly wider: Maya adds '...and no one is eating dolphin nuggets.' Hold on the exhausted end-of-day reaction.",
            ('AZR_S1E04_P18','summary',None):'Kyler shows that the expert Q&A held viewers longer than the feeding footage; Beatrice studies the comparison while the calm ray habitat remains visible beyond the monitor.',
            ('AZR_S1E04_P19','summary',None):"In the Conservation Water Garden, Beatrice watches guests linger over the stream's questions and opens a Conservation Week deck with a large public participation target.",
            ('AZR_S1E04_P20','panel',5):'6. Beatrice closes the tablet; hold on the water garden, moving guests and staff rather than adding another planning graphic.',
            ('AZR_S1E05_P08','summary',None):'Walking through the Conservation Water Garden, Elliot reads the sponsor language aloud; the group stops beside the real guest activity and begins simplifying the campaign materials.',
            ('AZR_S1E05_P09','summary',None):'Among freshwater river habitats, Julian demonstrates an all-app participation route; Nia points to guests using the physical option and the group keeps both routes available.',
            ('AZR_S1E05_P13','summary',None):'In the Seahorse Conservatory, Maya and Dora continue ordinary care while Fleur watches water tests, food preparation and habitat checks as visually compelling public-facing material.',
            ('AZR_S1E05_P13','panel',2):'3. Dora and Sal continue normal keeper rhythms with water testing, food preparation and habitat checks visible in the frame.',
            ('AZR_S1E05_P14','panel',4):'5. The sponsor looks out at the habitat and gestures toward the visible staff work, asking to see more of it.',
            ('AZR_S1E05_P17','panel',5):"6. Sal gives Beatrice a small skeptical look after her line; she catches it and answers with a restrained half-smile.",
            ('AZR_S1E05_P20','summary',None):'In the Coral Grand Hall, the sponsor asks for an honest final report centered on what guests actually did throughout the park; active reef life and late-day visitors remain visible behind the conversation.',
            ('AZR_S1E05_P20','panel',3):'4. The sponsor gestures through the glass toward guests still using the park while the report remains open on the table or tablet.',
            ('AZR_S1E05_P21','summary',None):'After close in the Jellyfish Gallery, the ensemble talks quietly among the glowing displays, comparing what helped guests with what they do not want to formalize into another permanent program.',
            ('AZR_S1E05_P21','panel',3):'4. Julian speaks while slow jellyfish drift behind him; his hands stay loose and conversational rather than presenter-like.',
            ('AZR_S1E05_P21','panel',4):'5. Fleur answers from the opposite side of the glowing gallery, then looks back toward the displays.',
            ('AZR_S1E05_P22','summary',None):"At the quiet overlook, Beatrice arrives with tomorrow's Anniversary Gala deck; the compact tablet opens into a dense plan of prestige activations over the park map.",
            ('AZR_S1E05_P22','panel',1):'2. Beatrice arrives carrying a slim tablet and opens the Anniversary Gala deck beside the overlook railing.',
            ('AZR_S1E06_P03','summary',None):'Walking the Kelp Forest, each department points to a different successful activation they want in the gala; the competing ideas accumulate as the living habitat remains visible around them.',
            ('AZR_S1E06_P14','summary',None):'The revised gala becomes a loose journey through distinct habitats, with guests moving between open viewing spaces, staff interpretation and quiet discovery moments.',
            ('AZR_S1E06_P20','panel',5):'6. The Conservation Wall shows the anniversary mark beside real attendance and participation figures, with no invented victory number.',
            ('AZR_S1E06_P22','summary',None):'At the staff overlook after the gala, Maya and Sal watch Azure Reach return to ordinary night life as habitat lighting, staff carts and water movement continue below.',
            ('AZR_S1E06_P22','panel',5):"6. Final close two-shot with the living park behind them: 'We let the park do some of the work.' / 'About time.' Hold the understated reaction and luminous habitat depth."
          }
          changed_files=0; page_designs=0
          for p in sorted((root/'encoded').glob('*.json.gzb64')):
              data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode()); dirty=False
              pages=data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  pid=str(page.get('id',''))
                  if not re.match(r'^AZR_S1E0[2-6]_P\d{2}$',pid): continue
                  key=(pid,'summary',None)
                  if key in replacements and page.get('summary')!=replacements[key]: page['summary']=replacements[key]; dirty=True
                  plan=list(page.get('panelPlan') or [])
                  for i,item in enumerate(plan):
                      key=(pid,'panel',i)
                      if key in replacements:
                          if isinstance(item,dict):
                              q=dict(item); q['text']=replacements[key]; plan[i]=q
                          else: plan[i]=replacements[key]
                          dirty=True
                  page['panelPlan']=plan
                  inline=[]
                  for item in page.get('directionInline') or []:
                      if isinstance(item,dict) and isinstance(item.get('text'),str) and item['text'].startswith('PAGE DESIGN —'):
                          text=item['text']; page_designs+=1
                          if 'Key image:' in text:
                              direct=text.split('Key image:',1)[1].strip()
                              item=dict(item); item['text']='PAGE DESIGN — Primary composition: '+direct
                          elif pid=='AZR_S1E06_P15':
                              item=dict(item); item['text']='PAGE DESIGN — Primary composition: Staff rehearse guest questions in the live gala environment, answering routinely while public circulation and habitat views remain active around them.'
                          dirty=True
                      inline.append(item)
                  page['directionInline']=inline
              if dirty:
                  p.write_text(base64.b64encode(gzip.compress((json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n').encode(),mtime=0)).decode()+'\n')
                  changed_files+=1

          # Permanent guard for this architecture on unreleased Azure pages.
          vpath=pathlib.Path('tools/validate_azure_reach.py'); v=vpath.read_text()
          needle='            if page_id.startswith(("AZR_S1E02_", "AZR_S1E03_", "AZR_S1E04_", "AZR_S1E05_", "AZR_S1E06_")):\n                assert not item["text"].startswith("PAGE CONTINUITY —"), f"{page_id}: writer continuity leaked into chef recipe"\n'
          add=needle+'                assert not item["text"].startswith("PAGE DESIGN — Page feel:"), f"{page_id}: editorial page analysis leaked into chef recipe"\n'
          if 'editorial page analysis leaked into chef recipe' not in v: v=v.replace(needle,add)
          vpath.write_text(v)

          # Full non-dialogue regression scan over the actual page payload.
          bad=[
            'process-improvement moral','process manual','workflow board','optimization lesson','management lesson',
            'evidence of growth','previous issue supplied a process','repeatable lesson','scalable lesson',
            'character growth expressed','series premise becoming','corporate learning the series premise',
            "season's former escalation engine", "season’s former escalation engine", "season's translation arc",
            'page feel:','institutional learning','beatrice\'s growth','finale\'s lesson','proof-of-system page'
          ]
          hits=[]; count=0
          for p in sorted((root/'encoded').glob('*.json.gzb64')):
              data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode())
              pages=data if isinstance(data,list) else data.get('pages',[])
              for page in pages:
                  pid=str(page.get('id',''))
                  if not re.match(r'^AZR_S1E0[2-6]_P\d{2}$',pid): continue
                  count+=1
                  text='\n'.join([str(page.get('summary',''))]+[x.get('text','') if isinstance(x,dict) else str(x) for x in page.get('panelPlan') or []]+[x.get('text','') if isinstance(x,dict) else str(x) for x in page.get('directionInline') or []]).lower()
                  for phrase in bad:
                      if phrase in text: hits.append((pid,phrase))
                  if pid.startswith('AZR_S1E05_'):
                      for phrase in ('wristbands','microscope feed','tidepool rest/rotation'):
                          if phrase in text: hits.append((pid,phrase))
          assert count==110,count
          assert not hits,hits[:30]
          assert page_designs==97,page_designs
          print('Converted PAGE DESIGN blocks:',page_designs)
          print('Changed encoded files:',changed_files)
      - name: Validate Azure Reach
        run: python tools/validate_azure_reach.py
      - name: Commit direct chef recipes and remove temporary audit tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name starsplitterrecords
          git config user.email 77013062+starsplitterrecords@users.noreply.github.com
          git rm -f .github/workflows/tmp-azure-chef-directness-fix.yml .github/workflows/tmp-azure-final-chef-audit.yml .github/workflows/tmp-azure-debug-p22.yml .github/workflows/tmp-azure-final-dump.yml
          git add data/shows/azure-reach-s1/encoded tools/validate_azure_reach.py
          git commit -m 'Make Azure Reach image recipes self-contained and visual'
          git push origin HEAD:fix/azure-reach-chef-boundary-20260910
