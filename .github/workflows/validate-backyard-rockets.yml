name: Validate Backyard Rockets data

on:
  pull_request:
    paths:
      - 'index.html'
      - 'data/shows.json'
      - 'data/shows/backyard-rockets-s1/**'
      - 'tools/validate_backyard_rockets.py'
      - 'tools/audit_backyard_rockets_continuity.py'
      - 'tools/fix_backyard_rockets_continuity.py'
      - 'tools/expand_backyard_rockets_dialogue.py'
      - 'tools/export_backyard_rockets_scene_payloads.py'
      - '.github/workflows/validate-backyard-rockets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair Backyard Rockets continuity
        run: python tools/fix_backyard_rockets_continuity.py
      - name: Ensure every authored scene is explicitly reviewed for dialogue
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/expand_backyard_rockets_dialogue.py')
          text = p.read_text(encoding='utf-8')
          marker = "'BR_S1E02_A05_SC01':[]"
          needle = "'BR_S1E02_A04_SC06':[],\n" + marker
          if needle not in text:
              if marker not in text:
                  raise SystemExit('Could not locate insertion point for BR_S1E02_A04_SC06')
              text = text.replace(marker, needle, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Expand Backyard Rockets dialogue
        run: python tools/expand_backyard_rockets_dialogue.py
      - name: Validate Backyard Rockets show
        run: python tools/validate_backyard_rockets.py
      - name: Audit Backyard Rockets continuity
        run: python tools/audit_backyard_rockets_continuity.py
      - name: Export source scene payloads for continuity review
        run: python tools/export_backyard_rockets_scene_payloads.py
      - name: Upload continuity working set
        uses: actions/upload-artifact@v4
        with:
          name: backyard-rockets-continuity-working-set
          path: |
            backyard-rockets-continuity-report.json
            backyard-rockets-scene-payloads.json
          if-no-files-found: error
      - name: Commit deterministic scene repairs and dialogue expansion
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- data/shows/backyard-rockets-s1 tools/expand_backyard_rockets_dialogue.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/shows/backyard-rockets-s1 tools/expand_backyard_rockets_dialogue.py
            git commit -m "Expand Backyard Rockets dialogue across all reviewed scenes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
