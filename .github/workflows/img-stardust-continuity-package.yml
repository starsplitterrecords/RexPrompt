name: IMG Stardust Continuity Package

on:
  push:
    paths:
      - '.github/workflows/img-stardust-continuity-package.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch released Stardust canon
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/starsplitterrecords/StarSplitterVisions.git /tmp/visions
          mkdir -p readback
          cp production/references/stardust-station/issue-2-cast-promo-thumb.jpg readback/00-issue-2-cast-promo-thumb.jpg
          cp /tmp/visions/sites/visions/public/images/pages/stardust-station/issue-01/page-001.jpg readback/01-page-001.jpg
          cp /tmp/visions/sites/visions/public/images/pages/stardust-station/issue-01/page-002.jpg readback/02-page-002.jpg
          cp /tmp/visions/sites/visions/public/images/pages/stardust-station/issue-01/page-004.jpg readback/03-page-004.jpg
          cp /tmp/visions/sites/visions/public/images/pages/stardust-station/issue-01/page-005.jpg readback/04-page-005.jpg
          cp /tmp/visions/sites/visions/public/images/pages/stardust-station/issue-01/page-007.jpg readback/05-page-007.jpg
          cp /tmp/visions/sites/visions/public/images/pages/stardust-station/issue-01/page-022.jpg readback/06-page-022.jpg
          cp production/references/stardust-station/visual-reference-pack.json readback/visual-reference-pack.json
          sha1sum readback/*.jpg
      - name: Upload continuity pixels
        uses: actions/upload-artifact@v4
        with:
          name: stardust-character-continuity-package
          path: readback/
          if-no-files-found: error
          retention-days: 1
