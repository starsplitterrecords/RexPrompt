name: Apply Echoes chef-layer repair

on:
  push:
    branches:
      - main
    paths:
      - 'tools/fix_echoes_chef_layer.py'
      - 'tools/fix_echoes_chef_layer_stage2.py'
      - 'tools/fix_echoes_chef_layer_stage3.py'
      - 'tools/fix_echoes_chef_layer_stage4.py'
      - 'tools/audit_echoes_chef_layer_broad.py'
      - '.github/workflows/apply-echoes-chef-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply chef-layer separation
        run: |
          python tools/fix_echoes_chef_layer.py
          python tools/fix_echoes_chef_layer_stage2.py
          python tools/fix_echoes_chef_layer_stage3.py
          python tools/fix_echoes_chef_layer_stage4.py
      - name: Audit post-cleanup chef layer
        run: python tools/audit_echoes_chef_layer_broad.py
      - name: Validate repaired Echoes package
        run: |
          python -m py_compile tools/validate_echoes.py tools/sanitize_echoes.py tools/sanitize_echoes_residue.py
          python tools/validate_echoes.py
      - name: Inspect migration
        run: |
          git diff --check
          git diff --stat
      - name: Commit migrated recipes and validator
        run: |
          if git diff --quiet; then
            echo 'No Echoes chef-layer changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shows/echoes-forgotten-war-s1 tools/validate_echoes.py
          git commit -m 'Finalize Echoes image-recipe separation'
          git push origin HEAD:main
