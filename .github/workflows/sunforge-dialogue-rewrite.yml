name: Apply Sunforge dialogue rewrite

on:
  push:
    branches:
      - sunforge-dialogue-pass-20260914
    paths:
      - '.github/workflows/sunforge-dialogue-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunforge-dialogue-pass-20260914
          fetch-depth: 0

      - name: Apply and validate dialogue rewrite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/shows/sunforge-outlaw-s1')
          all_ids = []
          changed = []
          forbidden = ["you’ren’t", "there’sn’t", "I’ven’t", "she’sn’t", "you'ren't", "there'sn't", "I'ven't", "she'sn't"]

          for issue in range(1, 13):
              page_path = root / f'pages_e{issue:02d}.json'
              map_path = Path('.tmp') / f'sunforge-dialogue-e{issue:02d}.json'
              pages = json.loads(page_path.read_text(encoding='utf-8'))
              rewrites = json.loads(map_path.read_text(encoding='utf-8'))

              expected = 7 if issue == 1 else 6
              if len(pages) != expected:
                  raise SystemExit(f'Issue {issue}: expected {expected} pages, found {len(pages)}')
              if len(rewrites) != expected:
                  raise SystemExit(f'Issue {issue}: expected {expected} dialogue maps, found {len(rewrites)}')

              page_ids = [p['id'] for p in pages]
              if set(page_ids) != set(rewrites):
                  missing = sorted(set(page_ids) - set(rewrites))
                  extra = sorted(set(rewrites) - set(page_ids))
                  raise SystemExit(f'Issue {issue}: rewrite ID mismatch missing={missing} extra={extra}')

              for page in pages:
                  pid = page['id']
                  dialogue = rewrites[pid]
                  if not dialogue:
                      raise SystemExit(f'{pid}: empty dialogue')
                  for line in dialogue:
                      if not line.get('speaker') or not line.get('text'):
                          raise SystemExit(f'{pid}: malformed dialogue line {line!r}')
                      for bad in forbidden:
                          if bad in line['text']:
                              raise SystemExit(f'{pid}: forbidden contraction artifact {bad}')
                  page['dialogueInline'] = dialogue
                  all_ids.append(pid)

              page_path.write_text(json.dumps(pages, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              changed.append(str(page_path))

          if len(all_ids) != 73 or len(set(all_ids)) != 73:
              raise SystemExit(f'Expected 73 unique page IDs, got {len(all_ids)} total / {len(set(all_ids))} unique')

          print('Validated dialogue rewrite:', len(all_ids), 'unique pages')
          print('\n'.join(changed))
          PY

      - name: Remove staging helpers and commit
        run: |
          rm -f .tmp/sunforge-dialogue-e*.json
          rm -f .github/workflows/sunforge-dialogue-rewrite.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/sunforge-outlaw-s1/pages_e*.json .tmp .github/workflows/sunforge-dialogue-rewrite.yml || true
          git commit -m "Rewrite Sunforge dialogue for character and subtext"
          git push origin HEAD:sunforge-dialogue-pass-20260914
