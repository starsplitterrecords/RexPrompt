name: Rex Fleet scene-flow cleanup

on:
  push:
    branches:
      - enhance/rex-fleet-scene-flow
    paths:
      - '.github/workflows/rex-fleet-scene-flow-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/rex-fleet-scene-flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Final Rex Fleet validation
        run: python tools/validate_rex_fleet.py
      - name: Remove temporary diagnostic material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/rex-fleet-scene-flow-temp.yml
          git rm -rf tmp/rex-fleet-scene-flow
          git rm -f tmp/rex-fleet-scene-flow-snapshot.json tmp/rex-fleet-scene-flow-review.md tmp/rex-fleet-scene-flow-stats.json tmp/rex-fleet-scene-flow-readback.json
          git commit -m "Remove temporary Rex Fleet scene-flow diagnostics"
          git push origin HEAD:enhance/rex-fleet-scene-flow
