name: Apply Low Tide final enhancement
on:
  push:
    paths:
      - '.github/workflows/apply-low-tide-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Low Tide enhancement and validate chef boundary
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          base=Path('data/shows/low-tide-signal')
          def load(p): return json.loads(Path(p).read_text())
          def save(p,obj): Path(p).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')

          # ---- Durable story premise: viable inland world, differentiated adults ----
          show=load(base/'show.json')
          show['logline']='In a near-future coastal city that is safe, automated, and genuinely livable, six old friends become obsessed with crossing exposed seabed into an abandoned offshore district that appears during rare low tides — until one failed return forces them to confront what they were asking the place to give them.'
          show['premise']='Harbor Phase adapted to rising seas by moving inland. Automation and continuity payments keep life materially stable, but the city is not a dystopia and the six leads are not six versions of the same redundancy. Each has a real adult life that fits badly in a different way. At rare low tides, abandoned offshore expansion districts called the Reach become reachable on foot, offering physical consequence, status, story, curiosity, competence, and unscripted time that inland life does not give them in the same form.'
          show['ensemble_rule']='The six leads are adults with history, attraction, irritation, trust, jokes, embarrassment, obligations, and real familiarity. Every lead wants the Reach for a different personal reason. No lead stands outside the temptation as a clean interpretive device.'
          show['character_scope']['ensemble']='All six leads have functioning adult lives and distinct forms of dissatisfaction. The Reach amplifies different flaws: authority hunger, performance hunger, mythmaking, social hesitation, curiosity, attachment, and bad collective momentum.'
          show['character_scope']['nicole']='Nicole is an adult participant and Reach-fascinated member of the friend group. She likes being there, jokes, explores, takes risks, and sometimes helps bad momentum. She is never the explainer, philosopher, scold, corrective woman, archivist, or Sector 14 detective.'
          save(base/'show.json',show)

          structure=load(base/'structure_58_beats.json')
          for act in structure.get('acts',[]):
            if act.get('id')=='ACT_I':
              act['emotional_state']='Restless Stability'
              act['beats']=['Ordinary Harbor Phase' if x=='Managed Adulthood' else x for x in act.get('beats',[])]
            if act.get('id')=='ACT_III':
              act['beats']=['Nicole Chooses the Reach' if x in ('Nicole’s Obsession',"Nicole's Obsession") else x for x in act.get('beats',[])]
          save(base/'structure_58_beats.json',structure)

          sections=load(base/'sections_ch01_ch04.json')
          for s in sections:
            if s.get('id')=='LTS_C01':
              s['summary']='Introduce Harbor Phase as a functioning, adapted, genuinely livable city and establish six old friends whose adult lives fit them differently. None is destitute or merely symbolic. A rare Reach window gives each of them a different reason to go. They gather at the floodwall, cross the exposed flats through mud and fog, and see an interrupted offshore future emerge ahead.'
            if s.get('id')=='LTS_C03':
              s['summary']='Repeat crossings make impossibility familiar. Tide culture develops route names, wall marks, oral stories, and temporary reputation. Harbor Market Roof becomes a social high where no signal forces presence. Matt becomes useful, Chris shapes stories, Justin tests attention, Nicole chooses the place as a participant rather than decoding it, Kevin hedges warnings, and Ryan watches the tide instead of the crowd.'
          save(base/'sections_ch01_ch04.json',sections)

          # ---- Character shelf: put dramatic differentiation in assembler-visible fields ----
          chars=load(base/'characters.json')
          updates={
            'C_lts_matt_donnelly':{
              'role':'would-be leader / hunger for useful authority',
              'core_wound':'He expected adulthood to give him a durable role people would lean on. His infrastructure job is real and important during storms, but long quiet stretches leave him hungry to feel immediately useful.',
              'inland_life':'Municipal infrastructure oversight with real responsibility on bad days and a lot of calm monitoring on ordinary ones. He is competent, employed, and not trapped; he simply wants his judgment to matter more often.',
              'performance':'Competent and practical, slightly too quick to volunteer a decision once people start listening. Let usefulness feel good on him before it becomes authority hunger; defensive when Ryan quietly knows better.',
              'relationship':'Old friend-group organizer. Respects Ryan and competes with him without admitting it; enjoys Chris, reins in Justin, values Kevin but dislikes hesitation, and never treats Nicole as his validator.',
              'promptContinuity':['early-30s apparent age','solid frame','practical work jacket','worn boots','contractor bag','tide monitor clipped to strap','authority should grow through behavior, not heroic posing']},
            'C_lts_ryan_kelleher':{
              'role':'working-water competence / reluctant authority',
              'core_wound':'The working-water culture that formed him is smaller than it used to be, but his knowledge is still real. He distrusts performance and has never learned to turn competence into social authority.',
              'inland_life':'Repairs old marine equipment, boats, and waterfront hardware. The work is useful and physical; there is simply less of that world than there used to be.',
              'performance':'Sparse, exact, unsentimental. Reads water, footing, weather, and people before speaking. Do not make him a scold; his problem is that he often says the right thing too quietly until consequence forces volume.',
              'relationship':'Matt is the friend most likely to speak before Ryan; Ryan notices but rarely contests status directly. Dry with Chris, fondly exasperated by Justin, trusts Kevin’s numbers, and treats Nicole as another adult runner rather than someone to protect or explain things to.',
              'promptContinuity':['early-30s apparent age','weathered marine jacket','waterproof layered gear','old practical boots','salt-stained working-water appearance','underplay movement; he watches water first']},
            'C_lts_chris_barlow':{
              'role':'mythmaker / irony shield',
              'core_wound':'His technical work exists and pays, but it arrives in fragments and rarely becomes a life story. He is more bothered by the absence of a defining direction than by the work itself.',
              'inland_life':'Patchy freelance technical work, unfinished personal projects, friends nearby, and enough stability that he can joke about being stuck without actually being desperate.',
              'performance':'Fast, funny, observant, and reflexively narrativizing. Jokes before admitting fear. Let him enjoy turning the Reach into language long before he understands that stories can reward the wrong behavior.',
              'relationship':'Chris and Justin feed each other: performer plus mythmaker. He needles Matt, respects Ryan more than he says, uses Kevin’s anxiety as comic material, and trades dry jokes with Nicole, who can puncture exaggeration without standing outside the fun.',
              'promptContinuity':['late-20s/early-30s apparent age','layered hoodie or tech jacket','cracked tablet or recorder','battery packs and excessive cables','digitally overprepared silhouette','humor is a defense, not omniscient narration']},
            'C_lts_justin_rourke':{
              'role':'performer of danger',
              'core_wound':'He has a real physical life and plenty of nerve, but ordinary training and gigs end when the clock says they end. The Reach gives his body stakes and gives other people a reason to watch.',
              'inland_life':'Physical gigs, serious training, exercise, climbing, and adrenaline hobbies. He is active rather than idle; the problem is that none of it feels consequential for long.',
              'performance':'Loud, teasing, kinetic, generous, and increasingly performative when attention rewards risk. Keep him likable enough that other people sometimes encourage him; later stillness should feel wrong.',
              'relationship':'Chris makes his risks funnier and more legendary. Matt tries to manage him, Ryan refuses to be impressed, Kevin worries about him, and Nicole can laugh with him or egg on a bad idea—she is not assigned to correct him.',
              'promptContinuity':['late-20s/early-30s apparent age','largest/heaviest frame in core group','rescue vest or heavy outer layer','rope/climbing gear','scuffed boots','usually in motion until the aftermath']},
            'C_lts_nicole_hanley':{
              'role':'Reach-fascinated adult participant',
              'core_wound':'Her inland life is real and socially connected, but the Reach offers unscripted time, texture, risk, and immediacy she actively wants. She is not present to diagnose the others.',
              'inland_life':'A functioning ordinary adult life with plans, obligations, friends, and enough comfort to choose the Reach rather than flee to it. Do not define her by a symbolic automation problem.',
              'performance':'Dry, amused, physically engaged, curious, and fully tempted. Let her joke, explore, get scared, want to stay, make bad calls, and occasionally encourage the run energy. Map knowledge is practical curiosity, never investigative authority.',
              'relationship':'Longstanding equal inside the friend group. Comfortable with the men, not their mother, audience surrogate, validator, scold, philosopher, or corrective woman. She can disagree without becoming morally outside them.',
              'promptContinuity':['late-20s/early-30s apparent age','practical waterproof layers','compact gear','gloves','folded map only when scene-relevant','non-theatrical practical silhouette','never stage her as the lone person who understands the meaning of the Reach']},
            'C_lts_kevin_marsh':{
              'role':'risk forecaster / socially hesitant warning voice',
              'core_wound':'He is trained to quantify uncertainty and is often useful, but he has learned to wrap conclusions in caveats. The Reach punishes the distance between being technically right and making other people act.',
              'inland_life':'Risk and forecast work with automated tools, exception review, and real judgment at the edges. He is not obsolete; his personal weakness is how softly he converts knowledge into action.',
              'performance':'Technical when anxious, plain when emotionally clear. Hedge early warnings, then gradually strip away qualifiers. His growth is not becoming fearless; it is making a call when a call is required.',
              'relationship':'Ryan naturally understands his warnings, Matt wants certainty Kevin cannot always give, Chris teases the anxiety, Justin outruns it, and Nicole sometimes takes him seriously but not always enough.',
              'promptContinuity':['late-20s/early-30s apparent age','layered rain gear','tablet or tide device','small weather sensor','watchful/nervous posture','look at sky or water while others look at one another']}
          }
          for k,u in updates.items():
            chars[k].update(u)
            chars[k]['wardrobe']=chars[k].get('visual','')
          save(base/'characters.json',chars)

          # ---- Settings: fix missing shelf references and make every setting chef-visible ----
          settings=load(base/'settings.json')
          inland={
            'S_lts_harbor_phase_inland':('Safe, automated, materially stable, socially active coastal city adapted to rising seas. Harbor Phase is viable and pleasant rather than a dystopia; the leads’ restlessness is not a universal condition.','gray-blue rain, raised transit, flood-control gates, public-service UI, cafes, markets, playgrounds, commuters and families under practical civic light'),
            'S_lts_harbor_phase':('Wide civic view of a functioning inland coastal city whose flood adaptation works: transit, homes, freight, shops, public space, and ordinary evening life.','gray-blue rain, raised rail, flood-control gates, apartment windows, civic screens, automated vehicles, storefront warmth, wet glass and concrete'),
            'S_lts_harbor_phase_transit':('Raised transit above the floodwall carrying ordinary commuters through a city that has learned to make routine tidal problems manageable.','rain-streaked windows, passengers reading and talking, floodwalls below, calm route displays, wet city light'),
            'S_lts_municipal_control_room':('Quiet infrastructure operations room. Human judgment genuinely matters during storms and failures; on an ordinary shift Matt mostly watches competent systems handle routine work.','blue-gray monitors, drainage maps, drone feeds, rain on glass, staffed but calm workstations'),
            'S_lts_harbor_phase_walkway':('Lively covered public realm where people commute, meet, eat, shop, parent, and make plans. Comfortable civic life is real here.','wet paving, planted walkways, umbrellas, food stalls, families, commuters, warm storefronts and restrained civic lighting'),
            'S_lts_inland_montage':('Cross-section of six functioning adult lives that fit differently: technical work, marine repair, risk review, serious physical training, ordinary plans, personal projects, and private routines.','specific practical interiors, workshops, climbing wall, screens, tools, kitchens, rain outside windows, personal clutter'),
            'S_lts_inland_bar':('Warm, busy neighborhood bar where the old friend group actually enjoys itself. Their restlessness exists inside a socially alive city, not an empty room.','warm light against rain, crowded booths, regulars, pints, food, overlapping conversations, polished wet windows'),
            'S_lts_inland_homes':('Distinct apartments, workshops, lockers, and kitchen tables where each person packs for the run around an existing adult life.','bags, boots, headlamps, tide screens, laundry, dishes, work gear, folded map, rain-lit windows, lived-in clutter')
          }
          for k,(d,v) in inland.items():
            if k in settings:
              settings[k]['description']=d; settings[k]['visual_language']=v

          missing={
            'S_lts_glass_rail_approach':('Glass Rail — Approach','approach to the broken elevated transit spine where fog reveals height, missing panels, and routes deeper into the Reach','wet concrete ramps, skeletal rail supports, fog, black water below, runner tags, headlamps and clipped work lights'),
            'S_lts_glass_rail_walkway':('Glass Rail — Walkway','narrow broken elevated walkway linking the dead mall to the rail and deeper sectors','wet metal decking, broken glass panels, black water below, fog at height, distant temporary runner lights'),
            'S_lts_harbor_market_approach':('Harbor Market — Approach','approach through upper commercial structures toward the Harbor Market roof used as a runner gathering place','service decks, faded market signs, ventilation units, stairs, work lights, fog and wet concrete'),
            'S_lts_harbor_market_exit':('Harbor Market — Exit','route away from the roof as runners pack out and the tide window narrows','wet exit stairs, shoulder lights, bags closing, black water visible below, fog swallowing the way back'),
            'S_lts_harbor_market_stairs':('Harbor Market — Stairs','interior/exterior service stairs connecting market levels to the occupied roof','concrete stairs, rusted rails, old wayfinding, damp walls, headlamps and practical work lights'),
            'S_lts_harbor_market_walkway':('Harbor Market — Walkway','elevated circulation around the market connecting roof spaces and rail approaches','wet walkway, broken canopy, ventilation housings, black water glimpses, taped route marks, fog'),
            'S_lts_harbor_market_west_corner':('Harbor Market Roof — West Corner','quieter corner of the runner roof where the city and deeper Reach can both be seen','roof edge, vents, temporary seating, cheap beer, clipped LEDs, fog, drowned skyline and dark water'),
            'S_lts_mall_corridor':('Fashion Harbor Center — Exit Corridor','upper mall corridor where returning water becomes visible through openings and route choices tighten','dead storefronts, wet tile, water reflections advancing, emergency signs, practical beams'),
            'S_lts_mall_exit':('Fashion Harbor Center — Exit','upper-level pack-out point leading from temporary runner occupation back outside','storefront shutters, bags, damp jackets, route marks, work lights, dark exterior beyond'),
            'S_lts_mall_exterior':('Fashion Harbor Center — Exterior','salt-stained exterior of the dead mall, weakly animated by temporary runner light during low tide','broad concrete facade, broken signage, clipped LEDs in upper levels, black water, fog'),
            'S_lts_matt_apartment':('Matt’s Apartment','ordinary comfortable apartment where practical gear begins to accumulate by the door as tide windows reorganize his schedule','lived-in furniture, work jacket, boots, contractor bag, charging gear, rain-lit windows, no dystopian sterility'),
            'S_lts_reach_junction':('Reach — Route Junction','physical fork where runner marks, elevation, water, and local judgment force a route choice','concrete junction, faded signs, spray arrows, puddles, rail shadows, fog and headlamp beams'),
            'S_lts_return_route':('The Return Route','same flats and outer structures under a changing tide; familiar geography becomes harder as channels refill','rising black water, shrinking mud paths, wet concrete, hurried practical lights, fog, moving reflections')
          }
          for k,(name,d,v) in missing.items():
            settings.setdefault(k,{'name':name,'type':'Low Tide Signal location','description':d,'visual_language':v,'story_function':'Production location used by page recipes.'})
          for k,e in settings.items():
            name=e.get('name',k); d=e.get('description',''); v=e.get('visual_language','')
            if isinstance(v,list): v=', '.join(v)
            e['text']=f"{name} — {d}"+(f" Visual language: {v}." if v else '')
          save(base/'settings.json',settings)

          regions=load(base/'regions.json')
          inland_r=regions['R_lts_inland']
          inland_r['description']='Adapted inland Harbor Phase: safe, automated, materially stable, socially alive, and genuinely livable. The leads are restless for different personal reasons rather than collectively trapped in a failed society.'
          inland_r['text']='Inland Harbor Phase — Adapted coastal city where ordinary life works: homes, transit, jobs, bars, families, hobbies, and public space continue under competent flood adaptation. Safe and comfortable without being sterile or dystopian. Use soft gray-blue rain, civic glass, warm human interiors, practical public lighting, and ordinary social activity.'
          save(base/'regions.json',regions)

          # ---- Early recipes: remove thesis repetition and Nicole-as-decoder drift ----
          pages=load(base/'pages_ch01_ch03_compiled.json')
          by={p['id']:p for p in pages}
          def dlg(pid,items): by[pid]['dialogueInline']=[{'speaker':s,'text':t} for s,t in items]
          by['LTS_C01_P01']['summary']='Full-page rain splash over functioning Harbor Phase: elevated transit, floodwalls, automated freight, apartment windows, food stalls, and commuters under awnings. The city works and people actually live here.'
          dlg('LTS_C01_P01',[('CAPTION','Harbor Phase worked.'),('CAPTION','Most days, that was enough.')])
          by['LTS_C01_P01']['directionInline']=[{'text':'Establish a viable, comfortable city with ordinary social life; not a dystopia and not an empty machine.'}]
          by['LTS_C01_P02']['summary']='Matt rides above the floodwall while routine tidal flooding is rerouted. Passengers barely react because the adaptation works.'
          dlg('LTS_C01_P02',[('SYSTEM','Minor tidal flooding downtown. Route adjusted.'),('SYSTEM','Estimated delay adjustment: 4 minutes.'),('CAPTION','The city had gotten very good at keeping ordinary problems ordinary.')])
          by['LTS_C01_P03']['summary']='Matt monitors storm infrastructure in a quiet control room. On bad days his judgment matters; tonight the system handles a routine obstruction before he is needed.'
          dlg('LTS_C01_P03',[('SYSTEM','Drainage obstruction detected. Drone crew dispatched.'),('SYSTEM','Obstruction cleared. Human confirmation requested.'),('CAPTION','On bad days, the job meant exactly what it said.'),('CAPTION','Tonight was not a bad day.')])
          by['LTS_C01_P04']['summary']='Matt exits into a lively covered district: commuters, families, food stalls, and people meeting after work. A continuity-payment notice is one piece of ordinary life; his restlessness is personal, not a verdict on the city.'
          dlg('LTS_C01_P04',[('SCREEN','Your Continuity Payment posts tomorrow.')])
          by['LTS_C01_P05']['summary']='Ordinary weekday montage: Chris finishes a real but unglamorous contract review, Ryan repairs marine gear by hand, and Kevin catches a tide-model exception worth saving.'
          dlg('LTS_C01_P05',[('SCREEN','Client patch verified. Human review requested.'),('Chris Barlow','Proud of us.'),('DISPLAY','Recommended replacement: Assembly Unit 4.'),('Ryan Kelleher','Nope.'),('SYSTEM','Recreational hazard potential: moderate.'),('Kevin Marsh','Moderate my ass.')])
          by['LTS_C01_P06']['summary']='Justin finishes a difficult indoor climbing route and is bored five minutes later; Nicole, packing for the run, folds an old harbor map she already owns because Sector 14 is printed on it.'
          dlg('LTS_C01_P06',[('DISPLAY','ROUTE COMPLETE / 96TH PERCENTILE'),('Justin Rourke','Cool.'),('MAP','HARBOR PHASE EXPANSION CORRIDOR — SECTOR 14')])
          by['LTS_C01_P06']['directionInline']=[{'text':'Nicole is packing for the run, not researching or solving Sector 14; the map is ordinary practical curiosity.'}]
          by['LTS_C01_P07']['summary']='The group gathers at a warm, busy inland bar. They are comfortable here and genuinely enjoy one another; Chris’s complaint is about their own stalled expectations, not proof the city is dead.'
          by['LTS_C01_P08']['summary']='Chris admits what bothers him: the old idea that adulthood would force a defining move never happened for him. Matt pushes back because he actually likes Harbor Phase.'
          dlg('LTS_C01_P08',[('Chris Barlow','My parents moved three states chasing work before they were thirty.'),('Justin Rourke','Your parents were insane.'),('Chris Barlow','Everybody we know still lives twenty minutes from high school.'),('Matt Donnelly','Some of us like it here.'),('Chris Barlow','I like it here.'),('Justin Rourke','Strong argument.'),('Chris Barlow','That’s the problem with my argument.')])
          by['LTS_C01_P09']['summary']='Runner channels light up with an outer-shelf rumor; the old group chat asks if they are going tonight. Sector 14 is a tantalizing name on Nicole’s old map, not a research problem.'
          dlg('LTS_C01_P09',[('MESSAGE','outer shelf maybe opening tonight'),('MESSAGE','Reach window?'),('GROUP CHAT','You going tonight?'),('Justin Rourke','Oh hell yes.'),('Kevin Marsh','That window is weird.'),('Nicole Hanley','Sector 14? That’s the one on my old harbor map.'),('Chris Barlow','So we’re going.')])
          by['LTS_C01_P19']['summary']='Mud gives way to old pavement that keeps going farther than anyone expected. Nicole notices the scale without turning it into a technical mystery.'
          dlg('LTS_C01_P19',[('Chris Barlow','Road markings. Incredible detective work.'),('Nicole Hanley','They keep going.'),('Matt Donnelly','So?'),('Nicole Hanley','So that’s a lot of road for “nothing out here.”')])
          by['LTS_C01_P21']['summary']='Concrete foundations and transit fragments show the mundane scale of the abandoned plan; a battered Sector 14 sign gives the place an ordinary official name rather than a hidden-history revelation.'
          dlg('LTS_C01_P21',[('SIGN','SECTOR 14 / TRANSIT LOOP C / SERVICE ACCESS'),('Kevin Marsh','They built way farther out than I pictured.'),('Nicole Hanley','Yeah. That’s a city.')])
          by['LTS_C02_P02']['summary']='Outer structures resolve into parking decks, ramps, and plazas. Nicole is struck by how ordinary they look; Kevin clocks that the group is already slow.'
          dlg('LTS_C02_P02',[('Nicole Hanley','That’s a parking deck.'),('Chris Barlow','That makes me feel less safe.'),('Kevin Marsh','We’re already eight minutes slower than the model.'),('Matt Donnelly','Then we don’t stand around.')])
          dlg('LTS_C02_P03',[('WALL','SAFE RAMP ↓ / TIDE HOLD 2H / NO SOUTH ENTRY / FUCK SOUTH ENTRY'),('Justin Rourke','Finally. Civic honesty.'),('Chris Barlow','This is language. This is culture.'),('Ryan Kelleher','It’s paint.'),('Nicole Hanley','People have been arguing with this wall for a while.'),('Kevin Marsh','Who verified the two-hour hold?'),('Matt Donnelly','Nobody is trusting bathroom-wall tide math.')])
          by['LTS_C02_P13']['summary']='At the railing, the flooded mall still makes ordinary sense. Nicole recognizes a cheap flooring pattern from her first apartment; familiarity lands harder than exposition.'
          dlg('LTS_C02_P13',[('Chris Barlow','The weird thing is it still makes sense.'),('Matt Donnelly','It’s a mall.'),('Chris Barlow','Yeah. That’s what I mean.'),('Nicole Hanley','My first apartment had that exact flooring.')])
          by['LTS_C03_P02']['summary']='Preparation repeats with variations: Ryan reads water, Kevin saves charts, Chris has the wrong socks, Justin has vertical gear, Nicole packs extra socks and one folded map, Matt fixes straps.'
          by['LTS_C03_P05']['summary']='Inland rhythm changes for different reasons: Justin finishes a hard climb and immediately checks the next tide window; Chris ignores a contract ping; Kevin compares forecasts; Nicole leaves ordinary plans unanswered while repacking; Ryan watches the water.'
          dlg('LTS_C03_P05',[('MESSAGE','brunch still on tomorrow?')])
          save(base/'pages_ch01_ch03_compiled.json',pages)

          # ---- Manifest: all seven chapters use the same chef-visible dramatic contract ----
          manifest=load('data/shows.json')
          generation='Finished full-color portrait prestige indie comic page for Low Tide Signal. Grounded coastal science fiction with naturalistic adult ensemble acting, wet concrete, fog, black tidal water, practical light, teal/amber/gray palette, and professional integrated lettering. Harbor Phase is a viable, comfortable city with real social life, not a dystopia; the Reach is tempting because each lead wants something different from it. Preserve old-friend familiarity and distinct behavior. Nicole is a fully tempted participant—never the explainer, philosopher, scold, corrective woman, archivist, or Sector 14 detective. Treat Reach history as visible environmental residue, not conspiracy or municipal mystery. No supernatural effects, lanterns, or generic cyberpunk neon. Fictional production.'
          specs={
            1:('The Flats','pages_ch01_ch03_compiled.json',None),2:('The Dead Mall','pages_ch01_ch03_compiled.json',None),3:('No Signal','pages_ch01_ch03_compiled.json',None),
            4:('Between Runs','encoded/pages_c04_between_runs_enhanced.json.gzb64','gzip-base64'),5:('Return Tide','encoded/pages_c05_return_tide_enhanced.json.gzb64','gzip-base64'),6:('After the Water','encoded/pages_c06_after_the_water_enhanced.json.gzb64','gzip-base64'),7:('The Last Low Tide','encoded/pages_c07_last_low_tide_enhanced.json.gzb64','gzip-base64')}
          old=[s for s in manifest if not (s.get('seriesId')=='low-tide-signal' or s.get('id','').startswith('low-tide-signal-c'))]
          first=min(i for i,s in enumerate(manifest) if s.get('id')=='low-tide-signal-c01')
          entries=[]
          for n,(title,file,enc) in specs.items():
            overlay={'file':file}
            if enc: overlay['encoding']=enc
            entries.append({'id':f'low-tide-signal-c{n:02d}','name':f'Low Tide Signal — Chapter {n} — {title}','seriesId':'low-tide-signal','seriesName':'Low Tide Signal','issueLabel':f'Chapter {n} — {title}','basePath':'data/shows/low-tide-signal','scenesFile':'pages_base.json','unitLabel':'PAGE','generationLine':generation,'sceneOverlays':[overlay],'includeIdPattern':f'^LTS_C{n:02d}_'})
          # Preserve location of series block in manifest.
          before=[s for s in manifest[:first] if not (s.get('seriesId')=='low-tide-signal' or s.get('id','').startswith('low-tide-signal-c'))]
          after=[s for s in manifest[first:] if not (s.get('seriesId')=='low-tide-signal' or s.get('id','').startswith('low-tide-signal-c'))]
          manifest=before+entries+after
          save('data/shows.json',manifest)

          # ---- Mechanical validation across source + encoded chapters ----
          pages_all=list(pages)
          encoded_files=[specs[n][1].split('/',1)[1] for n in range(4,8)]
          for f in encoded_files:
            raw=''.join((base/'encoded'/f).read_text().split())
            decoded=json.loads(gzip.decompress(base64.b64decode(raw)))
            pages_all.extend(decoded.get('pages',decoded) if isinstance(decoded,dict) else decoded)
          ids=[p.get('id') for p in pages_all]
          assert len(ids)==len(set(ids)), 'duplicate page ids'
          missing_settings=sorted({p.get('setting') for p in pages_all if p.get('setting') and p.get('setting') not in settings})
          missing_regions=sorted({p.get('region') for p in pages_all if p.get('region') and p.get('region') not in regions})
          missing_chars=sorted({c for p in pages_all for c in p.get('characters',[]) if c not in chars})
          assert not missing_settings, f'missing settings {missing_settings}'
          assert not missing_regions, f'missing regions {missing_regions}'
          assert not missing_chars, f'missing chars {missing_chars}'
          by_ch={}
          for p in pages_all:
            m=re.match(r'LTS_C(\d\d)_',p.get('id',''))
            if m: by_ch.setdefault(int(m.group(1)),[]).append(p)
          expected={1:24,2:26,3:28,4:26,5:24,6:24,7:26}
          assert {k:len(v) for k,v in by_ch.items()}==expected
          for ch,ps in by_ch.items():
            nums=sorted(p['page'] for p in ps)
            assert nums==list(range(1,len(ps)+1)), f'nonsequential chapter {ch}'
          low=[s for s in manifest if s.get('seriesId')=='low-tide-signal']
          assert [s['id'] for s in low]==[f'low-tide-signal-c{n:02d}' for n in range(1,8)]
          assert all(s['generationLine']==generation for s in low)
          assert all('text' in e and e['text'] for e in settings.values())
          assert all(chars[k].get('performance') and chars[k].get('relationship') and chars[k].get('promptContinuity') for k in updates)
          index=Path('index.html').read_text()
          for needle in ['e.performance','e.relationship','e.promptContinuity','if(s.settingText)','show.generationLine','s.directionInline']:
            assert needle in index, f'assembler contract changed: {needle}'

          # Representative chef render: mirror only fields relevant to this audit.
          def fmt_entry(e):
            if isinstance(e,str): return e
            return e.get('text') or e.get('name') or e.get('summary') or json.dumps(e)
          def fmt_char(e):
            parts=[e.get('name','')]
            v=e.get('visualAnchor') or e.get('visual') or e.get('appearance') or e.get('visualDescription')
            if v: parts.append('Identity: '+v)
            if e.get('wardrobe'): parts.append('Wardrobe: '+e['wardrobe'])
            if e.get('performance'): parts.append('Performance: '+e['performance'])
            if e.get('relationship'): parts.append('Relationship: '+e['relationship'])
            if e.get('promptContinuity'): parts.append('Continuity: '+'; '.join(e['promptContinuity']))
            return ' — '.join(parts)
          reps=['LTS_C01_P04','LTS_C02_P13','LTS_C05_P18','LTS_C07_P16']
          for rid in reps:
            p=next(x for x in pages_all if x['id']==rid)
            parts=[generation,p.get('summary','')]
            if p.get('setting'): parts.append(fmt_entry(settings[p['setting']]))
            parts += [fmt_char(chars[c]) for c in p.get('characters',[]) if c in chars]
            for d in p.get('dialogueInline',[]): parts.append((d.get('speaker') or d.get('handle',''))+': '+d.get('text',''))
            for d in p.get('directionInline',[]): parts.append(fmt_entry(d))
            text='\n'.join(parts)
            assert 'viable, comfortable city' in text
            if 'C_lts_nicole_hanley' in p.get('characters',[]):
              assert 'never the explainer' in text or 'fully tempted' in text
            assert '[missing]' not in text
            print('CHEF REPRESENTATIVE',rid,'OK chars',len(p.get('characters',[])),'setting',p.get('setting'))
          terms=['municipal mystery','hidden maps','structurally unnecessary','pleasant but dead','optimized wall','Nicole maps']
          corpus=json.dumps(pages_all,ensure_ascii=False)
          print('LEGACY PHRASE HITS',{t:corpus.lower().count(t.lower()) for t in terms})
          print('LOW TIDE COUNTS',{k:len(v) for k,v in sorted(by_ch.items())})
          print('LOW TIDE MANIFEST',[s['id'] for s in low])
          print('MISSING SETTINGS',missing_settings)
          print('MISSING REGIONS',missing_regions)
          print('MISSING CHARACTERS',missing_chars)
          PY
