name: Stardust final staging polish

on:
  push:
    branches:
      - fix/stardust-visual-first-final2-20260911
    paths:
      - .github/workflows/stardust-final-staging-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stardust-visual-first-final2-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Polish residual generic staging
        run: python tools/tmp_polish_stardust_dialogue_staging.py
      - name: Validate Stardust
        run: python tools/validate_stardust_station.py
      - name: Commit production-only polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Stardust image staging"
          git push
