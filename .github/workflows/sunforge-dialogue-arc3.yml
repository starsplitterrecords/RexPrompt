name: Sunforge dialogue rewrite issues 9-12
on:
  push:
    branches: [sunforge-dialogue-pass-20260914]
    paths: ['.github/workflows/sunforge-dialogue-arc3.yml']
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunforge-dialogue-pass-20260914
      - name: Rewrite dialogue
        run: |
          python - <<'PY'
          import json, pathlib
          raw = r'''{
            "SUN_S1E09_P01": [["Mira Sloan","Names if you're eating."],["Kael","Kael Mack."],["Eva","Eva O'Leary."],["Jessa","Jessa Petrescu."],["Veyra","Veyra Linger."],["Samuel","Samuel Hayes."],["Mira Sloan","Good. Wash your hands."],["Eva","That's it?"],["Mira Sloan","You wanted references?"],["Jessa","She usually does."],["Eva","I do not."],["Kael","You absolutely do."]],
            "SUN_S1E09_P02": [["Samuel","I need a few days."],["Jessa","For what?"],["Samuel","Pell Oren is dying. His daughter won't come inside."],["Eva","And you think you can fix that?"],["Samuel","No."],["Eva","Then what are you doing?"],["Samuel","Seeing if they'll speak."],["Jessa","How long?"],["Samuel","I don't know."],["Jessa","All right."],["Samuel","That easy?"],["Jessa","You finally asked before deciding for us."]],
            "SUN_S1E09_P03": [["Eva","He lost again."],["Jessa","I know. I'm enjoying it."],["Eva","I thought he'd be good at cards."],["Jessa","Why?"],["Eva","He watches everyone."],["Jessa","Apparently not the cards."],["Eva","Nobody here has mistaken him for anybody."],["Jessa","Nobody here has had time. They're busy beating him."],["Eva","I'm serious."],["Jessa","So am I. You're waiting for him to become evidence and missing the part where he's a terrible loser."],["Eva","He is a terrible loser."],["Jessa","There. Progress."]],
            "SUN_S1E09_P04": [["Veyra","If the structure matters, this should be the loudest place we've seen."],["Eva","Maybe it's the wrong kind."],["Jessa","Maybe 'kind' is doing too much work."],["Veyra","Same material. Same ribs."],["Jessa","And a hundred different uses."],["Eva","What would convince you they aren't the same thing?"],["Veyra","I don't know yet."],["Kael","Stew?"],["Veyra","No."],["Kael","That sounded like certainty."]],
            "SUN_S1E09_P05": [["Mira Sloan","Did they make peace?"],["Samuel","No."],["Mira Sloan","That bad?"],["Samuel","Not bad. Honest."],["Mira Sloan","What's the difference?"],["Samuel","Tonight? They said the things they had left."],["Kael","Sometimes that's all there is time for."],["Eva","You two sound old."],["Jessa","One of them is."],["Samuel","Thank you, Jessa."],["Eva","I meant emotionally."],["Kael","That helped."]],
            "SUN_S1E09_P06": [["Jessa","You hate sweet coffee."],["Kael","Correct."],["Jessa","You don't cheat."],["Kael","Also correct."],["Jessa","You're awful at cards."],["Kael","Bad cards."],["Eva","Four days of bad cards?"],["Kael","Remarkably consistent."],["Veyra","Nothing happened here."],["Samuel","Pell died."],["Veyra","You know what I meant."],["Samuel","I know. I didn't like it."],["Eva","Nothing happened to Kael."],["Kael","I recommend it."],["Jessa","Don't get ambitious."]],
            "SUN_S1E10_P01": [["Eva","There are six."],["Jessa","Six what?"],["Eva","You know."],["Jessa","I don't want to know."],["Eva","People who look like they walked out of six different stories."],["Kael","That's called a town."],["Baird Rook","Welcome to the Rookery. Names?"],["Kael","Kael Mack."],["Baird Rook","Good. Owe nobody money by sunset and we'll get along."],["Eva","See?"],["Jessa","No."],["Baird Rook","I like whichever one of you is tired already."]],
            "SUN_S1E10_P02": [["Eva","Silver mask."],["Baird Rook","Neral. Burned himself cooking mash twelve years ago. He's my cousin."],["Eva","Red birds."],["Baird Rook","Tova. Birds are hers. Debt is mine."],["Eva","Dylan."],["Dylan","I'm right here."],["Eva","Why are you here?"],["Dylan","Baird owes me money."],["Baird Rook","Allegedly."],["Dylan","And feeds me."],["Jessa","You've been here five minutes and turned his cousin into a category."],["Eva","I said nothing about a category."],["Baird Rook","Your face did."]],
            "SUN_S1E10_P03": [["Dylan","Road says Varnok used to be a general."],["Kael","Road should pick one."],["Dylan","Tomas says you're Kael."],["Kael","Tomas is doing useful work."],["Eva","So the names are mixing together now."],["Jessa","Stories do that."],["Eva","Then the next town could call him anything and we won't know where it came from."],["Kael","That sounds like your problem."],["Eva","It is our problem."],["Kael","You keep promoting me into committees I didn't join."],["Dylan","That one sounds like Kael."]],
            "SUN_S1E10_P04": [["Veyra","Three Sunforge structures in one town."],["Baird Rook","No."],["Veyra","They're the same material."],["Baird Rook","So are most spoons."],["Eva","What do you call them?"],["Baird Rook","That one's the roof brace. That one's the old black thing. That one's the bench everybody hates."],["Jessa","Why does everybody hate the bench?"],["Baird Rook","Gets hot."],["Veyra","You're avoiding the question."],["Baird Rook","No. You're using one word for three things I have three stories about."],["Eva","Tell us the stories."]],
            "SUN_S1E10_P05": [["Eva","Who told you something interesting was happening?"],["Dylan","Mara at South Cut."],["Baird Rook","Mara got it from Len."],["Samuel","Len told me Bellweather."],["Veyra","Bellweather heard about us after we left."],["Jessa","So nobody knows where it started."],["Samuel","Everybody knows who told them. That's different."],["Eva","Can we walk it backward?"],["Baird Rook","You can try. You'll end up at somebody's cousin."],["Kael","Before or after supper?"],["Baird Rook","After."],["Kael","Then I support the investigation."]],
            "SUN_S1E10_P06": [["Baird Rook","You met Neral with the mask. I knew him when he had eyebrows."],["Veyra","That doesn't explain every recurrence."],["Baird Rook","Didn't say it did. Stop charging me for the ones I can explain."],["Eva","What if a place like this attracts unusual people?"],["Jessa","What if unusual is just what people look like from far away?"],["Eva","Kael still looks unusual up close."],["Kael","I'm sitting right here."],["Baird Rook","She's not wrong."],["Kael","I liked this town better five minutes ago."],["Jessa","You owed nobody money then."]],
            "SUN_S1E11_P01": [["Renna Iles","Jessa Petrescu!"],["Jessa","Oh, hell."],["Eva","She got your name right."],["Kael","Try not to look frightened."],["Jessa","I am not frightened."],["Renna Iles","You vanished."],["Jessa","I left."],["Renna Iles","You left without saying goodbye."],["Jessa","Yes."],["Renna Iles","That's vanishing with luggage."],["Eva","I like her."],["Jessa","Of course you do."]],
            "SUN_S1E11_P02": [["Renna Iles","You lived in that room eight months."],["Jessa","Four."],["Renna Iles","You complained for eight."],["Jessa","I complain efficiently."],["Eva","You lived somewhere four months?"],["Jessa","Don't make it sound medical."],["Renna Iles","She had a blue cup."],["Eva","No."],["Renna Iles","Loved that cup."],["Jessa","I owned a cup."],["Renna Iles","Cried when it broke."],["Jessa","I swore."],["Renna Iles","There were tears."],["Eva","I'm never leaving."]],
            "SUN_S1E11_P03": [["Renna Iles","You leave while things are still good."],["Jessa","That's a strange complaint."],["Renna Iles","It's not a complaint. It's a pattern."],["Jessa","You always loved a pattern."],["Renna Iles","You always hated anyone noticing yours."],["Eva","I can go."],["Jessa","No. Stay."],["Renna Iles","See?"],["Jessa","Say 'growth' and I leave tonight."],["Renna Iles","I wasn't going to."],["Jessa","You were."],["Renna Iles","A little."],["Renna Iles","When people start saying next month instead of tomorrow, you pack."],["Jessa","I like knowing the door still opens."],["Renna Iles","I know."]],
            "SUN_S1E11_P04": [["Eva","What happened with them?"],["Kael","Ask Jessa."],["Eva","I'm asking what you think."],["Kael","That's cheaper."],["Eva","You have an opinion."],["Kael","I have several."],["Eva","And?"],["Kael","And she gets first pick."],["Eva","You could just tell me."],["Kael","I could also mend this sleeve wrong. Neither improves anything."],["Eva","That was almost wise."],["Kael","Don't tell Jessa."]],
            "SUN_S1E11_P05": [["Eva","Why did you leave?"],["Jessa","I wanted to."],["Eva","I know the short version."],["Jessa","It's still the true one."],["Eva","What's the inconvenient version?"],["Jessa","I liked it here. Then everyone started talking about next year like I'd already signed something."],["Eva","So you ran."],["Jessa","No. I left before staying became the default."],["Eva","Renna thinks you do that everywhere."],["Jessa","Renna is allowed to be right about some things."],["Eva","Will you do it to us?"],["Jessa","I don't know."],["Eva","That's it?"],["Jessa","That's the honest answer."],["Eva","Okay."]],
            "SUN_S1E11_P06": [["Renna Iles","Stay for supper."],["Jessa","We can make the next stop before dark."],["Renna Iles","I know."],["Kael","Do you want to stay?"],["Jessa","Don't help."],["Kael","Wasn't trying to."],["Renna Iles","I like him."],["Jessa","You would."],["Jessa","One night."],["Eva","..."],["Jessa","Thank you."],["Eva","I didn't say anything."],["Jessa","That's why I thanked you."],["Kael","Don't ruin it."],["Eva","I wasn't going to."],["Eva","I was thinking it."]],
            "SUN_S1E12_P01": [["Maela Crow","Darrow Keene."],["Kael","No, ma'am."],["Maela Crow","Don't start. I've been waiting since winter."],["Kael","That's a long time to wait for the wrong man."],["Eva","We've heard this part before."],["Jessa","Not like that."],["Veyra","Who told you he was coming?"],["Maela Crow","Woman passing through. Green scarf. Shaved on the left side."],["Samuel","When?"],["Maela Crow","Last winter."],["Samuel","It wasn't me."],["Maela Crow","I remember you. It wasn't."]],
            "SUN_S1E12_P02": [["Maela Crow","Lysa gave me this for Darrow."],["Kael","Then keep it for him."],["Maela Crow","She died."],["Kael","I'm sorry."],["Maela Crow","She made me promise."],["Kael","I understand."],["Maela Crow","Do you? The traveler described your face, your coat, even the way you stand near a door."],["Jessa","That part is accurate."],["Kael","Thank you."],["Maela Crow","Open it."],["Kael","I can't."],["Maela Crow","Won't."],["Kael","That too."],["Maela Crow","Why?"],["Kael","Because his name is on it."]],
            "SUN_S1E12_P03": [["Veyra","This entry is last winter."],["Samuel","I hadn't met you."],["Veyra","I hadn't heard Kael's name."],["Eva","How much later?"],["Veyra","Five months."],["Jessa","Could the Last Drop story have doubled back?"],["Veyra","The Last Drop hadn't happened."],["Eva","Check it again."],["Veyra","I have."],["Eva","Twice?"],["Veyra","Three times."],["Maela Crow","If it helps, I remember being annoyed the same day."],["Samuel","It doesn't."],["Maela Crow","Good. I was worried you'd wasted my irritation."]],
            "SUN_S1E12_P04": [["Veyra","We still have to ask whether he knows Darrow."],["Eva","Do we?"],["Veyra","You don't know every year of his life."],["Jessa","Neither do you."],["Veyra","That's my point."],["Jessa","No. Your point used to be that one of the names would make him slip. They didn't."],["Eva","If Kael was hiding Darrow, he'd have to be doing a very strange job of it."],["Kael","Thank you. I think."],["Eva","You complain when people think you're mysterious and when they don't."],["Kael","I don't remember complaining about the second one."],["Samuel","He has a point."],["Jessa","Don't encourage him."]],
            "SUN_S1E12_P05": [["Maela Crow","I wanted you to be him."],["Kael","I know."],["Maela Crow","Then I could hand this over and be done."],["Kael","You still can be done."],["Maela Crow","By breaking a promise?"],["Kael","I didn't say that."],["Maela Crow","Then what are you saying?"],["Kael","Maybe the promise was to keep it until Darrow came. Darrow didn't."],["Maela Crow","That's not an answer."],["Kael","No. It's just the part I know."],["Maela Crow","And the rest?"],["Kael","Yours."],["Samuel","That was almost pastoral."],["Kael","Don't ruin it."]],
            "SUN_S1E12_P06": [["Eva","I was wrong."],["Kael","About which part?"],["Eva","I kept thinking one of the names was the question."],["Jessa","And now?"],["Eva","The woman in the green scarf knew his face before any of us were on this road."],["Veyra","Yes."],["Eva","That's the first thing I actually want an answer to."],["Kael","You've wanted answers to everything."],["Eva","Not like this."],["Jessa","Unfortunately, neither do I."],["Kael","Can we at least walk while you become obsessed?"],["Eva","We?"],["Kael","Don't."]]
          }'''
          repl=json.loads(raw)
          base=pathlib.Path('data/shows/sunforge-outlaw-s1')
          for issue in range(9,13):
              path=base/f'pages_e{issue:02d}.json'
              pages=json.loads(path.read_text(encoding='utf-8'))
              for page in pages:
                  if page['id'] in repl:
                      page['dialogueInline']=[{'speaker':s,'text':t} for s,t in repl[page['id']]]
              path.write_text(json.dumps(pages,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit rewrite and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sunforge-dialogue-arc3.yml
          git add data/shows/sunforge-outlaw-s1/pages_e09.json data/shows/sunforge-outlaw-s1/pages_e10.json data/shows/sunforge-outlaw-s1/pages_e11.json data/shows/sunforge-outlaw-s1/pages_e12.json
          git commit -m 'Rewrite Sunforge dialogue issues 9-12'
          git push origin HEAD:sunforge-dialogue-pass-20260914
