name: Sanitize Rex Fleet PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event.pull_request.head.ref == 'sanitize-rex-fleet' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize-rex-fleet
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply sanitation data transforms
        run: |
          awk '/python - <<'"'"'PY'"'"'/{flag=1;next} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' .github/workflows/sanitize-rex-fleet.yml > /tmp/sanitize_rex_fleet.py
          set +e
          OUTPUT=$(python /tmp/sanitize_rex_fleet.py 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ] && ! printf '%s' "$OUTPUT" | grep -q 'index.html character helper anchor not found'; then
            exit "$STATUS"
          fi
      - name: Patch assembler and audit sanitation
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json

          root = Path('.')
          show_dir = root / 'data' / 'shows' / 'rex-fleet-s1'
          index = root / 'index.html'

          html = index.read_text(encoding='utf-8')
          if 'function findCharacterByHandle' not in html:
              needle = 'function normalizeScenes(raw)'
              helper = 'function findCharacterByHandle(h,c){return Object.values(c||{}).find(e=>e&&(e.handle===h||(Array.isArray(e.aliases)&&e.aliases.includes(h))))}function formatCharacter(e,fallback){if(!e)return fallback;const p=[e.name||fallback];if(e.role)p.push(e.role);if(e.voice)p.push("Voice: "+e.voice);return p.join(" — ")}function normalizeScenes(raw)'
              if needle not in html:
                  raise SystemExit('normalizeScenes assembler anchor missing')
              html = html.replace(needle, helper, 1)

          old_chars = 'if(s.charactersInline?.length){out.push("\\n[CHARACTERS]");s.charactersInline.forEach(c=>out.push(c.name||c.handle))}else if(s.characters?.length){out.push("\\n[CHARACTERS]");s.characters.forEach(k=>{const e=store["characters.json"]?.[k];if(e)out.push(formatEntry(e))})}'
          new_chars = 'if(s.charactersInline?.length){out.push("\\n[CHARACTERS]");s.charactersInline.forEach(c=>{const e=findCharacterByHandle(c.handle,store["characters.json"]||{});out.push(formatCharacter(e,c.name||c.handle))})}else if(s.characters?.length){out.push("\\n[CHARACTERS]");s.characters.forEach(k=>{const e=store["characters.json"]?.[k];if(e)out.push(formatCharacter(e,k))})}'
          if old_chars in html:
              html = html.replace(old_chars, new_chars, 1)
          elif new_chars not in html:
              raise SystemExit('character rendering assembler anchor missing')

          old_dir = 'if(s.directionInline?.length){out.push("\\n[DIRECTION]");s.directionInline.forEach(x=>out.push(formatEntry(x)))}else if(s.direction?.length){out.push("\\n[DIRECTION]");s.direction.forEach(k=>{const e=store["direction.json"]?.[k];if(e)out.push(formatEntry(e))})}'
          new_dir = 'if(s.continuityFrom)out.push("\\n[CONTINUITY]\\nContinue directly from "+s.continuityFrom+"; preserve established positions, props, damage, eyelines, and emotional state.");if(s.directionInline?.length){out.push("\\n[DIRECTION]");s.directionInline.forEach(x=>out.push(formatEntry(x)))}else if(s.direction?.length){out.push("\\n[DIRECTION]");s.direction.forEach(k=>{const e=store["direction.json"]?.[k];if(e)out.push(formatEntry(e))})}'
          if old_dir in html:
              html = html.replace(old_dir, new_dir, 1)
          elif new_dir not in html:
              raise SystemExit('direction rendering assembler anchor missing')
          index.write_text(html, encoding='utf-8')

          e1 = json.loads((show_dir / 'scenes_e01.json').read_text(encoding='utf-8'))
          dialogue_refs = [k for s in e1 for k in s.get('dialog', [])]
          direction_refs = [k for s in e1 for k in s.get('direction', [])]
          setting_refs = list(dict.fromkeys(s['setting'] for s in e1 if s.get('setting')))
          if set(json.loads((show_dir / 'dialogue.json').read_text())) != set(dialogue_refs):
              raise SystemExit('stale dialogue lookup entries survived')
          if set(json.loads((show_dir / 'direction.json').read_text())) != set(direction_refs):
              raise SystemExit('stale direction lookup entries survived')
          if set(json.loads((show_dir / 'settings.json').read_text())) != set(setting_refs):
              raise SystemExit('stale setting entries survived')

          chars = json.loads((show_dir / 'characters.json').read_text())
          forbidden_ids = {'C_mother_soft','C_venn_soft_to_herself','C_jex_low','C_billie_low','C_tess_vo','C_kerr_cerulean','C_triarch_voice','C_rhyne_aegis','C_keating_ember'}
          residue = forbidden_ids & set(chars)
          if residue:
              raise SystemExit(f'pseudo/duplicate character records survived: {sorted(residue)}')
          handles = [v.get('handle') for v in chars.values() if v.get('handle')]
          if len(handles) != len(set(handles)):
              raise SystemExit('duplicate primary character handles survived')
          chars_blob = json.dumps(chars, ensure_ascii=False)
          if 'Production reference:' in chars_blob or 'Source speaker label:' in chars_blob:
              raise SystemExit('correction/source-label prose survived character data')

          shows = json.loads((root / 'data' / 'shows.json').read_text())
          rf = next(s for s in shows if s.get('id') == 'rex-fleet-s1')
          gen = rf.get('generationLine', '')
          if 'comic-book' not in gen or '10-second vertical clip' in gen or 'TV style' in gen:
              raise SystemExit('Rex Fleet production mode is not sanitized')

          def load_encoded(path):
              text = ''.join(path.read_text().split())
              return json.loads(gzip.decompress(base64.b64decode(text, validate=True)).decode('utf-8'))

          scenes = list(json.loads((show_dir / 'scenes_e02.json').read_text()))
          for n in range(3, 13):
              scenes.extend(load_encoded(show_dir / 'encoded' / f'scenes_e{n:02d}.json.gzb64'))
          ids = {s.get('id') for s in scenes}
          boilerplate = {
              'Play the dialogue as an exchange with listening, interruption and reaction; avoid posed recitation. Keep faces readable and let the environment stay active.',
              'Continuous from the prior beat in this location; preserve positions, props, damage, eyelines and emotional momentum.',
              'Let this visual beat breathe long enough to establish consequence before the next exchange.'
          }
          for scene in scenes:
              for item in scene.get('directionInline', []):
                  if item.startswith('Performance:') or item in boilerplate:
                      raise SystemExit(f"scene scaffold survived: {scene.get('id')}")
              target = scene.get('continuityFrom')
              if target and target not in ids:
                  raise SystemExit(f"broken continuityFrom on {scene.get('id')}: {target}")

          print('Rex Fleet sanitation audit passed')
          PY
      - name: Validate Rex Fleet
        run: python tools/validate_rex_fleet.py
      - name: Commit sanitized package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html data/shows.json data/shows/rex-fleet-s1
          if git diff --cached --quiet; then
            echo 'No sanitation changes.'
            exit 0
          fi
          git commit -m "Sanitize Rex Fleet production package"
          git push origin HEAD:sanitize-rex-fleet
