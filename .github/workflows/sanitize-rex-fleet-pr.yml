name: Sanitize Rex Fleet PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event.pull_request.head.ref == 'sanitize-rex-fleet' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize-rex-fleet
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and apply sanitation
        run: |
          awk '/python - <<'"'"'PY'"'"'/{flag=1;next} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' .github/workflows/sanitize-rex-fleet.yml > /tmp/sanitize_rex_fleet.py
          python /tmp/sanitize_rex_fleet.py
      - name: Validate Rex Fleet
        run: python tools/validate_rex_fleet.py
      - name: Commit sanitized package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html data/shows.json data/shows/rex-fleet-s1
          if git diff --cached --quiet; then
            echo 'No sanitation changes.'
            exit 0
          fi
          git commit -m "Sanitize Rex Fleet production package"
          git push origin HEAD:sanitize-rex-fleet
