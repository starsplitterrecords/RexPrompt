name: Audit final Low Tide page-plan specificity
on:
  push:
    paths:
      - '.github/workflows/audit-low-tide-final-specificity.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report all thin or meta-contaminated page plans
        run: |
          python - <<'PY'
          import tools.validate_low_tide_img_normalization as v
          pages=v.load_all_pages()
          thin=[]; meta=[]
          for p in pages:
            plan=p.get('panelPlan') or []
            hits=len(v.DRAWABLE.findall(' '.join(plan)))
            if hits < (1 if len(plan)==1 else 2): thin.append((p['id'],hits,plan))
            for i,line in enumerate(plan,1):
              if v.CHEF_META.search(line): meta.append((p['id'],i,line))
            if v.CHEF_META.search(p.get('summary','')): meta.append((p['id'],'summary',p.get('summary')))
          print('THIN',len(thin))
          for x in thin: print(x[0],'| hits',x[1],'|',' || '.join(x[2]))
          print('META',len(meta))
          for x in meta: print(x)
          PY
