name: Audit final Low Tide page-plan specificity
on:
  push:
    paths:
      - '.github/workflows/audit-low-tide-final-specificity.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print nine thin page objects
        run: |
          python - <<'PY'
          import json
          import tools.validate_low_tide_img_normalization as v
          targets={'LTS_C04_P13','LTS_C05_P01','LTS_C05_P07','LTS_C06_P06','LTS_C06_P08','LTS_C06_P12','LTS_C06_P18','LTS_C06_P20','LTS_C07_P13'}
          for p in v.load_all_pages():
            if p.get('id') in targets:
              print('PAGE_OBJECT',p['id'])
              print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
