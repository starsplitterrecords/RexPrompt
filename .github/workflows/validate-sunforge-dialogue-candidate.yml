name: Validate Sunforge dialogue candidate

on:
  push:
    branches:
      - validate-sunforge-dialogue-20260914
    paths:
      - '.github/workflows/validate-sunforge-dialogue-candidate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Sunforge package and isolate review manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/shows/sunforge-outlaw-s1')
          ids=[]
          for issue in range(1,13):
              p=root/f'pages_e{issue:02d}.json'
              pages=json.loads(p.read_text(encoding='utf-8'))
              expected=7 if issue==1 else 6
              assert len(pages)==expected, (issue,len(pages))
              for page in pages:
                  assert page['id'] not in ids, page['id']
                  ids.append(page['id'])
                  assert page.get('dialogueInline'), page['id']
                  for line in page['dialogueInline']:
                      assert line.get('speaker') and line.get('text'), (page['id'],line)
          assert len(ids)==73 and len(set(ids))==73
          manifest_path=Path('data/shows.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          sun=[x for x in manifest if x.get('seriesId')=='sunforge-outlaw']
          assert len(sun)==12, len(sun)
          manifest_path.write_text(json.dumps(sun,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Validated 73 Sunforge pages and 12 issue registrations')
          PY
      - name: Build Sunforge production review
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.2.5
          python tools/export_review_pdfs.py --out dist/sunforge-review
      - name: Confirm review output
        run: |
          test -f dist/sunforge-review/review-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('dist/sunforge-review/review-manifest.json').read_text())
          assert len(data['productions'])==1, data
          prod=data['productions'][0]
          assert prod['units']==73, prod
          print(json.dumps(prod,indent=2))
          PY
