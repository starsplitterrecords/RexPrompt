name: Materialize active comic pages for dialogue audit

on:
  push:
    branches: [dialogue-continuity-all-series-20260919]
    paths:
      - '.github/workflows/materialize-dialogue-audit.yml'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dialogue-continuity-all-series-20260919
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5
      - name: Materialize active page recipes
        run: |
          mkdir -p dist/dialogue-audit
          python - <<'PY'
          import json, pathlib, re, importlib.util
          root=pathlib.Path('.').resolve()
          spec=importlib.util.spec_from_file_location('review', root/'tools'/'export_review_pdfs.py')
          review=importlib.util.module_from_spec(spec); spec.loader.exec_module(review)
          shows=json.loads((root/'data'/'shows.json').read_text())
          out={}
          for entry in shows:
              sid=entry.get('seriesId') or entry.get('id')
              if sid=='sunforge-outlaw':
                  continue
              unit=str(entry.get('unitLabel') or '').upper()
              base=str(entry.get('basePath') or 'data')
              files=entry.get('scenesFiles') or [entry.get('scenesFile','')]
              looks_page = unit=='PAGE' or any('page' in str(f).lower() for f in files if f)
              if not looks_page:
                  continue
              try:
                  units=review.load_entry_units(entry)
                  pat=entry.get('includeIdPattern')
                  if pat:
                      rx=re.compile(pat)
                      units=[u for u in units if rx.search(str(u.get('id','')))]
                  excluded=set(entry.get('excludeSceneIds',[]))
                  if excluded:
                      units=[u for u in units if u.get('id') not in excluded]
                  store=review.load_store(base)
                  cooked=[]
                  for u in units:
                      x=dict(u)
                      x['_resolvedDialogue']=review.resolve_dialogue(u,store)
                      cooked.append(x)
                  units=cooked
              except Exception as e:
                  out[entry['id']]={'entry':entry,'error':repr(e),'units':[]}
                  continue
              out[entry['id']]={'entry':entry,'units':units}
          (root/'dist'/'dialogue-audit'/'active-pages.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          summary={}
          for k,v in out.items():
              summary[k]={'name':v['entry'].get('name'),'seriesId':v['entry'].get('seriesId'),'basePath':v['entry'].get('basePath'),'units':len(v.get('units',[])),'error':v.get('error')}
          (root/'dist'/'dialogue-audit'/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - name: Verify targeted continuity patches
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib
          root=pathlib.Path('.')
          def dec(path):
              raw=''.join(path.read_text().split())
              return json.loads(gzip.decompress(base64.b64decode(raw)).decode())
          p=dec(root/'data/shows/vikings-2026-s1/encoded/pages_e01_p07_p12.json.gzb64')
          by={x['id']:x for x in p}
          assert by['VIK_S1I01_P08']['dialogueInline'][0]['text'].startswith('Municipal Department of Temporal Integration.')
          assert by['VIK_S1I01_P09']['dialogueInline'][-1]['text']=="Names, addresses, whatever you know. Just do your best."
          p=dec(root/'data/shows/vikings-2026-s1/encoded/pages_e01_p13_p18.json.gzb64')
          by={x['id']:x for x in p}
          assert by['VIK_S1I01_P14']['dialogueInline'][0]['text']=='Bathroom. Sink. Soap.'
          p=json.loads((root/'data/shows/vikings-2026-s1/pages_i07_p01_p06.json').read_text())
          by={x['id']:x for x in p}
          assert by['VIK_S1I07_P05']['dialogueInline'][0]['text']=='I mean I can want this now without promising it forever.'
          p=json.loads((root/'data/shows/low-tide-signal/pages_ch01_ch03_compiled.json').read_text())
          by={x['id']:x for x in p}
          assert by['LTS_C01_P13']['dialogueInline'][0]['text']=='There.'
          print('targeted continuity patches verified')
          PY
          python tools/validate_vikings_2026.py
          python tools/validate_low_tide_img_normalization.py
          python tools/export_review_pdfs.py --out dist/review-pdfs
      - uses: actions/upload-artifact@v4
        with:
          name: active-comic-pages-dialogue-audit
          path: |
            dist/dialogue-audit
            dist/review-pdfs
