name: Probe Shattering File Library Recovery

on:
  push:
    paths:
      - '.github/workflows/probe-shattering-file-library.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe anonymous ChatGPT file resolver
        shell: bash
        run: |
          python3 - <<'PY'
          import http.cookiejar, urllib.error, urllib.parse, urllib.request

          FILE_ID = 'file_000000008360820cbaeff6537994ea76'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def hit(label, url, headers=None):
              h = {'User-Agent': UA, 'Accept': 'application/json'}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, headers=h)
              try:
                  with opener.open(req, timeout=45) as r:
                      body = r.read(2048)
                      print(label, 'STATUS', r.status, 'CONTENT_TYPE', r.headers.get('Content-Type'), 'BYTES_READ', len(body))
                      print(label, 'BODY_PREFIX', body[:300].decode('utf-8', 'replace'))
              except urllib.error.HTTPError as e:
                  body = e.read(2048)
                  print(label, 'STATUS', e.code, 'CONTENT_TYPE', e.headers.get('Content-Type'), 'BYTES_READ', len(body))
                  print(label, 'BODY_PREFIX', body[:300].decode('utf-8', 'replace'))
              except Exception as e:
                  print(label, 'ERROR', type(e).__name__, str(e))

          try:
              with opener.open(urllib.request.Request('https://chatgpt.com/', headers={'User-Agent': UA}), timeout=45) as r:
                  r.read(1024)
              print('SESSION_COOKIES', [c.name for c in jar])
          except Exception as e:
              print('SESSION_ERROR', type(e).__name__, str(e))

          base = 'https://chatgpt.com/backend-api/files/download/' + FILE_ID
          hit('NO_QUERY', base)
          hit('INLINE_FALSE', base + '?inline=false')
          hit('EMPTY_SHARE', base + '?' + urllib.parse.urlencode({'shared_conversation_id':'','inline':'false'}))
          hit('ALT_PATH', 'https://chatgpt.com/backend-api/files/' + FILE_ID + '/download')
          PY
