    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dialogue-sunforge-current-four-20260913
          fetch-depth: 0
      - name: Rewrite dialogue and voice guidance
        run: |
          python - <<'PY'
