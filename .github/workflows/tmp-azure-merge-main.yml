name: Reconcile Azure Reach with main

on:
  push:
    branches:
      - enhance/azure-reach-park-world-20260910
    paths:
      - '.github/workflows/tmp-azure-merge-main.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/azure-reach-park-world-20260910
          fetch-depth: 0
      - name: Merge current main without losing Azure recipe changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "starsplitterrecords"
          git config user.email "77013062+starsplitterrecords@users.noreply.github.com"
          git fetch origin main
          cp data/shows.json /tmp/azure-branch-shows.json
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "data/shows.json" ]; then
              echo "Unexpected merge conflicts:"
              echo "$conflicts"
              exit 1
            fi
            git checkout --theirs data/shows.json
            python - <<'PY'
          import json, pathlib
          main_path=pathlib.Path('data/shows.json')
          branch_path=pathlib.Path('/tmp/azure-branch-shows.json')
          merged=json.loads(main_path.read_text())
          branch=json.loads(branch_path.read_text())
          branch_by_id={e.get('id'):e for e in branch}
          for entry in merged:
              if entry.get('id') in {'azure-reach-s1-e03','azure-reach-s1-e04','azure-reach-s1-e05','azure-reach-s1-e06'}:
                  entry['generationLine']=branch_by_id[entry['id']]['generationLine']
          main_path.write_text(json.dumps(merged,indent=2,ensure_ascii=False)+'\n')
          PY
            git add data/shows.json
          fi
          unresolved=$(git diff --name-only --diff-filter=U)
          test -z "$unresolved"
          python tools/validate_azure_reach.py
          if [ -f tools/validate_azure_reach_e02.py ]; then python tools/validate_azure_reach_e02.py; fi
          git rm -f .github/workflows/tmp-azure-merge-main.yml
          git add data/shows.json
          git commit -m "Merge main into Azure Reach enhancement"
          git push origin HEAD:enhance/azure-reach-park-world-20260910
