name: Apply Azure Reach Park-World Enhance

on:
  push:
    branches:
      - enhance/azure-reach-park-world-20260910
    paths:
      - '.github/workflows/tmp-azure-reach-writing-readback.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/azure-reach-park-world-20260910
          fetch-depth: 0
      - name: Apply Azure Reach editorial enhancement
        shell: python
        run: |
          import base64, gzip, json, pathlib, re

          ROOT=pathlib.Path('.')
          SHOW=ROOT/'data'/'shows'/'azure-reach-s1'
          payload_b64=''.join((SHOW/f'tmp_park_world_payload_{i:02d}.b64').read_text().strip() for i in range(5))
          payload_raw=base64.b64decode(payload_b64)
          P=json.loads(gzip.decompress(payload_raw).decode('utf-8'))

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path,data):
              path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          def decode(path):
              raw=''.join(path.read_text(encoding='utf-8').split())
              return json.loads(gzip.decompress(base64.b64decode(raw)).decode('utf-8'))

          def encode(path,data):
              raw=(json.dumps(data,indent=2,ensure_ascii=False)+'\n').encode('utf-8')
              enc=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode('ascii')+'\n'
              path.write_text(enc,encoding='utf-8')

          settings=load(SHOW/'settings.json')
          settings.update(P['settings_add'])
          dump(SHOW/'settings.json',settings)

          directions=load(SHOW/'direction.json')
          directions.update(P['direction_add'])
          dump(SHOW/'direction.json',directions)

          dump(SHOW/'season_one_plan.json',P['season_plan'])

          shows=load(ROOT/'data'/'shows.json')
          for entry in shows:
              if entry.get('id') in {'azure-reach-s1-e03','azure-reach-s1-e04','azure-reach-s1-e05','azure-reach-s1-e06'}:
                  entry['generationLine']=P['generation_line']
          dump(ROOT/'data'/'shows.json',shows)

          overlay_paths=[]
          pages={}
          for entry in shows:
              sid=str(entry.get('id',''))
              m=re.fullmatch(r'azure-reach-s1-e(\d{2})',sid)
              if not m or int(m.group(1)) < 2:
                  continue
              for overlay in entry.get('sceneOverlays',[]):
                  path=SHOW/overlay['file']
                  data=decode(path)
                  overlay_paths.append((path,data))
                  for page in data:
                      pages[page['id']]=page

          untouched={f'AZR_S1E02_P{n:02d}' for n in list(range(1,9))+[11]}
          before={pid:json.loads(json.dumps(pages[pid])) for pid in untouched}
          new_dirs=['AZR_DRAMATIC_ENGINE','AZR_ENVIRONMENT_ABUNDANCE','AZR_PARK_STAGING','AZR_SOFT_ENV_CONTINUITY']

          for pid,page in pages.items():
              if pid in untouched:
                  continue
              for key in new_dirs:
                  if key not in page.setdefault('direction',[]):
                      page['direction'].append(key)

          for pid,patch in P['page_patches'].items():
              page=pages[pid]
              for key,value in patch.items():
                  if value is None:
                      page.pop(key,None)
                  else:
                      page[key]=value

          for pid,old in before.items():
              assert pages[pid] == old, f'unexpected approved-page change: {pid}'

          changed=set(P['changed_overlays'])
          for path,data in overlay_paths:
              if path.name in changed:
                  encode(path,data)

          manifest_path=ROOT/'production'/'drafts'/'manifest.json'
          manifest=load(manifest_path)
          for pid in ['AZR_S1E02_P09','AZR_S1E02_P10']:
              manifest.get('drafts',{}).pop(f'azure-reach::azure-reach-s1-e02::{pid}',None)
          dump(manifest_path,manifest)

          meetingish={'AZR_OpsRoom','AZR_GuestExperienceSuite','AZR_BackstageHuddle','AZR_BreakArea'}
          for issue in range(2,7):
              issue_pages=[p for pid,p in pages.items() if pid.startswith(f'AZR_S1E{issue:02d}_')]
              assert len(issue_pages)==22, (issue,len(issue_pages))
              assert sum(p.get('setting') in meetingish for p in issue_pages)==0, f'Issue {issue} retains meeting-room default staging'
              if issue>=3:
                  assert all('AZR_DRAMATIC_ENGINE' in p.get('direction',[]) for p in issue_pages)
          assert len(settings)>=50
          assert 'process-improvement drama' in directions['AZR_DRAMATIC_ENGINE']['text']
          print('Azure Reach park-world enhancement applied')
          print('settings',len(settings),'page patches',len(P['page_patches']),'overlays',len(changed))

      - name: Validate Azure Reach
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_azure_reach.py
          if [ -f tools/validate_azure_reach_e02.py ]; then
            python tools/validate_azure_reach_e02.py
          fi

      - name: Commit production changes and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "starsplitterrecords"
          git config user.email "77013062+starsplitterrecords@users.noreply.github.com"
          git rm -f data/shows/azure-reach-s1/tmp_park_world_payload_{00,01,02,03,04}.b64
          git rm -f .github/workflows/tmp-azure-reach-writing-readback.yml
          git add data/shows.json data/shows/azure-reach-s1 production/drafts/manifest.json
          git status --short
          git commit -m "Enhance Azure Reach park-world storytelling"
          git push origin HEAD:enhance/azure-reach-park-world-20260910
