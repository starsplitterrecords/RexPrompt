# normalization runner v2
name: Normalize Backyard Rockets identities

on:
  push:
    branches:
      - normalize/backyard-rockets-rhonda-sylvie-20260911
    paths:
      - .github/workflows/normalize-backyard-rockets-rhonda-sylvie.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: normalize/backyard-rockets-rhonda-sylvie-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize identities in active production data
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, json, subprocess
          from pathlib import Path

          workflow = Path('.github/workflows/normalize-backyard-rockets-rhonda-sylvie.yml')
          rockets_encoded_root = Path('data/shows/backyard-rockets-s1/encoded')
          replacements = [
              ('Tamsin', 'Rhonda'),
              ('Tamz', 'Sylvie'),
              ('tamsin', 'rhonda'),
              ('tamz', 'sylvie'),
          ]

          def replace_text(text):
              for old, new in replacements:
                  text = text.replace(old, new)
              return text

          def replace_obj(obj):
              if isinstance(obj, str):
                  return replace_text(obj)
              if isinstance(obj, list):
                  return [replace_obj(x) for x in obj]
              if isinstance(obj, dict):
                  out = {}
                  for k, v in obj.items():
                      nk = replace_text(k) if isinstance(k, str) else k
                      if nk in out and nk != k:
                          raise RuntimeError(f'Key collision while renaming {k!r} -> {nk!r}')
                      out[nk] = replace_obj(v)
                  return out
              return obj

          def is_rockets_encoded(p):
              return p.name.endswith('.json.gzb64') and rockets_encoded_root in p.parents

          tracked = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              p = Path(raw.decode())
              if p == workflow or not p.is_file():
                  continue
              if is_rockets_encoded(p):
                  txt = p.read_text()
                  decoded = gzip.decompress(base64.b64decode(''.join(txt.split()), validate=True)).decode('utf-8')
                  obj = json.loads(decoded)
                  new_obj = replace_obj(obj)
                  if new_obj != obj:
                      payload = json.dumps(new_obj, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
                      p.write_text(base64.b64encode(gzip.compress(payload, mtime=0)).decode('ascii') + '\n')
                      changed.append(str(p))
                  continue
              try:
                  txt = p.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              new = replace_text(txt)
              if new != txt:
                  p.write_text(new)
                  changed.append(str(p))

          print('Changed files:')
          for p in changed:
              print(' ', p)
          if not changed:
              raise RuntimeError('No identity references were changed')

          residue = []
          for raw in tracked:
              if not raw:
                  continue
              p = Path(raw.decode())
              if p == workflow or not p.is_file():
                  continue
              if is_rockets_encoded(p):
                  txt = p.read_text()
                  decoded = gzip.decompress(base64.b64decode(''.join(txt.split()), validate=True)).decode('utf-8')
                  low = decoded.lower()
                  if 'tamsin' in low or 'tamz' in low:
                      residue.append(str(p) + ' [decoded]')
                  continue
              if p.name.endswith('.json.gzb64'):
                  continue
              try:
                  low = p.read_text().lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if 'tamsin' in low or 'tamz' in low:
                  residue.append(str(p))
          if residue:
              raise RuntimeError('Retired identity residue remains:\n' + '\n'.join(residue))

          chars = json.loads(Path('data/shows/backyard-rockets-s1/characters.json').read_text())
          assert chars['rhonda']['name'] == 'Rhonda'
          assert chars['rhonda']['handle'] == '@brk.Rhonda'
          assert chars['rhonda']['role'] == 'community water-systems operator'
          assert chars['sylvie']['name'] == 'Sylvie'
          assert chars['sylvie']['handle'] == '@brk.Sylvie'
          assert chars['sylvie']['role'] == 'desert scout'
          print('Identity shelf checks passed')
          PY
      - name: Validate Backyard Rockets production state
        shell: bash
        run: |
          python tools/validate_backyard_rockets_sanitization.py
          python tools/validate_backyard_rockets.py
          python tools/audit_backyard_rockets_continuity.py
      - name: Commit normalized production state and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/normalize-backyard-rockets-rhonda-sylvie.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+starsplitterrecords@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Normalize Backyard Rockets character identities"
          git push origin HEAD:normalize/backyard-rockets-rhonda-sylvie-20260911
