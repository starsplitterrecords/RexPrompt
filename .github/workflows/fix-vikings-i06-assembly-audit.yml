name: Fix Vikings Issue 6 assembly audit
on:
  push:
    branches: [productionize/vikings-issue6]
    paths:
      - tools/fix_vikings_i06_assembly_audit.py
      - .github/workflows/fix-vikings-i06-assembly-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productionize/vikings-issue6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_vikings_i06_assembly_audit.py
      - name: Commit audit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows/vikings-2026-s1/pages_i06_p01_p06.json data/shows/vikings-2026-s1/pages_i06_p07_p12.json data/shows/vikings-2026-s1/pages_i06_p13_p18.json data/shows/vikings-2026-s1/pages_i06_p19_p24.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean Vikings Issue 6 assembled visual instructions"
          git push origin HEAD:productionize/vikings-issue6
