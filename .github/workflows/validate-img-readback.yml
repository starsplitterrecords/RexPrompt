name: Validate Universal IMG Binary Transport
on:
  pull_request:
    paths:
      - 'tools/prepare_img_readback.cjs'
      - 'tools/prepare_issue_readback.cjs'
      - 'tools/persist_approved_draft.cjs'
      - 'tools/test_img_readback.cjs'
      - 'tools/test_img_transport_matrix.cjs'
      - 'tools/test_img_portfolio_inventory.cjs'
      - 'tools/test_atomic_img_persistence.cjs'
      - '.github/workflows/img-binary-readback.yml'
      - '.github/workflows/img-issue-readback.yml'
      - '.github/workflows/validate-img-readback.yml'
      - 'production/drafts/manifest.json'
      - 'production/references/reference-keeper-manifest.json'
      - 'production/book-manifests.json'
  push:
    branches: [main]
    paths:
      - 'tools/prepare_img_readback.cjs'
      - 'tools/prepare_issue_readback.cjs'
      - 'tools/persist_approved_draft.cjs'
      - 'tools/test_img_readback.cjs'
      - 'tools/test_img_transport_matrix.cjs'
      - 'tools/test_atomic_img_persistence.cjs'
      - '.github/workflows/img-binary-readback.yml'
      - '.github/workflows/img-issue-readback.yml'
      - 'production/drafts/manifest.json'
      - 'production/references/reference-keeper-manifest.json'
      - 'production/book-manifests.json'
permissions:
  contents: read
jobs:
  readback-and-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=10,<13"
      - name: Check source syntax
        run: |
          node --check tools/prepare_img_readback.cjs
          node --check tools/prepare_issue_readback.cjs
          node --check tools/persist_approved_draft.cjs
          node --check tools/test_img_readback.cjs
          node --check tools/test_img_transport_matrix.cjs
          node --check tools/test_img_portfolio_inventory.cjs
          node --check tools/test_atomic_img_persistence.cjs
      - name: Validate already-approved exact image retrieval
        run: node tools/test_img_readback.cjs
      - name: Cross-series complete/incomplete issue and negative-image transport matrix
        run: node tools/test_img_transport_matrix.cjs
      - name: Full portfolio native-image decode and exact original audit
        run: node tools/test_img_portfolio_inventory.cjs
      - name: Atomic persistence transaction and concurrency rejection
        run: node tools/test_atomic_img_persistence.cjs
      - name: Prepare independent session proof originals using canonical helper
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ASSET_KIND=draft ASSET_KEY='azure-reach::azure-reach-s1-e02::AZR_S1E02_P09' READBACK_OUTPUT=/tmp/transport-proof/draft node tools/prepare_img_readback.cjs
          ASSET_KIND=reference ASSET_KEY='division-threshold::character::axiom' READBACK_OUTPUT=/tmp/transport-proof/reference node tools/prepare_img_readback.cjs
      - name: Upload exact source image proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: img-session-visual-proof
          path: /tmp/transport-proof/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
