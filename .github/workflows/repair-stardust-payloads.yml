name: Repair Stardust payload transport

on:
  push:
    branches:
      - stardust-issues4-10-enhance-20260822
    paths:
      - '.github/workflows/repair-stardust-payloads.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stardust-issues4-10-enhance-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover one-character payload mutations
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          ROOT = Path('data/shows/stardust-station/encoded')
          ALPH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          TARGETS = {
              'pages_e06_p07_p12.json.gzb64': (6, list(range(7,13)), 'insert'),
              'pages_e06_p13_p18.json.gzb64': (6, list(range(13,19)), 'substitute'),
              'pages_e06_p19_p22.json.gzb64': (6, list(range(19,23)), 'insert'),
              'pages_e07_p01_p06.json.gzb64': (7, list(range(1,7)), 'substitute'),
              'pages_e07_p07_p12.json.gzb64': (7, list(range(7,13)), 'insert'),
              'pages_e09_p01_p06.json.gzb64': (9, list(range(1,7)), 'insert'),
              'pages_e09_p19_p22.json.gzb64': (9, list(range(19,23)), 'substitute'),
              'pages_e10_p07_p12.json.gzb64': (10, list(range(7,13)), 'substitute'),
          }

          def decode_candidate(s, issue, pages):
              try:
                  raw = base64.b64decode(s, validate=True)
                  obj = json.loads(gzip.decompress(raw).decode('utf-8'))
              except Exception:
                  return None
              if not isinstance(obj, list) or [p.get('page') for p in obj] != pages:
                  return None
              source = f'Stardust Station — Issue {issue} Enhanced Production Script, 2026-08-22'
              for p in obj:
                  n = p.get('page')
                  if p.get('issue') != issue or p.get('episode') != f'S1E{issue:02d}':
                      return None
                  if p.get('id') != f'SDS_S1E{issue:02d}_P{n:02d}' or p.get('source') != source:
                      return None
              return obj

          def recover(path, issue, pages, mode):
              s = ''.join(path.read_text(encoding='utf-8').split())
              if decode_candidate(s, issue, pages):
                  print(path.name, 'already valid')
                  return s
              if mode == 'insert':
                  # Insert before terminal padding; a deleted base64 data character
                  # shifts all later quartets until the exact character is restored.
                  end = len(s.rstrip('='))
                  for pos in range(end + 1):
                      left, right = s[:pos], s[pos:]
                      for ch in ALPH:
                          cand = left + ch + right
                          if decode_candidate(cand, issue, pages):
                              print(path.name, 'recovered by insertion', pos, ch)
                              return cand
              elif mode == 'substitute':
                  end = len(s.rstrip('='))
                  for pos in range(end):
                      old = s[pos]
                      if old not in ALPH:
                          continue
                      left, right = s[:pos], s[pos+1:]
                      for ch in ALPH:
                          if ch == old:
                              continue
                          cand = left + ch + right
                          if decode_candidate(cand, issue, pages):
                              print(path.name, 'recovered by substitution', pos, old, '->', ch)
                              return cand
              raise SystemExit(f'Could not uniquely recover {path.name} with expected one-character {mode}')

          for name, (issue, pages, mode) in TARGETS.items():
              path = ROOT / name
              fixed = recover(path, issue, pages, mode)
              # Store canonical one-line base64 after recovery.
              path.write_text(fixed, encoding='utf-8')

          print('Recovered all targeted Stardust payloads')
          PY
      - name: Validate complete Stardust chain after repair
        run: |
          python tools/validate_stardust_station.py
          python tools/validate_stardust_station_issue2.py
          python tools/validate_stardust_station_issue3.py
          python tools/validate_stardust_station_arc.py
      - name: Commit repaired payloads and remove repair workflow
        shell: bash
        run: |
          git config user.name 'stardust-payload-repair'
          git config user.email 'stardust-payload-repair@users.noreply.github.com'
          git rm .github/workflows/repair-stardust-payloads.yml
          git add data/shows/stardust-station/encoded
          git commit -m 'Repair Stardust Issue 4-10 payload transport'
          git push origin HEAD:stardust-issues4-10-enhance-20260822
