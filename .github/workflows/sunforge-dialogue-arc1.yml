name: Sunforge dialogue rewrite issues 1-4
on:
  push:
    branches: [sunforge-dialogue-pass-20260914]
    paths: ['.github/workflows/sunforge-dialogue-arc1.yml']
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunforge-dialogue-pass-20260914
      - name: Rewrite dialogue
        run: |
          python - <<'PY'
          import json, pathlib
          raw = r'''{
            "SUN_S1E01_P01": [["Scarred patron","Varnok."],["Kael","I'm sorry. You've got the wrong man."],["Scarred patron","Don't smile at me."],["Kael","I wasn't."],["Eva","Do you know him?"],["Kael","I was hoping you did."]],
            "SUN_S1E01_P02": [["Eva","Water or explanation?"],["Kael","Water."],["Eva","Good, because I don't have the explanation."],["Kael","That worked out."],["Eva","He knew your face."],["Kael","He knew a face. Mine happened to be standing there."],["Eva","That distinction is doing a lot of work."],["Kael","It got me water."],["Eva","You're not curious?"],["Kael","I'm thirsty first."]],
            "SUN_S1E01_P03": [["Jessa","It's too hot here for you. We're leaving."],["Kael","We?"],["Jessa","Yes."],["Kael","There isn't a we."],["Jessa","Fine. I'm leaving. You can come with me."],["Kael","That's different."],["Jessa","Not from where I'm standing."],["Eva","And me?"],["Jessa","I haven't decided whether you're helping."],["Eva","I am."],["Jessa","You answered that awfully fast."]],
            "SUN_S1E01_P04": [["Marcus","Leave him."],["Kael","He's still alive."],["Marcus","Not for long."],["Kael","Then give me a hand."],["Marcus","You always did have to make trouble, Varnok."],["Kael","I don't know Varnok. I know this man is choking. Lift his shoulders or step back."]],
            "SUN_S1E01_P05": [["Marcus","You burned my brother out of this place."],["Kael","I've never been here before."],["Marcus","Look me in the face and say that."],["Kael","I'm looking at him right now."],["Eva","Water."],["Kael","Thanks. Easy. Just wet your mouth."],["Marcus","I'm talking to you."],["Kael","I know. That's making this harder."]],
            "SUN_S1E01_P06": [["Jessa","Kael."],["Kael","One minute."],["Jessa","You don't have one."],["Marcus","Who the hell are you?"],["Kael","Kael Mack."],["Marcus","That's a lie."],["Kael","You can keep thinking that. It's still my name."],["Jessa","Rig. Now."],["Kael","She isn't coming."],["Eva","Bit late."],["Kael","For what?"],["Eva","I packed."],["Jessa","Of course you did."],["Kael","No."],["Jessa","Argue while moving."]],
            "SUN_S1E01_P07": [["Eva","He had this before you walked in."],["Kael","Where'd you get it?"],["Eva","Table by the wall."],["Jessa","You stole it."],["Eva","I rescued it from being evidence nobody noticed."],["Jessa","That's stealing with adjectives."],["Eva","It says Varnok would come through today."],["Kael","Then whoever wrote it got the name wrong."],["Eva","Only the name."],["Jessa","The day is the part I don't like."],["Eva","Thank you."],["Jessa","I wasn't agreeing with you. I was narrowing the problem."],["Jessa","When did you pack?"],["Eva","During the fight."],["Jessa","Before the hanging?"],["Eva","I travel light."],["Jessa","You were leaving."],["Eva","I was open to it."],["Kael","Do either of you know where we're going?"],["Jessa","Away."],["Eva","Good start."]],
            "SUN_S1E02_P01": [["Los Lagartos","General Saye."],["Kael","I don't know him."],["Los Lagartos","You took your time."],["Kael","That would be his business."],["Eva","Two."],["Jessa","Don't."],["Eva","I didn't even say anything."],["Jessa","You said 'two.'"],["Kael","Could somebody point me toward water before I become a third person?"]],
            "SUN_S1E02_P02": [["Los Lagartos","Blood claim or the vote. Say which stands."],["Kael","Why would you ask me?"],["Los Lagartos","Because you left us with the choice."],["Kael","Then you already had it."],["Los Lagartos","Saye would know what he meant."],["Kael","I'm sure he would. I don't."],["Eva","They think you're making them prove something."],["Kael","I'm trying to get out of the chair."],["Eva","That's why they think you're making them prove something."],["Kael","The pistol on the table concerns me more."]],
            "SUN_S1E02_P03": [["Veyra","How long has he been Kael?"],["Eva","Longer than I've known him."],["Veyra","That's not very long."],["Jessa","Long enough to answer the question."],["Veyra","No. Long enough to repeat his answer."],["Eva","You have a different one?"],["Veyra","I have four names and the same face."],["Eva","We've got two."],["Veyra","Then you're new."],["Jessa","If you think he's lying, ask him."],["Veyra","I have."],["Eva","And?"],["Veyra","He says Kael."],["Jessa","Sounds like he answered."],["Veyra","Sounds like you want that to be enough."]],
            "SUN_S1E02_P04": [["Los Lagartos","He chose."],["Kael","He was about to shoot a man."],["Los Lagartos","Saye always protected—"],["Kael","Then Saye and I agree on one thing. Don't shoot people across dinner."],["Sand Rider","They'll call that a judgment."],["Kael","They can call it supper if they put the gun away."],["Sand Rider","You are going to have a long day."],["Kael","I was beginning to suspect that."]],
            "SUN_S1E02_P05": [["Kael","You keep asking what Saye would decide. Where is Saye?"],["Los Lagartos","Gone."],["Kael","Then you have a problem he can't answer."],["Los Lagartos","You're here."],["Kael","By accident."],["Los Lagartos","What would you do?"],["Kael","Leave before somebody else draws a gun."],["Eva","That is not helpful."],["Kael","It's honest."],["Jessa","Take what you can get."]],
            "SUN_S1E02_P06": [["Eva","The preacher got there three days before us."],["Jessa","That by itself means nothing."],["Eva","He told them Saye would have black hair, a dark coat, and deny being Saye."],["Jessa","The last part is less nothing."],["Kael","Could be a good guess."],["Eva","You are working very hard to make this boring."],["Kael","I'm working very hard to keep bad guesses from becoming facts."],["Jessa","That is annoyingly fair."],["Eva","Do you believe him?"],["Jessa","About Saye? Yes."],["Eva","Everything?"],["Jessa","I don't know everything."],["Kael","Good news. I can hear you."],["Eva","We know."]],
            "SUN_S1E03_P01": [["Isabelle","Merrit."],["Kael","No, ma'am."],["Isabelle","Don't."],["Kael","Don't what?"],["Isabelle","Stand there like you don't know me."],["Jessa","He doesn't know anybody here."],["Eva","I do know the rule says no names."],["Isabelle","The rule can survive one name."],["Kael","Can supper?"]],
            "SUN_S1E03_P02": [["Isabelle","You left us with chains on the doors."],["Kael","I wasn't here."],["Isabelle","You even sound like him when you make something impossible sound tidy."],["Kael","I don't know what he sounded like."],["Isabelle","Don't do that."],["Kael","I'm not trying to hurt you."],["Isabelle","That's not the same as not doing it."],["Kael","What did you need to say to Merrit?"],["Isabelle","That he left us here."],["Kael","Then say it. I can at least listen."]],
            "SUN_S1E03_P03": [["Eva","Who told you he was coming?"],["Isabelle","A preacher. Samuel, if that was his name."],["Jessa","What did he ask for?"],["Isabelle","Nothing. Sat at the bar and let me do most of the talking."],["Eva","And then?"],["Isabelle","Then he said Merrit might come back before the flare."],["Jessa","Did you tell him what Merrit looked like?"],["Isabelle","I showed him the photograph after he said the name."],["Eva","So he already knew."],["Isabelle","He knew enough."],["Jessa","That's better than a theory."],["Eva","It's worse than a theory."]],
            "SUN_S1E03_P04": [["Isabelle","He said he'd come back for these."],["Kael","People say that."],["Isabelle","That's a very forgiving answer."],["Kael","No. It just happens to be true."],["Isabelle","You really don't want to know what's in the letter?"],["Kael","Not if it was written for him."],["Eva","We can go."],["Isabelle","Stay."],["Eva","Why?"],["Isabelle","Because you've been climbing through other people's business all afternoon. You can stand still for the part that hurts."]],
            "SUN_S1E03_P05": [["Eva","What if we give them a name Samuel couldn't know? Something ridiculous."],["Kael","No."],["Eva","You don't even know the name."],["Kael","Doesn't matter."],["Eva","It could tell us whether somebody is carrying the story."],["Kael","And Isabelle gets to be the bait?"],["Eva","I didn't say bait."],["Jessa","You meant bait."],["Eva","I meant—"],["Kael","I know what you meant."],["Isabelle","The preacher got here first. Don't make me useful twice."],["Eva","All right."]],
            "SUN_S1E03_P06": [["Isabelle","If you find Samuel, tell him I remember his face."],["Kael","I think Eva intends to."],["Eva","Absolutely."],["Jessa","We have 'Samuel,' maybe, and a coat."],["Eva","And three towns."],["Jessa","Two and a club."],["Eva","You're being difficult on purpose."],["Jessa","I'm trying to keep your notebook from becoming scripture."],["Kael","Can we go before it gets a religion?"],["Eva","Do you think he really doesn't want to know?"],["Jessa","He keeps listening."],["Eva","Exactly."],["Jessa","He also keeps leaving."],["Eva","That is not exactly."]],
            "SUN_S1E04_P01": [["Ray","Architect."],["Kael","No."],["Eva","I had engineer."],["Jessa","You had magistrate."],["Eva","Before I changed it."],["Kael","You've been gambling on this?"],["Jessa","Not money."],["Eva","We hadn't set odds."],["Ray","You brought a child."],["Eva","Nobody brought me."],["Kael","That's the problem."],["Ray","Sit."],["Kael","I'd rather not."]],
            "SUN_S1E04_P02": [["Ray","The preacher said you'd come today."],["Eva","Samuel?"],["Ray","He used the name."],["Kael","What did he say I was coming to do?"],["Ray","Confess."],["Kael","That's ambitious."],["Ray","You sold us out."],["Kael","I didn't."],["Ray","Same hands. Same way of watching the door."],["Eva","Did Samuel tell you that too?"],["Ray","No."]],
            "SUN_S1E04_P03": [["Samuel","Hold still. You're going to make me tie it twice."],["Boy","It hurts."],["Samuel","I know. That's why I'm hurrying badly."],["Eva","Isabelle Torres."],["Samuel","I heard you."],["Eva","Good."],["Samuel","Give me until the bandage is done."],["Jessa","You've had days."],["Samuel","He hasn't."],["Boy","Who are they?"],["Samuel","People with questions."],["Eva","A lot of them."],["Samuel","I had gathered."]],
            "SUN_S1E04_P04": [["Eva","Varnok."],["Samuel","Me."],["Eva","Saye."],["Samuel","Also me."],["Jessa","The names were real."],["Samuel","Yes."],["Eva","But you told people Kael was coming."],["Samuel","I told them a man matching him might be."],["Jessa","And that he'd deny it."],["Samuel","At Cinder Basin, yes."],["Eva","Merrit?"],["Samuel","Not mine."],["Eva","You told Isabelle he was coming."],["Samuel","After Veyra heard the Merrit story. I pushed it. I didn't start it."],["Jessa","Why?"],["Samuel","Because Veyra thought one of those men was Kael, and I was good at making people talk."],["Eva","You were good at making them hurt."],["Samuel","Yes."],["Jessa","Did they know they were helping you?"],["Samuel","No."]],
            "SUN_S1E04_P05": [["Veyra","I thought one name would catch."],["Kael","Catch what?"],["Veyra","Something you knew. A place. A person. A lie you had rehearsed badly."],["Kael","And when none did?"],["Veyra","I assumed I had the wrong bait."],["Ray","You used me as bait."],["Veyra","Yes."],["Ray","That's all?"],["Veyra","No. It's all I can say without pretending it was better than it was."],["Kael","Did it tell you anything about me?"],["Veyra","That you keep saying Kael."],["Kael","I've noticed."],["Veyra","I didn't believe you."],["Kael","Do you now?"],["Veyra","I believe the other answers failed."]],
            "SUN_S1E04_P06": [["Eva","Varnok?"],["Veyra","Ours."],["Eva","Saye?"],["Veyra","Ours."],["Eva","Architect?"],["Veyra","Ours."],["Eva","Merrit."],["Veyra","No."],["Samuel","I made Isabelle expect him. I didn't give her the man."],["Eva","So somebody else put Kael's face in that story first."],["Veyra","Or Isabelle did."],["Eva","You don't know."],["Veyra","No."],["Kael","Can we go?"],["Jessa","We?"],["Kael","I said can we go."],["Eva","You did."],["Kael","I regret it already."],["Jessa","You'll live."],["Eva","Probably."],["Kael","That wasn't the part I regretted."],["Eva","You still think this is people seeing what they want?"],["Jessa","I think that happens a lot."],["Eva","That's not what I asked."],["Jessa","I know."]]
          }'''
          repl=json.loads(raw)
          base=pathlib.Path('data/shows/sunforge-outlaw-s1')
          for issue in range(1,5):
              path=base/f'pages_e{issue:02d}.json'
              pages=json.loads(path.read_text(encoding='utf-8'))
              for page in pages:
                  if page['id'] in repl:
                      page['dialogueInline']=[{'speaker':s,'text':t} for s,t in repl[page['id']]]
              path.write_text(json.dumps(pages,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit rewrite and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sunforge-dialogue-arc1.yml
          git add data/shows/sunforge-outlaw-s1/pages_e01.json data/shows/sunforge-outlaw-s1/pages_e02.json data/shows/sunforge-outlaw-s1/pages_e03.json data/shows/sunforge-outlaw-s1/pages_e04.json
          git commit -m 'Rewrite Sunforge dialogue issues 1-4'
          git push origin HEAD:sunforge-dialogue-pass-20260914
