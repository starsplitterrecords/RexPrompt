name: Build production review PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'tools/export_review_pdfs.py'
      - '.github/workflows/build-review-pdfs.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'tools/export_review_pdfs.py'
      - '.github/workflows/build-review-pdfs.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RexPrompt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Include active advanced-development packages
        run: |
          python - <<'PY'
          import json, pathlib, subprocess

          manifest_path = pathlib.Path('data/shows.json')
          current = json.loads(manifest_path.read_text(encoding='utf-8'))
          current_ids = {entry.get('id') for entry in current}

          active_development = [
              {
                  'id': 'echoes-forgotten-war-s1',
                  'branch': 'origin/enhance/echoes-s1',
                  'package': 'data/shows/echoes-forgotten-war-s1',
              },
          ]

          for source in active_development:
              if source['id'] in current_ids:
                  continue

              branch_check = subprocess.run(
                  ['git', 'rev-parse', '--verify', '--quiet', source['branch']],
                  stdout=subprocess.PIPE,
                  text=True,
              )
              if branch_check.returncode != 0:
                  print(f"Advanced-development branch unavailable: {source['branch']}")
                  continue

              branch_manifest = json.loads(subprocess.check_output(
                  ['git', 'show', f"{source['branch']}:data/shows.json"],
                  text=True,
              ))
              entry = next((item for item in branch_manifest if item.get('id') == source['id']), None)
              if not entry:
                  print(f"Advanced-development entry not registered on {source['branch']}: {source['id']}")
                  continue

              archive = subprocess.Popen(
                  ['git', 'archive', source['branch'], source['package']],
                  stdout=subprocess.PIPE,
              )
              try:
                  subprocess.run(['tar', '-x'], stdin=archive.stdout, check=True)
              finally:
                  if archive.stdout:
                      archive.stdout.close()
              if archive.wait() != 0:
                  raise SystemExit(f"Could not extract {source['package']} from {source['branch']}")

              source_commit = subprocess.check_output(
                  ['git', 'rev-parse', source['branch']], text=True
              ).strip()
              package_path = pathlib.Path(source['package'])
              (package_path / 'review_branch_source.json').write_text(
                  json.dumps({
                      'reviewSourceType': 'active-advanced-development-branch',
                      'seriesId': source['id'],
                      'sourceBranch': source['branch'].removeprefix('origin/'),
                      'sourceCommit': source_commit,
                      'note': 'This production is active advanced development and is not yet registered on main. The review package includes its current registered development branch without modifying main production data.',
                  }, indent=2) + '\n',
                  encoding='utf-8',
              )
              current.append(entry)
              current_ids.add(source['id'])
              print(f"Included advanced-development production {source['id']} from {source['branch']} at {source_commit}")

          manifest_path.write_text(
              json.dumps(current, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5

      - name: Normalize and recover referenced payloads for review only
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess

          targets = [
              'data/shows/vikings-2026-s1/encoded/pages_e03_p13_p18.json.gzb64',
              'data/shows/vikings-2026-s1/encoded/pages_e03_p19_p24.json.gzb64',
          ]

          def normalize(text):
              data = re.sub(r'\s+', '', text).rstrip('=')
              if len(data) % 4 == 1:
                  raise ValueError(f'impossible Base64 data length {len(data)} (mod 4 = 1)')
              return data + ('=' * ((4 - len(data) % 4) % 4))

          def decode_text(text):
              raw = normalize(text)
              decoded = json.loads(gzip.decompress(base64.b64decode(raw)).decode('utf-8'))
              return raw, decoded

          def encode_units(units):
              payload = json.dumps(units, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              return base64.b64encode(gzip.compress(payload, mtime=0)).decode('ascii')

          results = []
          for filename in targets:
              path = pathlib.Path(filename)
              if not path.exists():
                  continue
              current_text = path.read_text(encoding='utf-8')
              current_error = None
              try:
                  canonical, decoded = decode_text(current_text)
                  if canonical != re.sub(r'\s+', '', current_text):
                      path.write_text(canonical, encoding='utf-8')
                      results.append({
                          'file': filename,
                          'status': 'padding-normalized',
                          'unitCount': len(decoded) if isinstance(decoded, list) else len(decoded or {}),
                      })
                  continue
              except Exception as exc:
                  current_error = str(exc)

              commits = subprocess.check_output(
                  ['git', 'log', '--all', '--format=%H', '--', filename], text=True
              ).splitlines()
              valid = {}
              for commit in commits:
                  try:
                      historical = subprocess.check_output(
                          ['git', 'show', f'{commit}:{filename}'], text=True,
                          stderr=subprocess.DEVNULL,
                      )
                      canonical, decoded = decode_text(historical)
                  except Exception:
                      continue
                  digest = hashlib.sha256(
                      json.dumps(decoded, sort_keys=True, ensure_ascii=False).encode('utf-8')
                  ).hexdigest()
                  valid.setdefault(digest, {
                      'canonical': canonical,
                      'decoded': decoded,
                      'commits': [],
                  })['commits'].append(commit)

              if len(valid) == 1:
                  candidate = next(iter(valid.values()))
                  path.write_text(candidate['canonical'], encoding='utf-8')
                  results.append({
                      'file': filename,
                      'status': 'historical-recovery',
                      'currentError': current_error,
                      'recoveredFromCommit': candidate['commits'][0],
                      'equivalentValidCommits': candidate['commits'],
                      'unitCount': len(candidate['decoded']) if isinstance(candidate['decoded'], list) else len(candidate['decoded'] or {}),
                  })
                  continue

              placeholder_id = 'SOURCE_ERROR_' + path.stem.replace('.', '_').upper()
              placeholder = [{
                  'id': placeholder_id,
                  'summary': 'SOURCE DATA ERROR: this manifest-referenced RexPrompt payload could not be decoded, and no single unambiguous valid historical payload was available. No story content has been inferred for this missing span.',
                  'sourceReviewError': {
                      'file': filename,
                      'currentError': current_error,
                      'validHistoricalVariants': len(valid),
                      'historyCommitsChecked': len(commits),
                  },
              }]
              path.write_text(encode_units(placeholder), encoding='utf-8')
              results.append({
                  'file': filename,
                  'status': 'source-error-placeholder',
                  'currentError': current_error,
                  'validHistoricalVariants': len(valid),
                  'historyCommitsChecked': len(commits),
              })

          if results:
              note = pathlib.Path('data/shows/vikings-2026-s1/review_source_recovery.json')
              note.write_text(json.dumps({
                  'reviewOnlyRecovery': True,
                  'note': 'The review build never invents missing story data. It normalizes lossless Base64 padding, uses history only when exactly one valid decoded payload exists, and otherwise inserts a visible source-error placeholder. Repository production data is not modified by the review build.',
                  'results': results,
              }, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(results, indent=2))
          PY

      - name: Include advanced-development Markdown in review data
        run: |
          python - <<'PY'
          import json, pathlib
          for package in pathlib.Path('data/shows').iterdir():
              if not package.is_dir():
                  continue
              files = sorted(package.glob('*.md'))
              if not files:
                  continue
              payload = {
                  'sourceType': 'advanced-development-markdown',
                  'documents': [
                      {'file': p.name, 'content': p.read_text(encoding='utf-8')}
                      for p in files
                  ],
              }
              (package / 'review_markdown_extras.json').write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
              )
          PY

      - name: Build all current production review PDFs
        run: python tools/export_review_pdfs.py --out dist/review-pdfs

      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: rexprompt-production-review-pdfs-${{ github.sha }}
          path: dist/review-pdfs/
          if-no-files-found: error
          retention-days: 90

# Validation branch changes only review-build behavior; production data is not modified.
