name: Apply Low Tide naming pass

on:
  push:
    branches:
      - low-tide-dedicated-naming-pass
    paths-ignore:
      - data/shows/low-tide-signal/naming_inventory.md
      - data/shows/low-tide-signal/naming_work/**
      - data/shows/low-tide-signal/encoded/*.gzb64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Re-encode naming pass and verify visible terminology
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          root=Path("data/shows/low-tide-signal")
          specs=[
            ("C01-C03", root/"pages_ch01_ch03_compiled.json", None),
            ("C04", root/"naming_work/pages_c04.json", root/"encoded/pages_c04_between_runs_enhanced.json.gzb64"),
            ("C05", root/"naming_work/pages_c05.json", root/"encoded/pages_c05_return_tide_enhanced.json.gzb64"),
            ("C06", root/"naming_work/pages_c06.json", root/"encoded/pages_c06_after_the_water_enhanced.json.gzb64"),
            ("C07", root/"naming_work/pages_c07.json", root/"encoded/pages_c07_last_low_tide_enhanced.json.gzb64"),
          ]
          expected={"C04":26,"C05":24,"C06":24,"C07":26}

          def load_json(path):
              return json.loads(path.read_text())

          def pages_from(obj):
              if isinstance(obj,list): return obj
              for k in ("pages","scenes","items"):
                  if isinstance(obj,dict) and isinstance(obj.get(k),list): return obj[k]
              raise TypeError(f"Unsupported package shape: {type(obj)}")

          packages={}
          for label,path,encoded in specs:
              obj=load_json(path)
              pages=pages_from(obj)
              packages[label]=obj
              if label in expected and len(pages)!=expected[label]:
                  raise SystemExit(f"{label} page count changed: {len(pages)} != {expected[label]}")
              if encoded:
                  raw=(json.dumps(obj,indent=2,ensure_ascii=False)+"\n").encode("utf-8")
                  encoded.write_text(base64.b64encode(gzip.compress(raw,mtime=0)).decode("ascii")+"\n")

          reach=re.compile(r"\bReach\b",re.I)
          leftovers=[]
          rows=[]
          terms=re.compile(r"\b(?:Tide Town|Low Tide District|Promise District|Harbor Phase East|Sector 14|Deep Sector|the District)\b",re.I)

          for label,obj in packages.items():
              for page in pages_from(obj):
                  pid=str(page.get("id","?"))
                  def walk(v,p):
                      if isinstance(v,str):
                          if reach.search(v):
                              leftovers.append((label,pid,p,v))
                          if terms.search(v):
                              rows.append((label,pid,p,v.replace("\n"," ")))
                      elif isinstance(v,list):
                          for i,x in enumerate(v): walk(x,f"{p}[{i}]")
                      elif isinstance(v,dict):
                          for k,x in v.items(): walk(x,f"{p}.{k}" if p else k)
                  walk(page,"")

          if leftovers:
              for row in leftovers:
                  print("LEFTOVER",row)
              raise SystemExit(f"Visible Reach terminology remains in {len(leftovers)} page fields")

          out=[
            "# Low Tide final naming inventory","",
            "Generated from the post-pass active story packages. Reach must have zero visible page-text occurrences.","",
            "| Package | Page | Field | Text |","|---|---|---|---|"
          ]
          for label,pid,path,text in rows:
              out.append(f"| {label} | {pid} | {path} | {text.replace('|','\\|')} |")
          out += ["",f"Visible Reach occurrences: **{len(leftovers)}**",f"Tracked naming occurrences: **{len(rows)}**",""]
          (root/"naming_inventory.md").write_text("\n".join(out),encoding="utf-8")
          PY
      - name: Commit active encoded packages
        run: |
          git config user.name "starsplitterrecords"
          git config user.email "actions@users.noreply.github.com"
          git add data/shows/low-tide-signal/encoded/*.gzb64 data/shows/low-tide-signal/naming_inventory.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bake Low Tide naming pass into active packages"
          git push origin HEAD:${{ github.ref_name }}
