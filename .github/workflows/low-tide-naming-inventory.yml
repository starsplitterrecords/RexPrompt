name: Low Tide naming inventory

on:
  push:
    branches:
      - low-tide-dedicated-naming-pass
    paths-ignore:
      - data/shows/low-tide-signal/naming_inventory.md

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Decode Low Tide packages and inventory naming language
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          root = Path("data/shows/low-tide-signal")
          packages = [
              ("C01-C03", root / "pages_ch01_ch03_compiled.json", None),
              ("C04", root / "encoded/pages_c04_between_runs_enhanced.json.gzb64", "gzip-base64"),
              ("C05", root / "encoded/pages_c05_return_tide_enhanced.json.gzb64", "gzip-base64"),
              ("C06", root / "encoded/pages_c06_after_the_water_enhanced.json.gzb64", "gzip-base64"),
              ("C07", root / "encoded/pages_c07_last_low_tide_enhanced.json.gzb64", "gzip-base64"),
          ]

          terms = re.compile(r"\b(?:Reach|District|Tide Town|Low Tide Town|Promise|Sector)\b", re.I)

          def load(path, encoding):
              if encoding == "gzip-base64":
                  raw = base64.b64decode(path.read_text().strip())
                  return json.loads(gzip.decompress(raw).decode("utf-8"))
              return json.loads(path.read_text())

          def pages_from(obj):
              if isinstance(obj, list):
                  return obj
              for k in ("pages","scenes","items"):
                  if isinstance(obj, dict) and isinstance(obj.get(k), list):
                      return obj[k]
              if isinstance(obj, dict):
                  vals=[v for v in obj.values() if isinstance(v,dict) and v.get("id")]
                  if vals:
                      return vals
              raise TypeError(type(obj))

          rows=[]
          for label,path,enc in packages:
              obj=load(path,enc)
              for page in pages_from(obj):
                  pid=str(page.get("id","?"))
                  def walk(v,p):
                      if isinstance(v,str):
                          if terms.search(v):
                              rows.append((label,pid,p,v.replace("\n"," ")))
                      elif isinstance(v,list):
                          for i,x in enumerate(v): walk(x,f"{p}[{i}]")
                      elif isinstance(v,dict):
                          for k,x in v.items(): walk(x,f"{p}.{k}" if p else k)
                  walk(page,"")

          out=["# Low Tide naming inventory","",
               "Generated from the active production packages. Every row contains current text with naming vocabulary that may matter to the dedicated pass.","",
               "| Package | Page | Field | Current text |",
               "|---|---|---|---|"]
          for label,pid,path,text in rows:
              esc=text.replace("|","\\|")
              out.append(f"| {label} | {pid} | `{path}` | {esc} |")
          out += ["", f"Total occurrences: **{len(rows)}**", ""]
          (root/"naming_inventory.md").write_text("\n".join(out),encoding="utf-8")
          PY
      - name: Commit inventory
        run: |
          git config user.name "starsplitterrecords"
          git config user.email "actions@users.noreply.github.com"
          git add data/shows/low-tide-signal/naming_inventory.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inventory Low Tide naming language"
          git push origin HEAD:${{ github.ref_name }}
