name: Sunforge causality cleanup

on:
  push:
    branches:
      - sunforge-causality-pass-20260914
    paths:
      - '.github/workflows/sunforge-causality-cleanup.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunforge-causality-pass-20260914
          fetch-depth: 0

      - name: Tighten causality repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('data/shows/sunforge-outlaw-s1')

          # Issue 4: keep causal explanation in the scene without making characters recite the model.
          p=base/'pages_e04.json'; data=json.loads(p.read_text())
          p4=next(x for x in data if x['id']=='SUN_S1E04_P04')
          for line in p4['dialogueInline']:
              if line['speaker']=='Samuel' and line['text']=='Real people. Real grievances. Veyra wanted to know whether one of them made Kael react like he knew more than he should.':
                  line['text']="Every one. Veyra wanted to see if Kael knew something he shouldn't."
                  break
          else: raise RuntimeError('Issue 4 P4 target line missing')

          p6=next(x for x in data if x['id']=='SUN_S1E04_P06')
          old=p6['dialogueInline']
          start=next(i for i,x in enumerate(old) if x['speaker']=='Veyra' and x['text'].startswith('A trader out of the Mirage'))
          end=next(i for i,x in enumerate(old) if i>start and x['speaker']=='Veyra' and x['text']=='No.')
          p6['dialogueInline']=old[:start]+[
              {'speaker':'Veyra','text':'Merrit came to me from the Mirage. Isabelle already had the photograph.'},
              {'speaker':'Samuel','text':'I only told her he might come back.'},
              {'speaker':'Eva','text':'So Merrit was there before either of you touched it.'},
              {'speaker':'Veyra','text':'Yes.'},
          ]+old[end+1:]
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          # Issue 8: remove development-language staging and the duplicate hedge.
          p=base/'pages_e08.json'; data=json.loads(p.read_text())
          p1=next(x for x in data if x['id']=='SUN_S1E08_P01')
          p1['panelPlan'][0]['text']='Wide Long Mile: Veyra and Samuel have caught up after Rowan Hold. Their bedrolls remain separate from the rig and they walk a few paces apart, making the new arrangement visibly provisional.'
          p2=next(x for x in data if x['id']=='SUN_S1E08_P02')
          lines=p2['dialogueInline']
          removed=False
          out=[]
          for line in lines:
              if not removed and line['speaker']=='Veyra' and line['text']=='Maybe.':
                  removed=True
                  continue
              out.append(line)
          if not removed: raise RuntimeError('Issue 8 P2 duplicate hedge missing')
          p2['dialogueInline']=out
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          for issue in (4,8):
              json.loads((base/f'pages_e{issue:02d}.json').read_text())
          print('Causality cleanup complete')
          PY

      - name: Commit cleanup and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sunforge-causality-cleanup.yml
          git add data/shows/sunforge-outlaw-s1/pages_e04.json data/shows/sunforge-outlaw-s1/pages_e08.json
          git commit -m "Tighten Sunforge causal exposition"
          git push origin HEAD:sunforge-causality-pass-20260914
